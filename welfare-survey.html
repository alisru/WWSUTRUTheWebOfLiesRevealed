<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Welfare Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEEF0; --paper-2:#F6F7F8; --ink:#16202B; --ink-soft:#5A6672;
  --rule:#D3D7DC; --focus:#1B6BD6;
  --p1:#6A5A96; --p2:#1F7A6B; --p3:#7A5C3E; --p4:#B98B22;
  --p5:#2E5B8A; --p6:#8E3552; --p7:#CE6146;
  --disp:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- masthead ---------- */
header.mast{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:40}
.mast-in{max-width:860px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-0.01em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.mini{display:flex;gap:3px;flex:1;min-width:0}
.mini a{flex:1;height:26px;border-radius:2px;background:var(--paper-2);border:1px solid var(--rule);position:relative;overflow:hidden;text-decoration:none;display:block}
.mini a i{position:absolute;inset:0 auto 0 0;display:block;opacity:.85}
.mini a b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink);mix-blend-mode:multiply}
.mini a[aria-current]{outline:2px solid var(--ink);outline-offset:1px}

/* ---------- hub ---------- */
.hero{padding:44px 0 26px}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(32px,6vw,52px);line-height:1.02;letter-spacing:-0.025em;margin:0 0 14px}
.hero p{margin:0 0 6px;max-width:56ch;color:var(--ink-soft)}
.hero .lede{color:var(--ink);font-size:19px}

.bands{margin:26px 0 10px;border-top:1px solid var(--rule)}
.band{display:block;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);position:relative;padding:16px 14px 16px 0;overflow:hidden}
.band .fill{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.13;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.band .row{position:relative;display:flex;align-items:baseline;gap:14px}
.band .num{font-family:var(--mono);font-size:11px;color:var(--ink-soft);flex:none;padding-left:14px;white-space:nowrap}
.band .nm{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-0.015em;flex:none}
.band .bl{color:var(--ink-soft);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .pc{font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:none}
.band::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.band:hover .nm{text-decoration:underline;text-underline-offset:3px}
.band:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media(max-width:620px){.band .bl{display:none}}

.hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 60px}
@media(max-width:620px){.hubgrid{grid-template-columns:1fr}}
.tile{display:block;text-decoration:none;color:inherit;border:1px solid var(--rule);background:var(--paper-2);padding:16px;border-radius:3px}
.tile:hover{border-color:var(--ink)}
.tile h3{font-family:var(--disp);font-weight:600;font-size:17px;margin:0 0 4px}
.tile p{margin:0;font-size:14px;color:var(--ink-soft)}
.tile .st{font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:block;margin-top:8px}

/* ---------- plane page ---------- */
.planehead{padding:30px 0 18px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.planehead h1{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,42px);letter-spacing:-0.025em;margin:0 0 8px;line-height:1.05}
.planehead p{margin:0;color:var(--ink-soft);max-width:56ch}

details.sub{border-bottom:1px solid var(--rule)}
details.sub>summary{cursor:pointer;list-style:none;padding:16px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sub .sid{font-family:var(--mono);font-size:11px;color:var(--ink-soft);width:2.6em;flex:none}
.sub .snm{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-0.015em;flex:1;min-width:8em}
.sub .saddr{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex-basis:100%;padding-left:3.6em;margin-top:-4px;letter-spacing:.02em}
.sub .sdot{font-family:var(--mono);font-size:11px;flex:none;color:var(--ink-soft)}
details.sub[open]>summary{border-bottom:1px dashed var(--rule)}
.subbody{padding:6px 0 26px}

.scale{padding:16px 0;border-bottom:1px dotted var(--rule)}
.scale:last-of-type{border-bottom:none}
.slabel{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.q{margin:0 0 6px;font-size:16.5px}
.q .tag{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-right:6px}
.seg{display:flex;gap:4px;margin:6px 0 14px;flex-wrap:wrap;align-items:center}
.seg>input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.seg label{font-family:var(--mono);font-size:13px;min-width:38px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--paper-2);cursor:pointer;border-radius:2px;user-select:none}
.seg label:hover{border-color:var(--ink-soft)}
.seg>input[type=radio]:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg>input[type=radio]:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.seg .lastwrap{display:flex;align-items:center;gap:6px;margin-left:6px}
.seg .lastwrap span{font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.seg .lastwrap input[type=text]::placeholder{color:#9AA3AC}
.seg .lastwrap input[type=text]{font-family:var(--mono);font-size:12px;width:120px;height:34px;padding:0 8px;border:1px solid var(--rule);background:var(--paper-2);border-radius:2px;color:var(--ink)}
.seg .clr{font-family:var(--mono);font-size:11px;background:none;border:none;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:0 4px}

.flags{margin-top:18px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2)}
.flags>summary{cursor:pointer;list-style:none;padding:11px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px}
.flags>summary::-webkit-details-marker{display:none}
.flags>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.flagbody{padding:4px 14px 18px;border-top:1px solid var(--rule)}
.flagbody h4{font-family:var(--disp);font-weight:600;font-size:15px;margin:16px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chips>input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.chips label{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border:1px solid var(--rule);background:var(--paper);border-radius:99px;cursor:pointer}
.chips>input[type=radio]:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips>input[type=radio]:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.chips input[type=text]{position:static;opacity:1;width:auto;height:auto}

.tail{padding:26px 0 10px}
.tail h3{font-family:var(--disp);font-weight:600;font-size:19px;margin:0 0 6px}
textarea{width:100%;min-height:100px;font-family:var(--body);font-size:16px;padding:11px;border:1px solid var(--rule);background:var(--paper-2);border-radius:3px;color:var(--ink);resize:vertical}
.checks{margin:14px 0 0;display:grid;gap:9px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;cursor:pointer}
.checks input{margin-top:5px;width:17px;height:17px;flex:none;accent-color:var(--ink)}

.navrow{display:flex;gap:10px;flex-wrap:wrap;padding:26px 0 70px;border-top:1px solid var(--rule);margin-top:10px}
.btn{font-family:var(--disp);font-weight:600;font-size:15px;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink)}
.btn:hover{opacity:.86}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.note{font-size:14.5px;color:var(--ink-soft);border-left:3px solid var(--rule);padding:2px 0 2px 14px;margin:18px 0}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:9px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.saved.on{opacity:1}
pre.out{font-family:var(--mono);font-size:11.5px;background:var(--paper-2);border:1px solid var(--rule);padding:14px;border-radius:3px;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all}
footer.foot{border-top:1px solid var(--rule);padding:22px 0 50px;font-size:13.5px;color:var(--ink-soft)}
#view:focus{outline:none}

/* ---------- plane layout + sidebar toc ---------- */
.wrap.wide{max-width:1180px}
.planegrid{display:grid;grid-template-columns:212px minmax(0,1fr);gap:44px;align-items:start}
.toc{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:10px}
.toc h2{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;font-weight:400}
.toc ol{list-style:none;margin:0 0 18px;padding:0;border-left:1px solid var(--rule)}
.toc li{margin:0}
.toc a.t{display:flex;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink);padding:7px 4px 7px 12px;margin-left:-1px;border-left:2px solid transparent;font-size:14px;line-height:1.3}
.toc a.t .tt{flex:1;min-width:0}
.toc a.t:hover{background:var(--paper-2)}
.toc a.t:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.toc a.t .tn{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:none;width:2.1em}
.toc a.t .tc{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:none;white-space:nowrap}
.toc a.t[data-state=part]{color:var(--ink)}
.toc a.t[data-state=done] .tc{color:var(--pl)}
.toc a.t[aria-current]{border-left-color:var(--pl);background:var(--paper-2);font-weight:600}
.toc .meter{height:5px;background:var(--paper-2);border:1px solid var(--rule);border-radius:99px;overflow:hidden;margin:0 0 6px}
.toc .meter i{display:block;height:100%;background:var(--pl);transition:width .4s ease}
.toc .pcline{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin:0 0 16px}
.toc .jump{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.toc .jump a{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-decoration:none}
.toc .jump a:hover{color:var(--ink);text-decoration:underline}
.tocmob{display:none}
@media(max-width:900px){
  .planegrid{grid-template-columns:1fr;gap:0}
  .toc{display:none}
  .tocmob{display:block;margin:0 0 6px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2)}
  .tocmob>summary{cursor:pointer;list-style:none;padding:11px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between}
  .tocmob>summary::-webkit-details-marker{display:none}
  .tocmob .inner{padding:4px 10px 12px;border-top:1px solid var(--rule)}
  .tocmob ol{list-style:none;margin:0;padding:0}
  .tocmob a.t{display:block;text-decoration:none;color:var(--ink);padding:9px 6px;font-size:15px;border-bottom:1px solid var(--rule)}
  .tocmob a.t:last-child{border-bottom:none}
  .tocmob a.t{display:flex;gap:8px;align-items:baseline}
  .tocmob a.t .tt{flex:1}
  .tocmob a.t .tn{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:none;width:2.1em}
  .tocmob a.t .tc{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print {
  @page {
    size: A4 portrait;
    margin: 12mm 14mm;
  }
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body {
    background: #fff !important;
    color: #16202B !important;
    font-size: 10pt !important;
    line-height: 1.4 !important;
  }
  .mast, .navrow, .toc, .tocmob, .clr, .saved, #hp_field, textarea, .lastwrap, button, .btn, #preview, .chips, dialog, #feedback_dialog, #float_feedback, .print-hide, .keyring-tutorial-box {
    display: none !important;
  }
  .print-header {
    display: block !important;
    margin-bottom: 16px !important;
  }
  .wrap, .wrap.wide {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  .planehead {
    padding: 4px 0 8px !important;
    border-bottom: 2px solid #16202B !important;
    page-break-after: avoid;
    break-after: avoid;
  }
  .tail, details.sub, .band {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
    margin-bottom: 14px !important;
  }
  .tail h3 {
    page-break-after: avoid !important;
    break-after: avoid !important;
    margin-top: 0 !important;
  }
  /* Keyring plot container */
  .keyring-print-section {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
    text-align: center !important;
    margin: 16px 0 !important;
  }
  svg {
    max-width: 85% !important;
    height: auto !important;
    display: block !important;
    margin: 0 auto !important;
  }
}
.print-header { display: none; }
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <a class="brand" href="#/hub">Welfare Survey<span>Seven requirements</span></a>
    <nav class="mini" id="mini" aria-label="Plane progress"></nav>
    <a href="#/framework" style="font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink);text-decoration:none;white-space:nowrap;flex:none">Framework</a>
    <a href="#/results" style="font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink);text-decoration:none;white-space:nowrap;flex:none">Results</a>
  </div>
</header>
<main id="view" class="wrap" tabindex="-1"></main>

<button id="float_feedback" style="position:fixed;bottom:20px;right:20px;z-index:90;background:var(--ink);color:#fff;border:none;border-radius:24px;padding:9px 16px;font-family:var(--disp);font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.2);cursor:pointer;display:flex;align-items:center;gap:6px" aria-label="Feedback">💬 Feedback</button>

<dialog id="feedback_dialog" style="max-width:540px;width:92%;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2);padding:24px;box-shadow:0 14px 40px rgba(0,0,0,0.28);color:var(--ink);margin:auto">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
    <h3 style="margin:0;font-size:19px">Survey Feedback &amp; Suggestions</h3>
    <button id="close_feedback_x" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);padding:0 4px;line-height:1">&times;</button>
  </div>
  <p style="color:var(--ink-soft);font-size:14px;margin:0 0 14px;line-height:1.5">Have an idea for better question wording, missing survival lifelines, or technical improvements? Let us know!</p>
  <div style="margin-bottom:12px">
    <label style="font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px">Topic Category</label>
    <div class="chips" id="feedback_modal_chips">
      <input type="radio" name="feedback_modal|category" id="fbc_m_0" value="Question Wording">
      <label for="fbc_m_0">Question Wording</label>
      <input type="radio" name="feedback_modal|category" id="fbc_m_1" value="Missing Lifelines">
      <label for="fbc_m_1">Missing Lifelines</label>
      <input type="radio" name="feedback_modal|category" id="fbc_m_2" value="Scale Balance">
      <label for="fbc_m_2">Scale Balance</label>
      <input type="radio" name="feedback_modal|category" id="fbc_m_3" value="Technical / Bug">
      <label for="fbc_m_3">Technical / Bug</label>
      <input type="radio" name="feedback_modal|category" id="fbc_m_4" value="General Suggestion">
      <label for="fbc_m_4">General Suggestion</label>
    </div>
  </div>
  <textarea id="feedback_modal_text" placeholder="Share your suggestions, question rewrites, or feedback..." style="min-height:110px;width:100%;margin-bottom:14px;font-family:var(--body);font-size:15px;padding:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)"></textarea>
  <div style="display:flex;justify-content:flex-end;gap:10px">
    <button class="btn ghost" id="close_feedback_btn">Close</button>
    <button class="btn" id="save_feedback_btn">Save Feedback</button>
  </div>
</dialog>
<div class="saved" id="toast" role="status" aria-live="polite">Saved</div>

// --- Supabase: fill these two in after creating your project. Both are

// supabase_schema.sql is what actually protects the data. ---
const SUPABASE_URL = 'https://iaudayzofxrgzwutittm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WlfhOxEkAGDwAk5oZV2YrA_BIFfI0XN';

// "Stay signed in" storage: a custom storage adapter so unchecking the
// checkbox keeps the session in sessionStorage (gone when the tab/browser
// closes) instead of localStorage (survives indefinitely). Defaults to
// localStorage/persistent -- that's what the automatic anonymous sign-in
// has always relied on for cross-visit continuity, so leaving the flag
// untouched (no email/password or Google sign-in ever used) keeps that
// existing behaviour exactly as it was.
const REMEMBER_KEY = 'cws:remember';
function setRemember(v){ try{ localStorage.setItem(REMEMBER_KEY, v?'1':'0'); }catch(e){} }
function getRemember(){ try{ return localStorage.getItem(REMEMBER_KEY)!=='0'; }catch(e){ return true; } }
const authStorage = {
  getItem(key){ try{ return localStorage.getItem(key) ?? sessionStorage.getItem(key); }catch(e){ return null; } },
  setItem(key,value){
    try{
      if (getRemember()) { localStorage.setItem(key,value); sessionStorage.removeItem(key); }
      else { sessionStorage.setItem(key,value); localStorage.removeItem(key); }
    }catch(e){}
  },
  removeItem(key){ try{ localStorage.removeItem(key); sessionStorage.removeItem(key); }catch(e){} },
};

let supa = null;
try {
  if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase) {
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: authStorage } });
  }
} catch (e) { console.error('Supabase client init failed', e); }

// RLS policies (supabase_schema.sql) only grant access to the
// `authenticated` role, which both Supabase Anonymous Auth and a signed-in
// email/password account use -- so we need a session, of either kind,
// before writing or reading anything. A prior anonymous session persists
// across visits (that's what lets a second submission update the first),
// so only sign in anonymously if there isn't a session of some kind yet.
async function ensureSession() {
  let { data: { session } } = await supa.auth.getSession();
  if (!session) {
    const { data, error } = await supa.auth.signInAnonymously();
    if (error) return { session: null, error };
    session = data.session;
  }
  return { session, error: null };
}

async function submitToSupabase(payload, existingId) {
  // Honeypot: a hidden field a real person never sees or fills. Anything in
  // it means a bot filled every input on the page indiscriminately.
  const hp = document.getElementById('hp_field');
  if (hp && hp.value) return { ok: false, error: 'Submission blocked.' };
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  const { session, error: authErr } = await ensureSession();
  if (authErr) return { ok: false, error: authErr.message };
  const respondentId = session.user.id;

  // Reuse the id from a prior submission so this becomes an update rather
  // than a new row -- that's the whole point of the stable identity (see
  // the RLS comment block in supabase_schema.sql). Only generate a fresh
  // id client-side, rather than reading one back from Postgres, the first
  // time: chaining .select() after .insert() would ask PostgREST to
  // return the new row, and that costs nothing extra to avoid even though
  // SELECT is allowed for own rows now (see loadNamedResponse below).
  const responseId = existingId || crypto.randomUUID();
  const { error: e1 } = await supa.from('responses').upsert({
    id: responseId, respondent_id: respondentId, raw: payload,
    updated_at: new Date().toISOString(),
    label_name: (payload.label && payload.label.name) || null,
    label_location: (payload.label && payload.label.location) || null,
  }, { onConflict: 'id' });
  if (e1) return { ok: false, error: e1.message };

  // `answers` is a wide table -- one row per sub-indicator, not per
  // rating -- so every scale/flag for a sub_id folds into a single row.
  const answerRows = [];
  for (const [planeKey, plane] of Object.entries(payload.planes || {})) {
    const planeNum = Number(planeKey);
    for (const [subId, sub] of Object.entries(plane.sub_indicators || {})) {
      const row = { response_id: responseId, plane: planeNum, sub_id: subId };
      const scaleCols = { Micro: 'micro', Meso: 'meso', Macro: 'macro' };
      for (const [scale, pair] of Object.entries(sub.scales || {})) {
        const col = scaleCols[scale];
        if (!col) continue;
        row[`${col}_a`] = pair.A ?? null;
        row[`${col}_a_last`] = pair.A_last ?? null;
        row[`${col}_b`] = pair.B ?? null;
        row[`${col}_b_last`] = pair.B_last ?? null;
      }
      if (sub.flags) {
        if (sub.flags.Ca !== undefined) row.ca = sub.flags.Ca;
        if (sub.flags.Cb !== undefined) row.cb = sub.flags.Cb;
        if (sub.flags.Da !== undefined) row.da = sub.flags.Da;
        if (sub.flags.Db !== undefined) row.db = sub.flags.Db;
        if (sub.flags.Cb_type) row.cb_type = sub.flags.Cb_type;
        if (sub.flags.Db_type) row.db_type = sub.flags.Db_type;
      }
      answerRows.push(row);
    }
  }
  // Delete-then-insert rather than upsert: an upsert would leave behind a
  // row for any sub_id the respondent has since cleared, so the stored
  // answers would never actually shrink. Wiping this response's rows
  // first and reinserting from the current payload makes `answers` an
  // exact mirror of what's in the form right now, same as `raw` already is.
  if (existingId) {
    const { error: delErr } = await supa.from('answers').delete().eq('response_id', responseId);
    if (delErr) return { ok: false, error: `answers cleanup: ${delErr.message}` };
  }
  if (answerRows.length) {
    const { error } = await supa.from('answers').insert(answerRows);
    if (error) return { ok: false, error: `answers: ${error.message}` };
  }
  return { ok: true, id: responseId };
}

/* ---------- account: email/password on top of the anonymous identity ---------- */
// Converts the current anonymous session into a permanent one. Supabase
// keeps the same auth.uid() across this conversion, so every response
// already submitted under the anonymous session stays owned by the same
// account -- nothing needs to be re-pointed at a new id.
async function linkAccountEmail(email, password) {
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  const { error: authErr } = await ensureSession();
  if (authErr) return { ok: false, error: authErr.message };
  const { error } = await supa.auth.updateUser({ email, password });
  if (error) return { ok: false, error: error.message };
  return { ok: true };
}

// Signs into an existing account on a (possibly new) device, then pulls
// every response that account owns so the respondent can keep going.
async function signInAccount(email, password) {
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if (error) return { ok: false, error: error.message };
  return await pullAccountData();
}

// Google requires a real http(s) origin -- it will redirect the whole
// page away and back, so there's no result to await here. The bootstrap
// IIFE at the bottom of the file (via maybeAutoPullAccount) handles what
// happens after Google sends the browser back with a session.
async function signInWithGoogle() {
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  const { error } = await supa.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname + window.location.search },
  });
  if (error) return { ok: false, error: error.message };
  return { ok: true };
}

// Fetches every response this account owns (RLS already limits the query
// to rows where respondent_id = auth.uid()), remembers each one's id
// against its label so future submits under that name update rather than
// duplicate, and loads the most recently submitted one onto the screen.
// A response saved under a different name on this account still exists
// and will correctly show "Update" once that name is typed in again, but
// its answers won't appear on screen until explicitly loaded -- see
// loadNamedResponse.
async function pullAccountData() {
  const { data, error } = await supa.from('responses')
    .select('id, label_name, raw, submitted_at')
    .order('submitted_at', { ascending: false });
  if (error) return { ok: false, error: error.message };
  const ids = STATE['_response_ids'] = STATE['_response_ids'] || {};
  (data || []).forEach(row => { ids[row.label_name || ''] = row.id; });
  const latest = data && data[0];
  if (latest) applyExportToState(latest.raw);
  queueSave();
  return { ok: true, count: (data || []).length, loadedLabel: latest ? (latest.label_name || '') : null };
}

// Fetches the one response saved under a specific name on this account
// and loads it onto the screen, for switching between several people's
// saved answers under one account (see the per-label id map above).
async function loadNamedResponse(name) {
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  let q = supa.from('responses').select('id, label_name, raw').order('submitted_at', { ascending: false }).limit(1);
  q = name ? q.eq('label_name', name) : q.is('label_name', null);
  const { data, error } = await q.maybeSingle();
  if (error) return { ok: false, error: error.message };
  if (!data) return { ok: false, error: 'No saved response found under that name on this account.' };
  STATE['_response_ids'] = STATE['_response_ids'] || {};
  STATE['_response_ids'][name || ''] = data.id;
  applyExportToState(data.raw);
  queueSave();
  return { ok: true };
}

// Renames a saved response's label -- both the indexed label_name column
// (the source of truth for the child list and future update-matching)
// and the local id map's key. Refuses to collide two different response
// ids under one name, since that would make the older one unreachable.
async function renameResponse(oldName, newName) {
  if (!supa) return { ok: false, error: 'Supabase is not configured yet.' };
  const ids = STATE['_response_ids'] || {};
  const id = ids[oldName];
  if (!id) return { ok: false, error: 'No saved response found under that name.' };
  const clean = (newName || '').trim();
  if (clean === oldName) return { ok: true };
  if (ids[clean] && ids[clean] !== id) return { ok: false, error: 'That name is already used by a different saved response.' };
  const { error } = await supa.from('responses').update({ label_name: clean || null }).eq('id', id);
  if (error) return { ok: false, error: error.message };
  delete ids[oldName];
  ids[clean] = id;
  STATE['_response_ids'] = ids;
  if (labelKey() === oldName) STATE['label|name'] = clean;
  queueSave();
  return { ok: true };
}

// Deletes a saved response outright -- both its answers rows and the
// response row itself (RLS already scopes both to rows this identity
// owns, same as every other write here). If the deleted response is the
// one currently on screen, clears the form back to blank rather than
// leaving stale answers attached to an id that no longer exists.
async function deleteResponse(name) {
  const ids = STATE['_response_ids'] || {};
  const id = ids[name];
  if (supa && id) {
    try {
      await supa.from('answers').delete().eq('response_id', id);
      await supa.from('responses').delete().eq('id', id);
    } catch(e) { console.error('Supabase deletion error:', e); }
  }
  delete ids[name];
  if (labelKey() === name) {
    STATE = { _response_ids: ids };
  } else {
    STATE['_response_ids'] = ids;
  }
  await Store.set(STATE);
  queueSave();
  return { ok: true };
}

  try { if(window.storage && window.storage.delete) await window.storage.delete(KEY); } catch(e){}
}

// The inverse of buildExport(): rebuilds the flat STATE keys the rest of
// the app reads from a previously exported `raw` payload. Preserves the
// local response-id map across the reload rather than wiping it, since
// that map can hold ids for other named responses on the same account
// that this particular payload doesn't mention.
function applyExportToState(raw) {
  const keepIds = STATE['_response_ids'];
  const st = {};
  st['label|name'] = (raw.label && raw.label.name) || '';
  st['label|location'] = (raw.label && raw.label.location) || '';
  if (raw.feedback) {
    if (raw.feedback.category) st['feedback|category'] = raw.feedback.category;
    if (raw.feedback.text) st['feedback|text'] = raw.feedback.text;
  }
  Object.entries(raw.planes || {}).forEach(([pn, pl]) => {
    if (pl.open_response) st['open|' + pn] = pl.open_response;
    if (pl.consent) {
      if (pl.consent.follow_up) st['consent|' + pn + '|support'] = 1;
      if (pl.consent.contribute) st['consent|' + pn + '|contribute'] = 1;
    }
    Object.entries(pl.sub_indicators || {}).forEach(([subId, rec]) => {
      Object.entries(rec.scales || {}).forEach(([sc, pair]) => {
        if (pair.A != null) st[`${subId}|${sc}|A`] = String(pair.A);
        if (pair.A_last) st[`${subId}|${sc}|A|last`] = pair.A_last;
        if (pair.B != null) st[`${subId}|${sc}|B`] = String(pair.B);
        if (pair.B_last) st[`${subId}|${sc}|B|last`] = pair.B_last;
      });
      ['Ca', 'Cb', 'Da', 'Db'].forEach(v => { if (rec.flags && rec.flags[v] != null) st[`${subId}|flag|${v}`] = String(rec.flags[v]); });
      if (rec.flags && rec.flags.Cb_type) st[`${subId}|flag|Cbtype`] = rec.flags.Cb_type;
      if (rec.flags && rec.flags.Db_type) st[`${subId}|flag|Dbtype`] = rec.flags.Db_type;
    });
  });
  Object.entries(raw.extras || {}).forEach(([id, val]) => { st['x|' + id] = val; });
  DATA.planes.forEach((p, i) => {
    const rs = raw.ranking && raw.ranking.self && raw.ranking.self[p.name];
    const rc = raw.ranking && raw.ranking.community && raw.ranking.community[p.name];
    if (rs) st['rank|self|' + (i + 1)] = rs;
    if (rc) st['rank|comm|' + (i + 1)] = rc;
  });
  st['_response_ids'] = keepIds;
  STATE = st;
}

// URL fragment before this runs), and the plain anonymous-only case
// (session has no email, so this is a no-op beyond setting ACCOUNT_EMAIL).
// The sessionStorage flag limits the data pull to once per browser tab

async function maybeAutoPullAccount() {

    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);return r&&r.value?JSON.parse(r.value):{};} }catch(e){}

/* ---------- results diagnostic ---------- */
// Every sub-indicator has up to 6 raw 1-5 answers (Micro/Meso/Macro x A/B).
// `raw` keeps each one that's actually answered (in a fixed order, so tick
// position always means the same thing across every arm); `score` is
// their average normalized to 0..1, or null if nothing's answered yet --
// arm length reads that, tick length reads each individual raw value.
const ANSWER_SLOTS=[['Micro','A'],['Micro','B'],['Meso','A'],['Meso','B'],['Macro','A'],['Macro','B']];
function subScore(id){
  const raw=ANSWER_SLOTS.map(([sc,v])=>{ const val=STATE[`${id}|${sc}|${v}`]; return val?+val:null; });
  const answered=raw.filter(v=>v!=null);
  const score=answered.length?((answered.reduce((a,b)=>a+b,0)/answered.length)-1)/4:null;
  return { raw, score };
}
const TAU = {
  1: 3,    // Recognition (days - acute social/ego erasure)
  2: 14,   // Purpose (days - psychological horizon decay)
  3: 3,    // Shelter (days - physical exposure baseline)
  4: 1.5,  // Refreshment / Sleep (1.5 days = 36 hours somatic threshold)
  5: 5,    // Power / Agency (days - learned helplessness / burnout)
  6: 30,   // Morale / Conscience (days - moral injury / dissonance)
  7: 7     // Sustenance / Nervous safety (days - sympathetic overload)
};

function subMetrics(s, planeNum){
  const {raw, score} = subScore(s.id);
  if(score === null) return null;
  const aVals = [raw[0], raw[2], raw[4]].filter(v => v != null);
  const bVals = [raw[1], raw[3], raw[5]].filter(v => v != null);
  const aMean = aVals.length ? (aVals.reduce((a,b)=>a+b,0)/aVals.length) : null;
  const bMean = bVals.length ? (bVals.reduce((a,b)=>a+b,0)/bVals.length) : null;
  
  // Vector Strain: gap between Sense (A) and Use (B)
  const tension = (aMean != null && bMean != null) ? Math.abs(aMean - bMean) / 4 : 0;
  const suppression = (aMean != null && bMean != null) ? Math.max(0, aMean - bMean) / 4 : 0;
  const duty = (aMean != null && bMean != null) ? Math.max(0, bMean - aMean) / 4 : 0;
  
  // Time-constant decay velocity factor: biases acute somatic/safety needs (tau 1.5d - 3d) over chronic long-term ones (tau 14d - 30d)
  const tau = TAU[planeNum] || 7;
  const tauFactor = Math.pow(7 / tau, 0.20);
  
  // Deficit depth: 0 = flourishing (5/5), 1 = total deficit (1/5)
  const deficit = 1 - score;
  
  // Universal Risk percentage [0..100]: combines deficit depth, vector friction (A vs B), and decay speed
  const risk = Math.min(100, Math.max(0, Math.round(deficit * (1 + tension * 0.3) * tauFactor * 100)));
  
  return {
    raw, score, aMean, bMean, tension, suppression, duty, risk, tau
  };
}

function systemViability(){
  const planeScores = [];
  let totalSuppression = 0, totalDuty = 0, answeredCount = 0;
  
  DATA.planes.forEach(p => {
    const scores = [];
    p.subs.forEach(s => {
      const m = subMetrics(s, p.n);
      if(m) {
        scores.push(m.score);
        totalSuppression += m.suppression;
        totalDuty += m.duty;
        answeredCount++;
      }
    });
    if(scores.length) {
      const pScore = scores.reduce((a,b)=>a+b,0) / scores.length;
      planeScores.push({ n: p.n, name: p.name, score: pScore, tau: TAU[p.n] });
    }
  });
  
  if(!planeScores.length) return null;
  
  // Multiplicative Viability V = Geometric Mean across all answered planes (0..100%)
  // Penalizes single-point weak links, and drops to 0% if any vital lifeline collapses.
  const rawProduct = planeScores.reduce((acc, p) => acc * Math.max(0, p.score), 1);
  const multViability = Math.round(Math.pow(rawProduct, 1 / planeScores.length) * 100);
  const avgViability = Math.round((planeScores.reduce((acc, p) => acc + p.score, 0) / planeScores.length) * 100);
  
  // Primary Dependency Loop: 1 -> 2 -> 5 -> 3 -> 4 -> 7 -> 6 -> 1
  const LOOP_ORDER = [1, 2, 5, 3, 4, 7, 6];
  let worstChokepoint = null;
  let minUpstream = 2;
  
  LOOP_ORDER.forEach((pNum, idx) => {
    const pData = planeScores.find(x => x.n === pNum);
    if(pData && pData.score < minUpstream) {
      minUpstream = pData.score;
      const nextPNum = LOOP_ORDER[(idx + 1) % LOOP_ORDER.length];
      const nextPData = DATA.planes.find(x => x.n === nextPNum);
      worstChokepoint = {
        plane: pData,
        impacted: nextPData
      };
    }
  });
  
  return {
    multViability,
    avgViability,
    planeScores,
    totalSuppression: Math.round(totalSuppression * 10) / 10,
    totalDuty: Math.round(totalDuty * 10) / 10,
    worstChokepoint,
    answeredCount
  };
}

function rankedSubs(){
  const rows=[];
  DATA.planes.forEach(p=>p.subs.forEach(s=>{
    const m = subMetrics(s, p.n);
    if(m!=null) rows.push({ plane:p, sub:s, score: m.score, metrics: m });
  }));
  return rows.sort((a,b)=>b.metrics.risk - a.metrics.risk);
}

// One arm = one key blade. The shaft's own length is the question's
// overall score (short for low, long for high). Teeth are cut into both
// edges clustered right near this shaft's own current tip (85%-98% of
// its actual length) -- the A vector's 3 answers (Micro/Meso/Macro) on
// the left edge, the B vector's 3 on the right, each side's Micro/Meso/
// Macro sharing the same 3 radial slots so a left/right pair for the
// same scale lines up directly opposite each other. Tooth length is the
// rating. Arms with nothing answered stay a plain thin line.
// `showScale` draws the legend directly on this one arm instead of as a
// separate floating graphic elsewhere: a bracket framing the tooth zone
// with "5" labeled at each end, showing exactly what full-length teeth
// would look like right where the teeth actually are.
function armSVG(cx,cy,angleDeg,armLen,hue,sub,labelSize,showScale){
  const ang=angleDeg*Math.PI/180;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const px=-dy, py=dx;
  const {raw}=subScore(sub.id);
  const aVals=[raw[0],raw[2],raw[4]]; // Micro/Meso/Macro A
  const bVals=[raw[1],raw[3],raw[5]]; // Micro/Meso/Macro B
  const answered=raw.filter(v=>v!=null);
  const parts=[];
  const tipX=cx+dx*armLen, tipY=cy+dy*armLen;
  if(!answered.length){
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
  } else {
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="${hue}" stroke-width="4" stroke-linecap="round"/>`);
    const slots=[0.85,0.915,0.98];
    [[aVals,-1],[bVals,1]].forEach(([vals,sgn])=>{
      vals.forEach((v,i)=>{
        if(v==null) return;
        const frac=slots[i];
        const bx=cx+dx*armLen*frac, by=cy+dy*armLen*frac;
        const tlen=4+(v-1)/4*11;
        const ex=bx+px*tlen*sgn, ey=by+py*tlen*sgn;
        parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${hue}" stroke-width="3" stroke-linecap="round"/>`);
      });
    });
  }
  if(showScale){
    const bx=cx+dx*armLen*0.83, by=cy+dy*armLen*0.83;
    const fw=15; // frame half-width, matches the max tooth length (11) plus a little clearance
    const p1x=bx-px*fw, p1y=by-py*fw, p2x=bx+px*fw, p2y=by+py*fw;
    const p3x=tipX-px*fw, p3y=tipY-py*fw, p4x=tipX+px*fw, p4y=tipY+py*fw;
    parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<text x="${(p3x-px*5).toFixed(1)}" y="${(p3y-py*5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">A:5</text>`);
    parts.push(`<text x="${(p4x+px*5).toFixed(1)}" y="${(p4y+py*5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">B:5</text>`);
  }
  if(labelSize){
    const lx=cx+dx*(armLen+labelSize+4), ly=cy+dy*(armLen+labelSize+4);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${labelSize}" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle">${esc(sub.id)}</text>`);
  }
  return parts.join('');
}
function planeStarSVG(p){

  const hue=HUES[p.n];
  const parts=p.subs.map((s,i)=>armSVG(cx,cy,-90+i*(360/7),armLen,hue,s,9,true));
  return `<svg viewBox="0 0 200 200" style="max-width:200px;display:block;margin:0 auto" role="img" aria-label="${esc(p.name)} diagnostic star">
    <circle cx="${cx}" cy="${cy}" r="3" fill="${hue}"/>

// One arm direction (Q1-Q7, the i-th sub-indicator slot, same generic
// position every plane shares) carrying all 7 planes' teeth at once --
// no per-plane angle or origin offset this time, every plane's teeth sit
// on the exact same shared axis, which is what keeps this from breaking
// into the jagged mess the old laneShift version produced. Each plane
// gets its own thin ring within the tooth zone, nested outer-to-inner
// from plane 1 (Recognition) to plane 7 (Sustenance): 3 A teeth on the
// left of that ring, 3 B teeth on the right -- 7 rings x 3 = 21 teeth
// per side, all on the one arm.
function combinedArmSVG(cx,cy,angleDeg,armLen,i){
  const ang=angleDeg*Math.PI/180;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const px=-dy, py=dx;
  const parts=[];
  const tipX=cx+dx*armLen, tipY=cy+dy*armLen;
  parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
  const maxTlen=36;
  const zoneStart=0.5, zoneEnd=0.98, ringW=(zoneEnd-zoneStart)/7;
  DATA.planes.forEach((p,pi)=>{
    const {raw}=subScore(p.subs[i].id);
    const aVals=[raw[0],raw[2],raw[4]], bVals=[raw[1],raw[3],raw[5]];
    const ringStart=zoneEnd-(pi+1)*ringW;
    const slotFracs=[ringStart+ringW*0.2,ringStart+ringW*0.5,ringStart+ringW*0.8];
    const hue=HUES[p.n];
    [[aVals,-1],[bVals,1]].forEach(([vals,sgn])=>{
      vals.forEach((v,k)=>{
        if(v==null) return;
        const bx=cx+dx*armLen*slotFracs[k], by=cy+dy*armLen*slotFracs[k];
        const tlen=4+(v-1)/4*maxTlen;
        const ex=bx+px*tlen*sgn, ey=by+py*tlen*sgn;
        parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${hue}" stroke-width="3.2" stroke-linecap="round"/>`);
      });
    });
  });
  // Scale bracket — same structure as the single-arm showScale bracket
  const fw=maxTlen+6; // frame half-width: max tooth + a little clearance
  const bx0=cx+dx*armLen*zoneStart, by0=cy+dy*armLen*zoneStart; // zone base
  const bx1=cx+dx*armLen*zoneEnd,  by1=cy+dy*armLen*zoneEnd;   // zone tip
  const p1x=bx0-px*fw, p1y=by0-py*fw, p2x=bx0+px*fw, p2y=by0+py*fw; // base rail ends
  const p3x=bx1-px*fw, p3y=by1-py*fw, p4x=bx1+px*fw, p4y=by1+py*fw; // tip rail ends
  parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<text x="${(p3x-px*5).toFixed(1)}" y="${(p3y-py*5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">A:5</text>`);
  parts.push(`<text x="${(p4x+px*5).toFixed(1)}" y="${(p4y+py*5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">B:5</text>`);
  const lx=cx+dx*(armLen+14), ly=cy+dy*(armLen+14);
  parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle">Q${i+1}</text>`);
  return parts.join('');
}
function combinedStarSVG(){
  const cx=220, cy=220, armLen=170;
  const parts=[];
  for(let i=0;i<7;i++) parts.push(combinedArmSVG(cx,cy,-90+i*(360/7),armLen,i));
  const legend=DATA.planes.map(p=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px"><span style="width:9px;height:9px;border-radius:50%;background:${HUES[p.n]};display:inline-block"></span>${esc(p.name)}</span>`).join('');
  return `<svg viewBox="0 0 440 440" style="max-width:440px;display:block;margin:0 auto" role="img" aria-label="All seven planes overlaid, one arm per question position, plane 1 outermost to plane 7 innermost">
    <circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--ink)"/>
    ${parts.join('')}
  </svg>
  <p style="font-size:13px;margin:10px 0 0;text-align:center">${legend}</p>`;
}
// A baked-in 3-arm mini keyring used as an illustrative diagram in the
// explainer. Uses hardcoded illustrative data (not live STATE) so it renders
// identically regardless of what the respondent has answered.
function keyringExampleSVG(){
  const cx=100, cy=100, r=82, viewW=200, viewH=220;
  const HUES_EX=Object.values(HUES);
  // Hardcoded A and B values per ring per arm (3 micro/meso/macro slots)
  // Arm0=Q1, Arm1=Q2, Arm2=Q3 — deliberately varied to show the encoding
  const DATA_EX=[
    { a:[5,4,3], b:[5,3,2] }, // plane 1 — Recognition
    { a:[3,3,4], b:[4,2,3] }, // plane 2 — Purpose
    { a:[4,4,5], b:[2,3,4] }, // plane 3 — Shelter
    { a:[3,2,3], b:[3,3,2] }, // plane 4 — Refreshment
    { a:[5,4,4], b:[4,3,3] }, // plane 5 — Power
    { a:[2,3,2], b:[3,2,2] }, // plane 6 — Morale
    { a:[4,3,4], b:[3,4,3] }, // plane 7 — Sustenance
  ];
  const maxTlen=18, zoneStart=0.42, zoneEnd=0.94;
  const ringW=(zoneEnd-zoneStart)/7;
  const parts=[];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>`);
  for(let ai=0;ai<7;ai++){
    const ang=(-90+ai*(360/7))*Math.PI/180;
    const dx=Math.cos(ang), dy=Math.sin(ang);
    const px=-dy, py=dx;
    const tipX=cx+dx*r, tipY=cy+dy*r;
    parts.push(`<line x1="${cx}" y1="${cy}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
    for(let ri=0;ri<7;ri++){
      const ringStart=zoneEnd-(ri+1)*ringW;
      const slots=[ringStart+ringW*0.2,ringStart+ringW*0.5,ringStart+ringW*0.8];
      const {a,b}=DATA_EX[ri];
      [[a,-1],[b,1]].forEach(([vals,sgn])=>{
        vals.forEach((v,k)=>{
          const bx=cx+dx*r*slots[k], by=cy+dy*r*slots[k];
          const tlen=2+(v-1)/4*maxTlen;
          parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx+px*tlen*sgn).toFixed(1)}" y2="${(by+py*tlen*sgn).toFixed(1)}" stroke="${HUES_EX[ri]}" stroke-width="1.8" stroke-linecap="round"/>`);
        });
      });
    }
    if(ai===0){
      const fw=maxTlen+4;
      const bx0=cx+dx*r*zoneStart, by0=cy+dy*r*zoneStart;
      const bx1=cx+dx*r*zoneEnd,  by1=cy+dy*r*zoneEnd;
      const p1x=bx0-px*fw,p1y=by0-py*fw,p2x=bx0+px*fw,p2y=by0+py*fw;
      const p3x=bx1-px*fw,p3y=by1-py*fw,p4x=bx1+px*fw,p4y=by1+py*fw;
      parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<text x="${(p3x-px*5).toFixed(1)}" y="${(p3y-py*5).toFixed(1)}" font-size="7" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">A:5</text>`);
      parts.push(`<text x="${(p4x+px*5).toFixed(1)}" y="${(p4y+py*5).toFixed(1)}" font-size="7" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="var(--mono)">B:5</text>`);
    }
    const lx=cx+dx*(r+13), ly=cy+dy*(r+13);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="8" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="var(--mono)">Q${ai+1}</text>`);
  }
  // Colour dots legend — one per plane
  DATA.planes.forEach((p,i)=>{
    const lx=10+i*27, ly=viewH-8;
    parts.push(`<circle cx="${lx}" cy="${ly}" r="3" fill="${HUES_EX[i]}"/>`);
  });
  return `<svg viewBox="0 0 ${viewW} ${viewH}" style="width:100%;max-width:${viewW}px;flex-shrink:0;display:block" role="img" aria-label="Keyring plot mini example, 7 arms and 7 planes">${parts.join('')}</svg>`;
}

function buildExport(){
  const out={instrument:"Community Welfare Survey (Quad-Vector 7x7)",saved_at:new Date().toISOString(),
    label:{name:STATE['label|name']||null,location:STATE['label|location']||null},
    planes:{},extras:{},ranking:{self:{},community:{}}};
  if(STATE['feedback|text'] || STATE['feedback|category']){
    out.feedback = {
      category: STATE['feedback|category'] || 'General Suggestion',
      text: STATE['feedback|text'] || ''
    };
  }
  DATA.planes.forEach(p=>{
    const pl={name:p.name,answered:planeAnswered(p.n),of:CORE_PER_PLANE,sub_indicators:{},open_response:STATE['open|'+p.n]||null,
      consent:{follow_up:!!STATE['consent|'+p.n+'|support'],contribute:!!STATE['consent|'+p.n+'|contribute']}};
    p.subs.forEach(s=>{
      const rec={address:s.addr,scales:{},flags:{}};
      ['Micro','Meso','Macro'].forEach(sc=>{
        const a=STATE[`${s.id}|${sc}|A`]||null,b=STATE[`${s.id}|${sc}|B`]||null;
        if(a||b||STATE[`${s.id}|${sc}|A|last`]||STATE[`${s.id}|${sc}|B|last`])
          rec.scales[sc]={A:a?+a:null,A_last:STATE[`${s.id}|${sc}|A|last`]||null,B:b?+b:null,B_last:STATE[`${s.id}|${sc}|B|last`]||null};
      });
      ['Ca','Cb','Da','Db'].forEach(v=>{ if(STATE[`${s.id}|flag|${v}`]) rec.flags[v]=+STATE[`${s.id}|flag|${v}`]; });
      const ct=STATE[`${s.id}|flag|Cbtype`]||STATE[`${s.id}|flag|Cbtype|other`];
      const dt=STATE[`${s.id}|flag|Dbtype`]||STATE[`${s.id}|flag|Dbtype|other`];
      if(ct) rec.flags.Cb_type=ct; if(dt) rec.flags.Db_type=dt;
      if(Object.keys(rec.scales).length||Object.keys(rec.flags).length) pl.sub_indicators[s.id]=rec;
    });
    out.planes[p.n]=pl;
  });
  M8.forEach(([id])=>{ if(STATE['x|'+id]) out.extras[id]=STATE['x|'+id]; });
  DATA.planes.forEach((p,i)=>{
    if(STATE['rank|self|'+(i+1)]) out.ranking.self[p.name]=STATE['rank|self|'+(i+1)];
    if(STATE['rank|comm|'+(i+1)]) out.ranking.community[p.name]=STATE['rank|comm|'+(i+1)];
  });
  return out;
}

// Wires the account and label sections shared across every page --
// accountHTML()/labelHTML() render the same markup wherever they're
// embedded, so this is safe to call unconditionally after any render;
// each handler is only attached if its element actually exists on the
// current page.
function wireAccount(){
  const msg=document.getElementById('acctmsg');
  const so=document.getElementById('acct_signout');
  if(so) so.onclick=async()=>{
    if(!confirm('Sign out of your account and clear current survey answers from this device? (Your answers remain safely stored under your account in the cloud).')) return;
    so.disabled=true;
    if(supa) await supa.auth.signOut();
    setRemember(true);
    ACCOUNT_EMAIL=null;
    sessionStorage.removeItem('cws:pulled');
    await wipeState();
    render();
    toast('Signed out & device data cleared');
  };
  const rememberBox=document.getElementById('acct_remember');
  const google=document.getElementById('acct_google');
  if(google) google.onclick=()=>{
    if(rememberBox) setRemember(rememberBox.checked);
    signInWithGoogle();
  };
  const save=document.getElementById('acct_save');
  if(save) save.onclick=async()=>{
    const email=(document.getElementById('acct_email').value||'').trim();
    const pw=document.getElementById('acct_password').value||'';
    if(!email||pw.length<8){ if(msg) msg.textContent='Enter an email and a password of at least 8 characters.'; return; }
    if(rememberBox) setRemember(rememberBox.checked);
    save.disabled=true; const prev=save.textContent; save.textContent='Saving…';
    const res=await linkAccountEmail(email,pw);
    save.disabled=false; save.textContent=prev;
    if(res.ok){
      ACCOUNT_EMAIL=email;
      if(currentResponseId()) await submitToSupabase(buildExport(), currentResponseId());
      render();
      toast('Password saved & progress linked');
    } else {
      if(msg) msg.textContent='Couldn\'t save password: '+res.error;
    }
  };
  const signin=document.getElementById('acct_signin');
  if(signin) signin.onclick=async()=>{
    const email=(document.getElementById('acct_email').value||'').trim();
    const pw=document.getElementById('acct_password').value||'';
    if(!email||!pw){ if(msg) msg.textContent='Enter your email and password.'; return; }
    if(rememberBox) setRemember(rememberBox.checked);
    signin.disabled=true; const prev=signin.textContent; signin.textContent='Signing in…';
    const res=await signInAccount(email,pw);
    signin.disabled=false; signin.textContent=prev;
    if(res.ok){
      ACCOUNT_EMAIL=email;
      render();
      toast(`Signed in (${res.count} saved response${res.count===1?'':'s'})`);
    } else {
      if(msg) msg.textContent='Couldn\'t sign in: '+res.error;
    }
  };
  const cn=document.getElementById('child_new');
  if(cn) cn.onclick=()=>{
    if(!confirm('Start a new response? Anything on screen that hasn\'t been submitted yet will be cleared -- already-submitted responses stay saved and can be reloaded from the list above.')) return;
    STATE={ _response_ids: STATE['_response_ids'] };
    queueSave(); render(); toast('Started a new one');
  };
}

  let m;
  v.className='wrap';
  if(h.startsWith('#/plane/')){ m=+h.split('/')[2]; currentPlane=m; v.className='wrap wide'; v.innerHTML=viewPlane(m); }
  else if(h.startsWith('#/extras')) v.innerHTML=viewExtras();
  else if(h.startsWith('#/results')) v.innerHTML=viewResults();
  else if(h.startsWith('#/framework') || h.startsWith('#/matrix')) v.innerHTML=viewFramework();
  else if(h.startsWith('#/review')){ v.innerHTML=viewReview(); wireReview(); }
  else { currentPlane=null; v.innerHTML=viewHub(); }
  wireAccount(); wireLabel(); wireGlobalFeedback();
  renderMini(); 
  if(h.includes('#results-guide')){
    setTimeout(()=>{
      const el = document.getElementById('results-guide');
      if(el) el.scrollIntoView({behavior:'smooth'});
    }, 60);
  } else {
    window.scrollTo(0,0);
  }
  v.focus({preventScroll:true}); 
  if(currentPlane) markActive();
}

function wireGlobalFeedback(){
  const dlg=document.getElementById('feedback_dialog');
  if(!dlg) return;
  const floatBtn=document.getElementById('float_feedback');
  const closeBtns=[document.getElementById('close_feedback_x'), document.getElementById('close_feedback_btn')];
  const saveBtn=document.getElementById('save_feedback_btn');
  const txt=document.getElementById('feedback_modal_text');

  if(floatBtn){
    floatBtn.onclick=()=>{
      if(txt) txt.value=STATE['feedback|text']||'';
      const cat=STATE['feedback|category']||'General Suggestion';
      const rad=dlg.querySelector(`input[value="${CSS.escape(cat)}"]`);
      if(rad) rad.checked=true;
      if(typeof dlg.showModal==='function') dlg.showModal();
      else dlg.setAttribute('open','');
    };
  }

  closeBtns.forEach(b=>{
    if(!b) return;
    b.onclick=()=>{
      if(typeof dlg.close==='function') dlg.close();
      else dlg.removeAttribute('open');
    };
  });

  if(saveBtn){
    saveBtn.onclick=async()=>{
      const sel=dlg.querySelector('input[name="feedback_modal|category"]:checked');
      const cat=sel?sel.value:'General Suggestion';
      const text=txt?txt.value.trim():'';
      if(!text){ toast('Please write a suggestion before saving'); return; }
      saveBtn.disabled=true;
      const prev=saveBtn.textContent;
      saveBtn.textContent='Sending…';

      STATE['feedback|category']=cat;
      STATE['feedback|text']=text;
      queueSave();

      let sent=false;
      if(supa){
        try{
          const { data: userData } = await supa.auth.getUser();
          const { error } = await supa.from('feedback').insert({
            category: cat,
            text: text,
            respondent_id: userData && userData.user ? userData.user.id : null,
            page_context: location.hash || '#/hub'
          });
          if(!error) sent=true;
          else console.error('Feedback insert error:', error);
        }catch(e){ console.error('Feedback insert error:', e); }
      }

      saveBtn.disabled=false;
      saveBtn.textContent=prev;
      if(typeof dlg.close==='function') dlg.close();
      else dlg.removeAttribute('open');
      toast(sent?'Feedback sent to server!':'Feedback saved locally');
    };
  }
}

function wireReview(){
  const pv=document.getElementById('preview'); if(pv) pv.textContent=JSON.stringify(buildExport(),null,1);
  const pdfBtn=document.getElementById('btn_pdf');
  if(pdfBtn) pdfBtn.onclick=()=>window.print();
  const dl=document.getElementById('dl');
  if(dl) dl.onclick=()=>{
    const blob=new Blob([JSON.stringify(buildExport(),null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='welfare-survey-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    URL.revokeObjectURL(a.href); toast('Downloaded');
  };
  const cp=document.getElementById('cp');
  if(cp) cp.onclick=async()=>{
    try{ await navigator.clipboard.writeText(JSON.stringify(buildExport(),null,2)); toast('Copied'); }
    catch(e){ toast('Select the text below and copy it'); }
  };
  const delCurrent=document.getElementById('del_current');
  if(delCurrent) delCurrent.onclick=async()=>{
    const name=labelKey();
    if(confirm(`Are you sure you want to delete the response "${name || '(unlabeled)'}"? This removes it permanently from this device and the database.`)){
      delCurrent.disabled=true;
      await deleteResponse(name);
      render();
      toast('Response deleted');
    }
  };
  const sb=document.getElementById('submit');
  if(sb) sb.onclick=async()=>{
    const msg=document.getElementById('submitmsg');
    const key=labelKey(), existingId=currentResponseId(), updating=!!existingId;
    sb.disabled=true; const prevLabel=sb.textContent; sb.textContent=updating?'Updating…':'Sending…';
    const res=await submitToSupabase(buildExport(), existingId);
    sb.disabled=false;
    if(res.ok){
      STATE['_response_ids']=STATE['_response_ids']||{}; STATE['_response_ids'][key]=res.id; queueSave();
      render();
      const m2=document.getElementById('submitmsg');
      if(m2) m2.textContent=updating?'Updated. Your response now reflects these answers in the database.':'Sent. Changing answers and pressing Update revises this same response — it won\'t create a duplicate.';
      toast(updating?'Updated':'Submitted');
    } else {
      sb.textContent=prevLabel;
      if(msg) msg.textContent='Couldn\'t send: '+res.error+'. Your answers are still saved on this device — try again, or download a copy.';
      toast('Not sent');
    }
  };
  const w=document.getElementById('wipe');
  if(w) w.onclick=async()=>{
    if(confirm('This deletes EVERY answer on this device. It cannot be undone.')){
      await wipeState();
      render();
      toast('Device data erased');
    }
  };
}
// The submit/submitlead/submitmsg elements this touches only exist on the
// review page -- everywhere else the label inputs still save via the
// document-level delegate below, this just has nothing extra to flip.
function wireLabel(){
  const ln=document.getElementById('label_name');
  if(!ln) return;
  ln.addEventListener('input',()=>{
    // Fires before the document-level delegate (target phase, then
    // bubble) so STATE['label|name'] may not be updated yet -- read the
    // live input value directly instead of going through labelKey().
    const sb=document.getElementById('submit'), lead=document.getElementById('submitlead'), msg=document.getElementById('submitmsg');
    if(!sb && !lead && !msg) return;
    const already=!!responseIdForKey(ln.value.trim());
    if(sb) sb.textContent=already?'Update my answers':'Submit my answers';
    if(lead) lead.textContent=already?'You already sent a response under this name. Pressing the button below updates that same response with your current answers — it does not create a new one.':'Submit to send your answers in. You can also keep a copy for yourself, download or copied. Blank questions stay blank everywhere — they aren\'t filled in with a middle score.';
    if(msg) msg.textContent=already?'Sent. Changing answers and pressing Update revises this same response — it won\'t create a duplicate.':'Submitting sends your answers in; downloading or copying keeps a copy for yourself. Both are optional, and neither is required to use the rest of the site.';
  });
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='radio'){ STATE[t.name]=t.value; queueSave(); syncCounts(t); if(currentPlane) refreshToc(); }
  else if(t.type==='checkbox'&&t.dataset.check){ STATE[t.dataset.check]=t.checked?1:0; queueSave(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.last){ STATE[t.dataset.last+'|last']=t.value; queueSave(); }
  else if(t.dataset.text){ STATE[t.dataset.text]=t.value; queueSave(); }
  else if(t.dataset.other){ STATE[t.dataset.other+'|other']=t.value; queueSave(); }
  else if(t.dataset.rank){ STATE[t.dataset.rank]=t.value.replace(/[^1-7]/g,''); t.value=STATE[t.dataset.rank]; queueSave(); }
});
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(j){ e.preventDefault();
    const d=document.getElementById('s'+j.dataset.jump);
    if(d){ d.open=true;
      const mob=j.closest('.tocmob'); if(mob) mob.open=false;
      const y=d.getBoundingClientRect().top+window.scrollY-84;
      window.scrollTo({top:y,behavior:'smooth'}); setTimeout(markActive,450);
    } return; }
  const oa=e.target.closest('[data-openall]');
  if(oa){ e.preventDefault();
    const all=[...document.querySelectorAll('details.sub')];
    const anyClosed=all.some(d=>!d.open);
    all.forEach(d=>d.open=anyClosed);
    oa.textContent=anyClosed?'Close all questions':'Open all questions';
    return; }
  const lc=e.target.closest('[data-loadchild]');
  if(lc){ e.preventDefault();
    (async()=>{
      lc.disabled=true;
      const res=await loadNamedResponse(lc.dataset.loadchild);
      lc.disabled=false;
      if(res.ok){ render(); toast('Loaded'); }
      else toast(res.error);
    })();
    return; }
  const rn=e.target.closest('[data-rename]');
  if(rn){ e.preventDefault();
    const oldName=rn.dataset.rename;
    const next=prompt('Rename this saved response to:', oldName);
    if(next===null) return;
    (async()=>{
      rn.disabled=true;
      const res=await renameResponse(oldName, next);
      rn.disabled=false;
      if(res.ok){ render(); toast('Renamed'); }
      else toast(res.error);
    })();
    return; }
  const dr=e.target.closest('[data-delrow]');
  if(dr){ e.preventDefault();
    const name=dr.dataset.delrow;
    if(!confirm(`Delete the response saved as "${name||'(unlabeled)'}"? This removes it from the server permanently and cannot be undone.`)) return;
    (async()=>{
      dr.disabled=true;
      const res=await deleteResponse(name);
      dr.disabled=false;
      if(res.ok){ render(); toast('Deleted'); }
      else toast(res.error);
    })();
    return; }
  const b=e.target.closest('[data-clear]'); if(!b) return;
  const k=b.dataset.clear;
  delete STATE[k]; delete STATE[k+'|last'];
  document.querySelectorAll(`input[name="${CSS.escape(k)}"]`).forEach(r=>r.checked=false);
  const li=document.querySelector(`input[data-last="${CSS.escape(k)}"]`); if(li) li.value='';
  queueSave(); syncCounts(b); if(currentPlane) refreshToc(); toast('Cleared');
});
function syncCounts(node){
  const d=node.closest('details.sub'); if(!d) return;
  const id=d.id.slice(1);
  const done=['Micro','Meso','Macro'].reduce((a,sc)=>a+(STATE[`${id}|${sc}|A`]?1:0)+(STATE[`${id}|${sc}|B`]?1:0),0);
  const fl=['Ca','Cb','Da','Db'].filter(v=>STATE[`${id}|flag|${v}`]).length;
  const dot=d.querySelector('.sdot'); if(dot) dot.textContent=`${done}/6${fl?' +'+fl:''}`;
  const fs=d.querySelector('.flags>summary span:last-child'); if(fs) fs.textContent=fl?fl+' set':'tap to open';
}
let spy=null;
window.addEventListener('scroll',()=>{ if(!currentPlane) return; if(spy) return;
  spy=requestAnimationFrame(()=>{ spy=null; markActive(); }); },{passive:true});
window.addEventListener('hashchange',render);

// Prefill removed — form opens blank.
try{ localStorage.removeItem('cws:v1'); }catch(e){}

(async()=>{ STATE=await Store.get()||{}; await maybeAutoPullAccount(); render(); })();
</script>
