// Baked-in illustrative mini keyring diagram demonstrating bipolar layered cuts
function keyringExampleSVG() {
  const cx = 100, cy = 100, r = 82, viewW = 200, viewH = 220;
  const HUES_EX = PLANES.map(p => p.hue);
  const DATA_EX = [
    { a: 5, b: 4, d: -3 }, // Plane 1: Should +5, Personal +4, Society -3
    { a: 3, b: 2, d: -2 }, // Plane 2
    { a: 4, b: 4, d: 2 },  // Plane 3
    { a: 3, b: 1, d: -4 }, // Plane 4: High Should, failing Society
    { a: 5, b: 3, d: 3 },  // Plane 5
    { a: 2, b: -1, d: -3 },// Plane 6
    { a: 4, b: 3, d: 1 }   // Plane 7
  ];
  const maxTlen = 16, zoneStart = 0.45, zoneEnd = 0.96;
  const ringW = (zoneEnd - zoneStart) / 7;
  const parts = [];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>`);
  for (let ai = 0; ai < 7; ai++) {
    const ang = (-90 + ai * (360 / 7)) * Math.PI / 180;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const px = -dy, py = dx;
    const tipX = cx + dx * r, tipY = cy + dy * r;
    // Shaft (0 axis)
    parts.push(`<line x1="${cx}" y1="${cy}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
    for (let ri = 0; ri < 7; ri++) {
      const ringStart = zoneEnd - (ri + 1) * ringW;
      const slots = [ringStart + ringW * 0.25, ringStart + ringW * 0.55, ringStart + ringW * 0.85];
      const exVal = DATA_EX[ri];
      const vals = [exVal.a, exVal.b, exVal.d];
      vals.forEach((v, k) => {
        const bx = cx + dx * r * slots[k], by = cy + dy * r * slots[k];
        const isPos = v > 0;
        const norm = Math.min(1, Math.abs(v) / 5);
        const tlen = 2 + norm * maxTlen;
        const sgn = isPos ? 1 : -1; // +1 right, -1 left
        const hue = isPos ? HUES_EX[ri] : "#DC2626";
        parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx + px * tlen * sgn).toFixed(1)}" y2="${(by + py * tlen * sgn).toFixed(1)}" stroke="${hue}" stroke-width="1.8" stroke-linecap="round"/>`);
      });
    }
    if (ai === 0) {
      const fw = maxTlen + 4;
      const bx0 = cx + dx * r * zoneStart, by0 = cy + dy * r * zoneStart;
      const bx1 = tipX, by1 = tipY;
      const pLeft0 = { x: bx0 - px * fw, y: by0 - py * fw };
      const pRight0 = { x: bx0 + px * fw, y: by0 + py * fw };
      const pLeft1 = { x: bx1 - px * fw, y: by1 - py * fw };
      const pRight1 = { x: bx1 + px * fw, y: by1 + py * fw };
      parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.7" opacity="0.25"/>`);
      parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pLeft1.x.toFixed(1)},${pLeft1.y.toFixed(1)}" stroke="#DC2626" stroke-width="0.7" opacity="0.35"/>`);
      parts.push(`<polyline points="${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)} ${pRight1.x.toFixed(1)},${pRight1.y.toFixed(1)}" stroke="var(--accent)" stroke-width="0.7" opacity="0.35"/>`);
      parts.push(`<text x="${(pLeft1.x - px * 3).toFixed(1)}" y="${(pLeft1.y - py * 3).toFixed(1)}" font-size="7" fill="#DC2626" opacity="0.7" text-anchor="middle" font-family="'JetBrains Mono', monospace">−5</text>`);
      parts.push(`<text x="${bx1.toFixed(1)}" y="${(by1 - py * 3).toFixed(1)}" font-size="6.5" fill="var(--ink-soft)" opacity="0.6" text-anchor="middle" font-family="'JetBrains Mono', monospace">0</text>`);
      parts.push(`<text x="${(pRight1.x + px * 3).toFixed(1)}" y="${(pRight1.y + py * 3).toFixed(1)}" font-size="7" fill="var(--accent)" opacity="0.7" text-anchor="middle" font-family="'JetBrains Mono', monospace">+5</text>`);
    }
    const lx = cx + dx * (r + 13), ly = cy + dy * (r + 13);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="8" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">Q${ai + 1}</text>`);
  }
  PLANES.forEach((p, i) => {
    const lx = 10 + i * 27, ly = viewH - 8;
    parts.push(`<circle cx="${lx}" cy="${ly}" r="3" fill="${HUES_EX[i]}"/>`);
  });
  return `<svg viewBox="0 0 ${viewW} ${viewH}" style="width:100%;max-width:${viewW}px;flex-shrink:0;display:block" role="img" aria-label="Bipolar keyring mini example, 7 arms and 7 planes">${parts.join("")}</svg>`;
}

/* ---------- PSOCHIC HEGEMONY (v, psi) CANVAS RENDERER (MATCHES AUSTRALIAN_KANON_HEGEMONY_VISUALIZATION.HTML) ---------- */
function drawHegemonyCanvas(profile) {
  const canvas = document.getElementById("hegemony-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const pad = 42;
  const plotW = W - pad * 2;
  const plotH = H - pad * 2;
  const range = 1.25;

  // Inverted X-axis matching AustralianMatrix.html & Australian_Kanon_Hegemony_Visualization.html:
  // Positive υ (+1 Universal) is LEFT, Negative υ (-1 Self) is RIGHT.
  const toX = (v) => cx - (v / range) * (plotW / 2);
  const toY = (psi) => cy - (psi / range) * (plotH / 2);

  // Clean white canvas base
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, W, H);

  // 4 Quadrant pastel shading matching Australian_Kanon_Hegemony_Visualization.html
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = "#4ade80"; ctx.fillRect(pad, pad, plotW / 2, plotH / 2); // TL - Greater Good (+υ, +ψ)
  ctx.fillStyle = "#f87171"; ctx.fillRect(cx, pad, plotW / 2, plotH / 2);  // TR - Greatest Lie (-υ, +ψ)
  ctx.fillStyle = "#38bdf8"; ctx.fillRect(pad, cy, plotW / 2, plotH / 2);  // BL - Lesser Good (+υ, -ψ)
  ctx.fillStyle = "#fb923c"; ctx.fillRect(cx, cy, plotW / 2, plotH / 2);   // BR - Greater Evil (-υ, -ψ)
  ctx.globalAlpha = 1;

  // Subtle grid lines
  ctx.strokeStyle = "#E2E8F0";
  ctx.lineWidth = 1;
  [-1.0, -0.5, 0.5, 1.0].forEach(val => {
    ctx.beginPath(); ctx.moveTo(toX(val), pad); ctx.lineTo(toX(val), H - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, toY(val)); ctx.lineTo(W - pad, toY(val)); ctx.stroke();
  });

  // Zone 1 boundary (±1.0 dashed box)
  ctx.strokeStyle = "#64748B";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]);
  ctx.strokeRect(toX(1), toY(1), toX(-1) - toX(1), toY(-1) - toY(1));
  ctx.setLineDash([]);

  // Primary Axes
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, pad); ctx.lineTo(cx, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(W - pad, cy); ctx.stroke();

  // Quadrant Labels
  ctx.font = "700 10.5px 'Inter', sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "#15803D";
  ctx.fillText("GREATER GOOD (+υ, +ψ)", pad + 8, pad + 16);
  ctx.fillStyle = "#0369A1";
  ctx.fillText("LESSER GOOD (+υ, -ψ)", pad + 8, H - pad - 8);
  ctx.textAlign = "right";
  ctx.fillStyle = "#B91C1C";
  ctx.fillText("GREATEST LIE (-υ, +ψ)", W - pad - 8, pad + 16);
  ctx.fillStyle = "#C2410C";
  ctx.fillText("GREATER EVIL (-υ, -ψ)", W - pad - 8, H - pad - 8);

  ctx.fillStyle = "#64748B";
  ctx.textAlign = "center";
  ctx.fillText("← υ = +1 (All Beings / Universal)          MORALITY (υ)          υ = -1 (Self-Only / Narrow Group) →", W / 2, H - 12);

  // Plot all 354 Kanon vectors
  const vecs = activeTierVectors();
  vecs.forEach(vec => {
    const x = toX(vec.coords.v);
    const y = toY(vec.coords.psi);
    let a = getAns("V", vec.uid, "A");
    let b = getAns("V", vec.uid, "B");
    const sc = avgNums([a, b]);

    ctx.beginPath();
    ctx.arc(x, y, sc !== null ? 3.8 : 2.5, 0, Math.PI * 2);
    if (vec.fn && sc === null) {
      ctx.fillStyle = "rgba(124, 58, 237, 0.35)";
    } else if (sc === null) {
      ctx.fillStyle = "rgba(100, 116, 139, 0.25)";
    } else if (sc >= 1.0) {
      ctx.fillStyle = "rgba(22, 163, 74, 0.85)";
    } else if (sc <= -1.0) {
      ctx.fillStyle = "rgba(220, 38, 38, 0.85)";
    } else {
      ctx.fillStyle = "rgba(217, 119, 6, 0.85)";
    }
    ctx.fill();
  });

  const drawMarker = (v, psi, label, color, r = 7) => {
    const x = toX(Math.max(-range, Math.min(range, v)));
    const y = toY(Math.max(-range, Math.min(range, psi)));
    ctx.beginPath();
    ctx.arc(x, y, r + 2.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#0F172A";
    ctx.stroke();

    ctx.font = "700 10.5px 'Inter', sans-serif";
    ctx.fillStyle = "#0F172A";
    ctx.textAlign = x > W * 0.65 ? "right" : "left";
    const offX = x > W * 0.65 ? -12 : 12;
    ctx.fillText(label, x + offX, y + 4);
  };

  drawMarker(0.47, 0.23, "Stoic Guardian (+0.47, +0.23)", "#CA8A04", 6);
  drawMarker(-0.05, -0.01, "Pauline Hanson (-0.05, -0.01)", "#DC2626", 5.5);
  drawMarker(0.18, -0.12, "Albanese (+0.18, -0.12)", "#4F46E5", 5.5);

  if (profile.answeredPlanes.length > 0) {
    const xA = toX(Math.max(-range, Math.min(range, profile.coordsA.v)));
    const yA = toY(Math.max(-range, Math.min(range, profile.coordsA.psi)));
    const xB = toX(Math.max(-range, Math.min(range, profile.coordsB.v)));
    const yB = toY(Math.max(-range, Math.min(range, profile.coordsB.psi)));

    ctx.beginPath();
    ctx.setLineDash([4, 3]);
    ctx.moveTo(xA, yA);
    ctx.lineTo(xB, yB);
    ctx.strokeStyle = "#0F172A";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);

    drawMarker(profile.coordsB.v, profile.coordsB.psi, `YOUR WOULD B (${profile.coordsB.v >= 0 ? "+" : ""}${profile.coordsB.v}, ${profile.coordsB.psi >= 0 ? "+" : ""}${profile.coordsB.psi})`, "#2563EB", 7.5);
    drawMarker(profile.coordsA.v, profile.coordsA.psi, `YOUR SHOULD A (${profile.coordsA.v >= 0 ? "+" : ""}${profile.coordsA.v}, ${profile.coordsA.psi >= 0 ? "+" : ""}${profile.coordsA.psi})`, "#059669", 8.5);
  }
}

  const topFig = profile.figureMatches[0];

  const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
  grad.addColorStop(0, "#0e1235");
  grad.addColorStop(0.6, "#0f172a");
  grad.addColorStop(1, "#1e293b");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1350);

  // Border frame
  ctx.strokeStyle = "rgba(250, 204, 21, 0.4)";
  ctx.lineWidth = 3;
  ctx.strokeRect(36, 36, 1008, 1278);

  // Header eyebrow
  ctx.fillStyle = "#FACC15";
  ctx.font = "700 22px 'JetBrains Mono', monospace";
  ctx.fillText("THE AUSTRALIAN KANON · WHAT KIND OF AUSTRALIAN ARE YOU?", 76, 98);

  // Archetype badge & title
  ctx.fillStyle = "#34D399";
  ctx.font = "700 24px 'JetBrains Mono', monospace";
  ctx.fillText(`${arch.badge.toUpperCase()} · ${arch.matchPct}% MATCH`, 76, 165);

  ctx.fillStyle = "#FFFFFF";
  let titleSize = 56;
  ctx.font = `900 ${titleSize}px 'Inter', sans-serif`;
  while (ctx.measureText(arch.name).width > 928 && titleSize > 34) {
    titleSize -= 2;
    ctx.font = `900 ${titleSize}px 'Inter', sans-serif`;
  }
  ctx.fillText(arch.name, 76, 232, 928);

  ctx.fillStyle = "#E2E8F0";
  ctx.font = "italic 28px 'Merriweather', Georgia, serif";
  ctx.fillText(arch.subtitle, 76, 282, 928);

  // 4 Key Stat Boxes
  const stats = [
    { lbl: "PERSONAL KANON ALIGNMENT (A & B)", val: `${profile.personalAlignmentPct ?? profile.alignmentPct ?? "—"}%` },
    { lbl: "PERSONAL SHOULD (A) VS WOULD (B)", val: `${profile.ethosPct ?? "—"}% vs ${profile.livedPct ?? "—"}%` },
    { lbl: "HEGEMONY COORDINATE (υ, ψ)", val: `(${profile.userOverallCoords.v >= 0 ? "+" : ""}${profile.userOverallCoords.v}, ${profile.userOverallCoords.psi >= 0 ? "+" : ""}${profile.userOverallCoords.psi})` },
    { lbl: "CLOSEST HISTORICAL FIGURE", val: `${topFig.name} (${topFig.matchPct}%)`, maxW: 406 }
  ];

  stats.forEach((st, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const bx = 76 + col * 470;
    const by = 325 + row * 125;
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(bx, by, 450, 105);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, 450, 105);

    ctx.fillStyle = "#FACC15";
    ctx.font = "800 30px 'Inter', sans-serif";
    ctx.fillText(st.val, bx + 22, by + 52, st.maxW || 406);

    ctx.fillStyle = "#94A3B8";
    ctx.font = "600 16px 'JetBrains Mono', monospace";
    ctx.fillText(st.lbl, bx + 22, by + 84, 406);
  });

  // 7 Planes Dual Bars
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "800 28px 'Inter', sans-serif";
  ctx.fillText("The 7 Pillars of the Australian Kanon — Should (A) vs. Would (B)", 76, 625);

  profile.planeSummaries.forEach((sum, idx) => {
    const p = sum.plane;
    const y = 665 + idx * 82;
    const pctA = sum.A !== null ? Math.round(((sum.A + 5) / 10) * 100) : 50;
    const pctB = sum.B !== null ? Math.round(((sum.B + 5) / 10) * 100) : 50;

    ctx.fillStyle = "#F8FAFC";
    ctx.font = "700 22px 'Inter', sans-serif";
    ctx.fillText(`P${p.n} ${p.name} (${p.pillar})`, 76, y + 20);

    ctx.fillStyle = "#CBD5E1";
    ctx.font = "600 18px 'JetBrains Mono', monospace";
    ctx.fillText(`Should A: ${pctA}%  |  Would B: ${pctB}%`, 710, y + 20);

    // Bar A
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(76, y + 32, 928, 14);
    ctx.fillStyle = p.hue;
    ctx.fillRect(76, y + 32, (928 * pctA) / 100, 14);

    // Bar B
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(76, y + 50, 928, 10);
    ctx.fillStyle = "#38BDF8";
    ctx.fillRect(76, y + 50, (928 * pctB) / 100, 10);
  });

  ctx.fillStyle = "#94A3B8";
  ctx.font = "500 18px 'JetBrains Mono', monospace";
  ctx.fillText("The Australian Kanon 7×7×7 Matrix · Should / Would Judgment Diagnostic (−5 to +5)", 76, 1280);

  const link = document.createElement("a");
  link.download = `australian-kanon-archetype-${new Date().toISOString().slice(0, 10)}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

/* =========================================================================
   HEADER & ROUTER
   ========================================================================= */
function updateHeaderProgress() {
  const prog = computeGlobalProgress();
  const bar = document.getElementById("global-progress");
  if (bar) bar.style.width = `${prog.pct}%`;

  const tierBtn = document.getElementById("header-tier-btn");
  if (tierBtn) {
    const tierLbl = STATE.tier === 7
      ? "Quiz: Quick (7)"
      : STATE.tier === 49
        ? "Quiz: Standard (49)"
        : "Quiz: Deep Audit (354)";
    tierBtn.textContent = `${tierLbl} · ${prog.done}/${prog.total}`;
    tierBtn.onclick = () => {
      if (STATE.tier === 7) STATE.tier = 49;
      else if (STATE.tier === 49) STATE.tier = 354;
      else STATE.tier = 7;
      STATE.keyringTier = STATE.tier;
      STATE.focusIdx = 0;
      saveState();
      render();
    };
  }
}

function renderNav(route) {
  const nav = document.getElementById("top-nav");
  const items = [
    { href: "#/hub", label: "Hub", active: route.page === "hub" },
    { href: "#/framework", label: "How It Works", active: route.page === "framework" },
    ...PLANES.map(p => ({
      href: `#/plane/${p.n}`,
      label: `Pillar ${p.n}: ${p.name}`,
      dot: p.hue,
      active: route.page === "plane" && route.planeNum === p.n
    })),
    { href: "#/search", label: "Topics", active: route.page === "search" },
    { href: "#/review", label: "Review", active: route.page === "review" },
    { href: "#/results", label: "Results", active: route.page === "results" }
  ];

  nav.innerHTML = items.map(it => `
    <a class="nav-pill ${it.active ? "active" : ""}" href="${it.href}">
      ${it.dot ? `<span class="dot" style="background:${it.dot}"></span>` : ""}
      <span>${it.label}</span>
    </a>
  `).join("");
  updateHeaderProgress();
}

function parseRoute() {
  const h = (location.hash || "#/hub").replace(/^#\/?/, "");
  const parts = h.split("/");
  if (parts[0] === "plane") {
    const n = Math.min(7, Math.max(1, parseInt(parts[1] || "1", 10) || 1));
    return { page: "plane", planeNum: n };
  }
  if (["framework", "results", "search", "review"].includes(parts[0])) {
    return { page: parts[0] };
  }
  return { page: "hub" };
}

let LAST_ROUTE_KEY = "";
function render(opts = {}) {
  hideFloatingTooltip();
  const route = parseRoute();
  const routeKey = `${route.page}:${route.planeNum || ""}`;
  const routeChanged = routeKey !== LAST_ROUTE_KEY;
  LAST_ROUTE_KEY = routeKey;

  const heroBanner = document.getElementById("site-hero-banner");
  if (heroBanner) {
    heroBanner.style.display = (["plane", "search", "review"].includes(route.page)) ? "none" : "";
  }

  renderNav(route);
  const app = document.getElementById("app");
  app.className = (route.page === "results" || route.page === "hub") ? "wide" : "";

  if (route.page === "hub") renderHub(app);
  else if (route.page === "framework") renderFramework(app);
  else if (route.page === "plane") renderPlane(app, route.planeNum);
  else if (route.page === "search") renderSearch(app);
  else if (route.page === "review") renderReview(app);
  else if (route.page === "results") renderResults(app);

  if (routeChanged) {
    window.scrollTo({ top: 0, behavior: "instant" });
  } else if (opts.scrollToCards) {
    document.getElementById("plane-nodes-container")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
window.addEventListener("hashchange", () => render());

      </svg>
      <span>Explain</span>

  `;

function renderABCDBlockHTML(prefix, id, item, planeHue, extraHeaderHTML = "", extraFooterHTML = "") {
  const valA = getAns(prefix, id, "A");
  const valB = getAns(prefix, id, "B");
  const valC = getAns(prefix, id, "C");
  const chosenBlockers = getBlockers(prefix, id);
  const answered = valA !== null || valB !== null || valC !== null;

  const isShadow = item.coords && item.coords.v < 0;
  const isFN = !!item.fn;

  const scA = isShadow ? SCALE_A_SHADOW : SCALE_A;
  const scB = isShadow ? SCALE_B_SHADOW : SCALE_B;
  const scC = isShadow ? SCALE_D_SHADOW : SCALE_D; // Uses Systemic Delivery scale for Society C

  const shadowAlertHTML = isShadow ? `
    <div class="shadow-alert-strip">
      <strong>⚠️ Shadow / Flaw Vector (${escapeHtml(item.cleanName || item.name || "")} · υ &lt; 0):</strong>
      This card describes a historical flaw, failure, or shadow in Australian life.
      Click <strong>+1 to +5 (Green · Reject &amp; Overcome Flaw)</strong> if we should call out and overcome this flaw;
      click <strong>−1 to −5 (Red · Excuse / Captured by Flaw)</strong> if you excuse it or if society is still trapped inside it.
    </div>
  ` : "";

  // Support item.qD as society text if present, else fallback to item.qC
  const promptC = item.qD || item.qC;

  const makeRow = (probe, kindLabel, promptText, scaleList, curVal) => {
    const selClass = `sel-${probe.toLowerCase()}`;
    const letterClass = `letter-${probe.toLowerCase()}`;
    return `
      <div class="probe-row">
        <div class="probe-top">
          <span class="probe-letter ${letterClass}">${probe}</span>
          <span class="probe-kind">${kindLabel}</span>
          <span class="probe-text">${renderGlossaryHTML(promptText)}</span>
        </div>
        <div class="scale-row">
          <div class="seg-group" role="radiogroup" aria-label="${probe} rating">
            ${scaleList.map(opt => {
              const sel = curVal === opt.v;
              const numStr = opt.v > 0 ? `+${opt.v}` : `${opt.v}`;
              const isAnchor = [-5, -3, 0, 3, 5].includes(opt.v);
              return `
                <button type="button"
                  class="seg-btn ${sel ? `sel ${selClass}` : ""} ${isAnchor ? "is-anchor" : ""}"
                  data-prefix="${prefix}" data-id="${id}" data-probe="${probe}" data-val="${opt.v}"
                  title="${escapeHtml(opt.tip || `${numStr}: ${opt.lbl}`)}"
                  aria-pressed="${sel ? "true" : "false"}">
                  <span class="num">${numStr}</span>
                  ${isAnchor ? `<span class="lbl">${opt.lbl}</span>` : ""}
                </button>
              `;
            }).join("")}
          </div>
          <button type="button" class="seg-clear" title="Clear row"
            data-clear-prefix="${prefix}" data-clear-id="${id}" data-clear-probe="${probe}">clear</button>
        </div>
        ${probe === "C" ? `
          <details class="blocker-disclosure" ${chosenBlockers.length > 0 ? "open" : ""} style="margin-top:8px;">
            <summary class="mono" style="font-size:0.73rem;color:var(--ink-muted);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;">
              <span>+ Tag what's blocking this in Australia ${chosenBlockers.length > 0 ? `(${chosenBlockers.length} tagged)` : "(optional)"}</span>
            </summary>
            <div class="blocker-chips-wrap" style="margin-top:6px;">
              ${BLOCKER_TAGS.map(tag => {
                const active = chosenBlockers.includes(tag);
                return `<button type="button" class="blocker-chip-btn ${active ? "active" : ""}" data-blocker-prefix="${prefix}" data-blocker-id="${id}" data-blocker-tag="${tag}">${tag}</button>`;
              }).join("")}
            </div>
          </details>
        ` : ""}
      </div>
    `;
  };

  return `
    <section class="sense-card ${answered ? "answered" : ""} ${isShadow ? "shadow-node" : ""} ${isFN ? "fn-node" : ""}" id="node-${prefix}-${id}" style="--plane-color:${planeHue}">
      ${extraHeaderHTML}
      ${shadowAlertHTML}
      ${makeRow("A", "Personal · Should", item.qA, scA, valA)}
      ${makeRow("B", "Personal · Would", item.qB, scB, valB)}
      ${makeRow("C", "Society · Australia", promptC, scC, valC)}
      ${extraFooterHTML}
    </section>
  `;
}

function setupGlobalABCDDelegation() {
  document.addEventListener("click", (e) => {
    // (?) Explain button
    const infoBtn = e.target.closest("[data-open-info-prefix]");
    if (infoBtn) {
      openNodeInfoSheet(infoBtn.getAttribute("data-open-info-prefix"), infoBtn.getAttribute("data-open-info-id"));
      return;
    }

    // Inline glossary term click (for touch/click devices)
    const gTerm = e.target.closest("[data-glossary-id]");
    if (gTerm) {
      const entry = GLOSSARY_BY_ID[gTerm.getAttribute("data-glossary-id")];
      if (entry) showFloatingTooltip(gTerm, entry.term, entry.definition);
      return;
    }

    const segBtn = e.target.closest(".seg-btn");
    if (segBtn) {
      const prefix = segBtn.getAttribute("data-prefix");
      const id = segBtn.getAttribute("data-id");
      const probe = segBtn.getAttribute("data-probe");
      const val = parseInt(segBtn.getAttribute("data-val"), 10);
      const cur = getAns(prefix, id, probe);
      setAns(prefix, id, probe, cur === val ? null : val);

      const group = segBtn.parentElement;
      const newVal = getAns(prefix, id, probe);
      group.querySelectorAll(".seg-btn").forEach(b => {
        const bVal = parseInt(b.getAttribute("data-val"), 10);
        const sel = bVal === newVal;
        b.classList.toggle("sel", sel);
        b.classList.toggle(`sel-${probe.toLowerCase()}`, sel);
        b.setAttribute("aria-pressed", sel ? "true" : "false");
      });
      const card = segBtn.closest(".sense-card");
      if (card) card.classList.toggle("answered", isNodeAnswered(prefix, id));

      // Update live plane badge if visible
      const route = parseRoute();
      if (route.page === "plane") {
        const newSum = computePlaneSummary(route.planeNum);
        const badge = document.getElementById("plane-live-badge");
        if (badge) {
          badge.textContent = `${newSum.answeredNodes}/${newSum.totalNodes} answered`;
        }
      }
      return;
    }

    const clrBtn = e.target.closest(".seg-clear");
    if (clrBtn) {
      const prefix = clrBtn.getAttribute("data-clear-prefix");
      const id = clrBtn.getAttribute("data-clear-id");
      const probe = clrBtn.getAttribute("data-clear-probe");
      setAns(prefix, id, probe, null);
      const row = clrBtn.closest(".scale-row");
      if (row) {
        row.querySelectorAll(".seg-btn").forEach(b => {
          b.classList.remove("sel", "sel-a", "sel-b", "sel-c", "sel-d");
          b.setAttribute("aria-pressed", "false");
        });
      }
      const card = clrBtn.closest(".sense-card");
      if (card) card.classList.toggle("answered", isNodeAnswered(prefix, id));

      const route = parseRoute();
      if (route.page === "plane") {
        const newSum = computePlaneSummary(route.planeNum);
        const badge = document.getElementById("plane-live-badge");
        if (badge) {
          badge.textContent = `${newSum.answeredNodes}/${newSum.totalNodes} answered`;
        }
      }
      return;
    }

    const blkBtn = e.target.closest(".blocker-chip-btn");
    if (blkBtn) {
      const prefix = blkBtn.getAttribute("data-blocker-prefix");
      const id = blkBtn.getAttribute("data-blocker-id");
      const tag = blkBtn.getAttribute("data-blocker-tag");
      toggleBlocker(prefix, id, tag);
      blkBtn.classList.toggle("active", getBlockers(prefix, id).includes(tag));
      return;
    }

    const expandSenseBtn = e.target.closest("[data-toggle-sense-vectors]");
    if (expandSenseBtn) {
      const sId = expandSenseBtn.getAttribute("data-toggle-sense-vectors");
      STATE.expandedSenses[sId] = !STATE.expandedSenses[sId];
      saveState();
      render();
      return;
    }
  });
}

    cardsArray = allPlaneVecs.map((v, vIdx) => {

      const isLast = vIdx >= allPlaneVecs.length - 1;
      const focusActionHTML = isFocus ? `
        <div style="margin-top:16px;padding-top:14px;border-top:2px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:12px;">
          ${vIdx <= 0
            ? `<a class="btn btn-secondary" href="${pNum > 1 ? `#/plane/${pNum - 1}` : "#/hub"}">${pNum > 1 ? `← Pillar ${pNum - 1}` : "← Back to Hub"}</a>`
            : `<button type="button" class="btn btn-secondary" id="focus-prev-btn">← Back</button>`
          }

  const prevLabel = pNum > 1 ? `← Pillar ${pNum - 1}: ${PLANE_BY_N[pNum - 1].name}` : "← Back to Hub";
  const nextLink = pNum < 7 ? `#/plane/${pNum + 1}` : "#/results";
  const nextLabel = pNum < 7 ? `Next: Pillar ${pNum + 1} (${PLANE_BY_N[pNum + 1].name}) →` : "View Results →";

  // Handle Focus Mode (1 card at a time) vs List Mode
  const totalInView = cardsArray.length;

  let bodyHTML = "";
  let footerNavHTML = "";

  if (totalInView === 0) {
    bodyHTML = `<div class="card"><p style="margin:0;color:var(--ink-muted)">No nodes in Pillar ${p.n}.</p></div>`;

          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

              <div class="view-mode-switch" role="group" aria-label="View mode">
                <button type="button" class="view-mode-btn ${STATE.viewMode === "list" ? "active" : ""}" data-view-mode="list">📋 All</button>

          <span>📖 Background &amp; Everyday Meaning of Pillar ${p.n}: ${escapeHtml(p.name)}</span>

            <div class="plane-pillar-col">

      </details>
    </div>

      ${bodyHTML}

  bindTierSelectorEvents(app);

  app.querySelectorAll("[data-jump-sense]").forEach(btn => {

      const sId = btn.getAttribute("data-jump-sense");

        STATE.tier = 49;
        STATE.viewMode = "list";
        saveState();

        setTimeout(() => {

        }, 40);
      } else if (STATE.tier === 49) {
        if (STATE.viewMode === "focus") {

          document.getElementById(`node-S-${sId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });

        STATE.planeFilter = sId;

  });

  app.querySelectorAll("[data-view-mode]").forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.viewMode = btn.getAttribute("data-view-mode");
      STATE.focusIdx = 0;

      render({ scrollToCards: true });

      STATE.focusIdx++;
      saveState();
      render({ scrollToCards: true });
    }
  });

  // ABCD delegation is bound once globally on document
}

        ${TOPIC_MAP.map(t => `
          <button type="button" class="topic-chip ${activeTopic === t.id && !searchQuery ? "active" : ""}" data-topic="${t.id}">${t.label}</button>
        `).join("")}
      </div>
    </section>
    <div id="search-results" style="margin-top:18px;"></div>
  `;

  const input = document.getElementById("topic-search-input");
  input.addEventListener("input", () => {
    searchQuery = input.value.trim();
    renderSearchResults();
    document.querySelectorAll("#topic-chips .topic-chip").forEach(c => {
      c.classList.toggle("active", !searchQuery && c.getAttribute("data-topic") === activeTopic);
    });
  });

  document.getElementById("topic-chips").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    activeTopic = btn.getAttribute("data-topic");
    searchQuery = "";
    input.value = "";
    document.querySelectorAll("#topic-chips .topic-chip").forEach(c => {
      c.classList.toggle("active", c.getAttribute("data-topic") === activeTopic);
    });
    renderSearchResults();
  });

  renderSearchResults();
}

function renderSearchResults() {
  const box = document.getElementById("search-results");
  const q = searchQuery.toLowerCase();

  if (STATE.tier === 354 || q.length >= 2) {
    const matchedVecs = activeTierVectors().filter(v => {
      if (q) {
        const hay = `${v.uid} ${v.addr} ${v.name} ${v.role} ${v.quote} ${v.attribution} ${v.description} ${(v.tags || []).join(" ")}`.toLowerCase();
        return hay.includes(q);
      }
      return (v.tags || []).includes(activeTopic);
    }).slice(0, 40);

    box.innerHTML = `
      <div style="margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--ink-muted);">
        Showing ${matchedVecs.length} matching Kanon Vector node(s):
      </div>
      ${matchedVecs.map(v => renderVectorCardHTML(v, PLANE_BY_N[v.plane].hue)).join("")}
    `;
  } else {
    const matchedSenses = SENSES.filter(s => (s.tags || []).includes(activeTopic));
    box.innerHTML = `
      <div style="margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--ink-muted);">
        Showing ${matchedSenses.length} matching 7×7 Sense node(s) (type in the search box above to search all 354 individual vectors):
      </div>
      ${matchedSenses.map(s => {
        const p = PLANE_BY_N[s.plane];
        const headerHTML = `
          <div class="sense-header">
            <div>
              <span class="sense-code">Plane ${p.n} · ${s.id} ${s.addr}</span>
              <h3 class="sense-title" style="margin-top:6px;">${escapeHtml(s.title)}</h3>
            </div>
            <div class="node-badges">${infoBtnHTML("S", s.id)}</div>
          </div>
          <p style="margin:6px 0 14px;font-size:0.92rem;color:var(--ink-soft);line-height:1.55;">${renderGlossaryHTML(s.narrative)}</p>
        `;
        return renderABCDBlockHTML("S", s.id, s, p.hue, headerHTML);
      }).join("")}
    `;
  }
}

          </tr>

        <tbody>
          ${PLANES.map(p => {

            return `
              <tr>

              </tr>
            `;
          }).join("")}
        </tbody>
      </table>

  `;

      state: STATE
    }, null, 2)], { type: "application/json" });

    const a = document.createElement("a");
    a.href = url;
    a.download = `australian-kanon-survey-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("input-import-json").addEventListener("change", (e) => {
    const file = e.target.files[0];

    const reader = new FileReader();

      try {
        const data = JSON.parse(reader.result);
        const st = data.state || data;
        if (st && st.answers) {
          STATE = { ...STATE, ...st };
          saveState();
          render();
        }
      } catch (err) {
        alert("Could not parse JSON file.");
      }
    };
    reader.readAsText(file);
  });

      saveState();
      render();
    }
  });

  const answeredPlanes = profile.answeredPlanes;
  let V_norm = null, V_signed = null;
  if (answeredPlanes.length > 0) {
    const norms = answeredPlanes.map(s => Math.max(0.05, (s.total + 5) / 10));
    const prod = norms.reduce((acc, v) => acc * v, 1);
    V_norm = Math.pow(prod, 1 / norms.length);
    V_signed = -5 + 10 * V_norm;
  }

  // National Signature Insights:
  // 1. Defining Pillar (highest total or A)
  const sortedByTotal = [...summaries].filter(s => s.total !== null).sort((a, b) => b.total - a.total);
  const strongestPlane = sortedByTotal[0] || summaries[0];
  const weakestPlane = sortedByTotal[sortedByTotal.length - 1] || summaries[6];

  // 2. Biggest Betrayed Promise (Should A - Society D or Would B tension)
  const sortedByGap = [...summaries]
    .filter(s => s.A !== null && (s.D !== null || s.B !== null))
    .map(s => ({ ...s, gap: s.D !== null ? (s.A - s.D) : (s.A - s.B) }))
    .sort((a, b) => b.gap - a.gap);
  const topTensionPlane = sortedByGap[0] || null;

        const socDeficit = s.D !== null ? Math.max(0, (5 - s.D) / 10) : deficit;
        const gapBoost = s.gapAD !== null ? Math.max(0, s.gapAD) / 10 : 0.3;
        const strainScore = ((deficit + socDeficit) / 2) * (1 + gapBoost) * (1 + 1 / sum.plane.tau);
        allSenseRows.push({
          plane: sum.plane,
          code: s.sense.id,
          addr: s.sense.addr,
          title: s.sense.title,
          A: s.A, B: s.B, C: s.C, D: s.D,
          total: s.total,
          gapAB: s.gapAB,
          strainScore
        });
      }
    });
  });

  const highestStrain = [...allSenseRows].sort((a, b) => b.strainScore - a.strainScore).slice(0, 8);
  const strongestPillars = [...allSenseRows].filter(x => x.total !== null).sort((a, b) => b.total - a.total).slice(0, 8);

                <td><button type="button" class="info-btn" data-compare-type="archetype" data-compare-id="${a.id}">(?)</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </section>

      <section class="card">
        <div class="eyebrow">Historical & Audited Figures</div>
        <h3 style="margin:2px 0 12px;">Closest Australian Figures & Kanon Audits</h3>
        <table class="rank-table">
          <thead>
            <tr><th>Figure / Audited Record</th><th>Kanon</th><th>Proximity</th><th>Inspect</th></tr>
          </thead>
          <tbody>
            ${profile.figureMatches.map(f => `
              <tr>
                <td>
                  <strong>${escapeHtml(f.name)}</strong>
                  <div style="font-size:0.76rem;color:var(--ink-muted)">${escapeHtml(f.role)}</div>
                </td>
                <td class="mono">${f.alignment}%</td>
                <td class="mono"><span class="pill-score ${f.matchPct >= 70 ? "pill-high" : f.matchPct >= 45 ? "pill-mid" : "pill-low"}">${f.matchPct}%</span></td>
                <td><button type="button" class="info-btn" data-compare-type="figure" data-compare-id="${f.id || f.name}">(?)</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        ${profile.hansonCompared > 0 ? `
          <div class="callout" style="margin-top:12px;font-size:0.84rem;">
            <strong>Direct Audit Cross-Check:</strong> Across ${profile.hansonCompared} decisive vector(s), your ratings agreed with
            <a href="../Hanson_Audit/index.html">Pauline Hanson's 354-Vector Audit</a> on <strong>${profile.hansonAgree}/${profile.hansonCompared} (${Math.round(profile.hansonAgree/profile.hansonCompared*100)}%)</strong>
            ${profile.alboCompared > 0 ? ` and with Anthony Albanese's audited vectors on <strong>${profile.alboAgree}/${profile.alboCompared} (${Math.round(profile.alboAgree/profile.alboCompared*100)}%)</strong>` : ""}.
          </div>
        ` : ""}
      </section>
    </div>

    <!-- 6. HEAD-TO-HEAD COMPARE PICKER -->
    <section class="card" id="sec-compare" style="margin-top:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;">
        <div>
          <div class="eyebrow">Interactive Profile Comparison</div>
          <h2 style="margin-top:2px;">Compare Yourself Head-to-Head Across the 7 Planes</h2>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <label for="compare-select" class="mono" style="font-size:0.78rem;color:var(--ink-soft);">Compare with:</label>
          <select id="compare-select" class="search-input" style="width:auto;padding:7px 12px;font-size:0.88rem;">
            <optgroup label="Historical & Audited Figures">
              ${FIGURES.map(f => `<option value="${f.id || f.name}" ${activeCompare.id === (f.id || f.name) ? "selected" : ""}>${escapeHtml(f.name)}</option>`).join("")}
            </optgroup>
            <optgroup label="Australian Archetypes">
              ${ARCHETYPES.map(a => `<option value="${a.id}" ${activeCompare.id === a.id ? "selected" : ""}>${escapeHtml(a.name)}</option>`).join("")}
            </optgroup>
          </select>
        </div>
      </div>

      <div class="callout" style="margin-bottom:16px;">
        <strong>${escapeHtml(activeCompare.name)}</strong> (${escapeHtml(activeCompare.role)}): ${escapeHtml(activeCompare.desc)}
      </div>

      ${PLANES.map((p, i) => {
        const sum = summaries[i];
        const youPct = sum.total !== null ? Math.round(((sum.total + 5) / 10) * 100) : 50;
        const themPct = Math.round((activeCompare.pillars[i] || 0.5) * 100);
        return `
          <div class="closeness-row" style="padding:6px 0;border-bottom:1px dashed var(--rule);">
            <div class="closeness-head">
              <span><strong style="color:${p.hue}">P${p.n} · ${p.name}</strong> (${p.pillar})</span>
              <span class="mono"><strong style="color:var(--accent)">You: ${youPct}%</strong> vs <strong style="color:var(--gold)">${escapeHtml(activeCompare.name)}: ${themPct}%</strong></span>
            </div>
            <div class="closeness-track">
              <span class="closeness-pin pin-them" style="left:${themPct}%" title="${escapeHtml(activeCompare.name)}: ${themPct}%">T</span>
              <span class="closeness-pin pin-you" style="left:${youPct}%" title="You: ${youPct}%">Y</span>
            </div>
          </div>
        `;
      }).join("")}
    </section>

    <!-- 7. INDIVIDUAL PLANE KEYRING STARS -->
    <section style="margin-top:24px;">
      <h2>The 7 Individual Plane Keyring Stars</h2>
      <p style="color:var(--ink-soft);margin:4px 0 12px;">
        Each Plane's 7 Senses (<code>.1 Who</code> to <code>.7 Effect</code>) plotted separately. Click any card to edit that Plane's answers.
      </p>
      <div class="plane-stars-grid">
        ${PLANES.map(p => {
          const sum = summaries[p.n - 1];
          return `
            <a class="plane-star-card" href="#/plane/${p.n}" style="--plane-color:${p.hue};text-decoration:none;color:inherit;">
              <div class="mono" style="font-size:0.74rem;color:${p.hue};font-weight:600;">PLANE ${p.n} · ${p.pillar.toUpperCase()}</div>
              <h3 style="font-size:1.05rem;margin:2px 0 6px;">${p.name}</h3>
              ${planeStarSVG(p.n, 195)}
              <div class="mono" style="font-size:0.74rem;color:var(--ink-soft);margin-top:4px;">
                ${sum.total !== null ? `A: ${fmtSigned(sum.A, 1)} · B: ${fmtSigned(sum.B, 1)} · C: ${fmtSigned(sum.C, 1)}` : "Click to answer"}
              </div>
            </a>
          `;
        }).join("")}
      </div>
    </section>

    <!-- 8. AUSTRALIAN READINGS & PRIMARY SOURCES (CANONICAL TEXTS) -->
    <section class="card" id="sec-readings" style="margin-top:24px;">
      <div class="eyebrow">Essential Australian Kanon Library</div>
      <h2 style="margin:2px 0 6px;">Primary Sources & Classic Works Matched to Your Profile</h2>
      <p style="margin:0;color:var(--ink-soft);font-size:0.9rem;">
        Foundational texts that forged the vectors in your strongest and most contested Planes:
      </p>
      <div class="books-grid">
        ${BOOKS.map(b => `
          <div class="book-card">
            <div class="mono" style="font-size:0.72rem;color:var(--accent);">Planes ${b.planes.map(n => `P${n}`).join(", ")} · ${escapeHtml(b.year)}</div>
            <h3 style="font-size:1.05rem;">${escapeHtml(b.title)}</h3>
            <div class="mono" style="font-size:0.78rem;color:var(--ink-muted);">By ${escapeHtml(b.author)}</div>
            <p style="margin:4px 0 0;font-size:0.84rem;color:var(--ink-soft);">${renderGlossaryHTML(b.desc)}</p>
          </div>
        `).join("")}
      </div>
    </section>

    <!-- 9. WELFARE DIAGNOSTICS: BLOCKERS, CHAIN REACTION & TENSION -->
    <section class="card" id="sec-diagnostics" style="margin-top:24px;">
      <div class="eyebrow">National Reality Check</div>
      <h2 style="margin:4px 0 12px;">Where the Australian Promise Is Blocked vs. Flourishing</h2>

      ${profile.topBlockers.length > 0 ? `
        <div class="callout callout-warm" style="margin-bottom:16px;">
          <strong>Top Systemic Blockers Reported in Society:</strong>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
            ${profile.topBlockers.map(b => `
              <span class="badge badge-shadow" style="font-size:0.8rem;padding:4px 10px;">${escapeHtml(b.tag)}: <strong>${b.count}×</strong></span>
            `).join("")}
          </div>
        </div>
      ` : ""}

      ${chokepoints.length > 0 ? `
        <div class="callout" style="margin-bottom:16px;">
          <strong>Chokepoint Alert:</strong>
          <ul style="margin:6px 0 0;padding-left:20px;">
            ${chokepoints.map(cp => {
              const idx = chainOrder.indexOf(cp.plane.n);
              const nextP = PLANE_BY_N[chainOrder[(idx + 1) % 7]];
              return `<li><strong>Pillar ${cp.plane.n} (${cp.plane.name} — ${fmtSigned(cp.total, 2)})</strong> is strained, putting pressure on <strong>Pillar ${nextP.n} (${nextP.name})</strong>.</li>`;
            }).join("")}
          </ul>
        </div>
      ` : ""}

      <div class="dash-grid">
        <div>
          <h3 style="margin-bottom:8px;color:var(--bad);">Largest Contradictions (Your Ideals vs Society Today)</h3>
          <table class="rank-table">
            <thead>
              <tr><th>Theme</th><th>Should A</th><th>Would B</th><th>Society C</th><th>Gap</th></tr>
            </thead>
            <tbody>
              ${highestStrain.length ? highestStrain.map(r => `
                <tr>
                  <td><strong>${r.code}</strong><div style="font-size:0.75rem;color:var(--ink-muted)">${escapeHtml(r.title)}</div></td>
                  <td>${scorePill(r.A)}</td>
                  <td>${scorePill(r.B)}</td>
                  <td>${scorePill(r.C)}</td>
                  <td>${scorePill(r.gapAB !== null ? r.gapAB : (r.A !== null && r.C !== null ? r.A - r.C : null))}</td>
                </tr>
              `).join("") : `<tr><td colspan="5" style="color:var(--ink-muted)">Answer questions to see priority strain rankings.</td></tr>`}
            </tbody>
          </table>
        </div>

        <div>
          <h3 style="margin-bottom:8px;color:var(--ok);">Strongest Core Values</h3>
          <table class="rank-table">
            <thead>
              <tr><th>Theme</th><th>Should</th><th>Would</th><th>Score</th></tr>
            </thead>
            <tbody>
              ${strongestPillars.length ? strongestPillars.map(r => `
                <tr>
                  <td><strong>${r.code}</strong><div style="font-size:0.75rem;color:var(--ink-muted)">${escapeHtml(r.title)}</div></td>
                  <td>${scorePill(r.A)}</td>
                  <td>${scorePill(r.B)}</td>
                  <td>${scorePill(r.total)}</td>
                </tr>
              `).join("") : `<tr><td colspan="4" style="color:var(--ink-muted)">Answer questions to see strongest pillars.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  `;

  setTimeout(() => drawHegemonyCanvas(profile), 0);

  document.getElementById("res-preset-battler")?.addEventListener("click", () => loadPresetProfile("betrayed_battler"));
  document.getElementById("res-preset-guardian")?.addEventListener("click", () => loadPresetProfile("stoic_guardian"));
  document.getElementById("res-preset-hanson")?.addEventListener("click", () => loadPresetProfile("hanson_354"));

  document.getElementById("btn-download-png")?.addEventListener("click", () => downloadShareCardPNG(profile));

  document.getElementById("compare-select")?.addEventListener("change", (e) => {
    STATE.compareTargetId = e.target.value;
    saveState();
    renderResults(app);
  });

  app.querySelectorAll("[data-open-info-prefix]").forEach(btn => {
    btn.addEventListener("click", () => {
      openNodeInfoSheet(btn.getAttribute("data-open-info-prefix"), btn.getAttribute("data-open-info-id"));
    });
  });

  app.querySelectorAll("[data-compare-type]").forEach(btn => {
    btn.addEventListener("click", () => {
      openComparisonSheet(btn.getAttribute("data-compare-type"), btn.getAttribute("data-compare-id"));
    });
  });

  app.querySelectorAll("[data-keyring-tier]").forEach(btn => {
    btn.addEventListener("click", () => {
      const tier = parseInt(btn.getAttribute("data-keyring-tier"), 10);
      STATE.keyringTier = tier;
      saveState();
      renderResults(app);
    });
  });

  app.querySelectorAll("[data-t3-plane]").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = btn.getAttribute("data-t3-plane");
      STATE.keyringT3Plane = p === "all" ? "all" : parseInt(p, 10);
      saveState();
      renderResults(app);
    });
  });

  document.getElementById("btn-copy-summary")?.addEventListener("click", (e) => {
    const text = [
      `🇦🇺 What Kind of Australian Are You? — Australian Kanon Should / Would Survey`,
      `Archetype: ${primaryArch.name} (${primaryArch.matchPct}% match) — ${primaryArch.subtitle}`,
      `Overall Kanon Alignment: ${profile.alignmentPct ?? "—"}% (Personal Should A: ${profile.ethosPct ?? "—"}% | Personal Would B: ${profile.livedPct ?? "—"}% | Society D: ${profile.societyPct ?? "—"}%)`,
      `Psochic Hegemony Coordinate: (υ = ${profile.userOverallCoords.v >= 0 ? "+" : ""}${profile.userOverallCoords.v}, ψ = ${profile.userOverallCoords.psi >= 0 ? "+" : ""}${profile.userOverallCoords.psi})`,
      `Vector Verdicts: ${profile.hitCount} HIT / ${profile.failCount} FAIL (${profile.netAlignmentPct >= 0 ? "+" : ""}${profile.netAlignmentPct}% Net)`
    ].join("\n");
    navigator.clipboard?.writeText(text);
    const btn = e.currentTarget;
    const orig = btn.textContent;
    btn.textContent = "✓ Copied Summary!";
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
}

// Initial mount
setupGlobalTooltips();
setupGlobalABCDDelegation();
render();
</script>
</body>
</html>
