<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What Kind of Australian Are You? — The Australian Kanon Survey (7 · 49 · 354)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #F8FAFC;
  --bg-card:   #FFFFFF;
  --bg-subtle: #F8FAFC;
  --bg-inset:  #F1F5F9;
  --bg-muted:  #E2E8F0;
  --ink:       #111827;
  --ink-soft:  #4B5563;
  --ink-muted: #64748B;
  --rule:      #E2E8F0;
  --rule-strong:#CBD5E1;

  --navy:          #0e1235;
  --accent:        #059669; /* Emerald 600 (+υ/+ψ Greater Good) */
  --accent-soft:   #D1FAE5; /* Emerald 100 */
  --accent-warm:   #D97706; /* Amber 600 */
  --accent-warm-soft:#FEF3C7; /* Amber 100 */
  --gold:          #CA8A04; /* Yellow 600 */
  --gold-soft:     #FEF9C3; /* Yellow 100 */

  /* Exact 7 Plane Colors from AustralianMatrix.html & Plane_1..7.html */
  --p1: #CA8A04; /* Plane 1 Identity (Who) - Yellow 600 */
  --p2: #D97706; /* Plane 2 Definition (What) - Amber 600 */
  --p3: #16A34A; /* Plane 3 Land (Where) - Green 600 */
  --p4: #0D9488; /* Plane 4 Drive (Why) - Teal 600 */
  --p5: #2563EB; /* Plane 5 Method (How) - Blue 600 */
  --p6: #4F46E5; /* Plane 6 Foundation (Cause) - Indigo 600 */
  --p7: #9333EA; /* Plane 7 Result (Effect) - Purple 600 */

  --ok:   #059669;
  --warn: #D97706;
  --bad:  #DC2626;

  --radius: 16px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
h1, h2, h3, h4 {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
}
.serif {
  font-family: 'Merriweather', Georgia, serif;
}
.mono {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.85em;
}

/* ---------- KANON SITE TOP NAVIGATION (MATCHES PLANE_1..7 & ARCHETYPE) ---------- */
.kanon-site-bar {
  background: #111827;
  color: #D1D5DB;
  font-size: 0.875rem;
  border-bottom: 1px solid #1F2937;
}
.kanon-site-bar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.kanon-site-brand a {
  color: #D1D5DB;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 6px 10px;
  border-radius: 6px;
  transition: all 0.15s;
}
.kanon-site-brand a:hover {
  color: #FFFFFF;
  background: #374151;
}
.kanon-site-links {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.kanon-site-links a {
  color: #D1D5DB;
  text-decoration: none;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: 6px;
  transition: all 0.15s;
}
.kanon-site-links a.plane-link {
  color: #FEF9C3;
}
.kanon-site-links a.plane-link:hover {
  background: #854D0E;
  color: #FFFFFF;
}
.kanon-site-links a:hover {
  color: #FFFFFF;
  background: #374151;
}
.kanon-site-links a.active {
  color: #FDE68A;
  background: rgba(120, 53, 15, 0.55);
  font-weight: 700;
}

/* ---------- AUSTRALIAN KANON HERO BANNER (MATCHES AUSTRALIANMATRIX.HTML) ---------- */
.kanon-hero-banner {
  position: relative;
  overflow: hidden;
  background-color: #0e1235;
  color: #FFFFFF;
  border-bottom: 1px solid #1E293B;
}
.kanon-hero-flag {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0.18;
  transform: scale(1.15);
}
.kanon-hero-flag svg {
  width: 100%;
  height: 100%;
}
.kanon-hero-inner {
  max-width: 1220px;
  margin: 0 auto;
  padding: 40px 24px 36px;
  position: relative;
  z-index: 10;
  text-align: center;
}
.kanon-hero-title {
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: clamp(2.1rem, 4.5vw, 3.6rem);
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, #BFDBFE 0%, #FFFFFF 50%, #FEF08A 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin: 0 0 10px;
}
.kanon-hero-quote {
  font-family: 'Merriweather', Georgia, serif;
  font-style: italic;
  font-size: clamp(1.1rem, 2vw, 1.45rem);
  color: #E5E7EB;
  margin: 0 auto 8px;
  max-width: 720px;
}
.kanon-hero-sub {
  font-size: 0.98rem;
  color: #9CA3AF;
  font-weight: 400;
  max-width: 680px;
  margin: 0 auto 16px;
}
.kanon-hero-bar {
  height: 4px;
  width: 112px;
  background: #EAB308;
  margin: 0 auto;
  border-radius: 999px;
}

/* ---------- STICKY APP HEADER ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 1.02rem;
  letter-spacing: -0.015em;
  margin-right: auto;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--p1), var(--p2), var(--p3), var(--p4), var(--p5), var(--p6), var(--p7), var(--p1));
  box-shadow: inset 0 0 0 5px #FFFFFF, inset 0 0 0 6.5px #0e1235;
  flex-shrink: 0;
}
.nav-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
}
.nav-pill {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.nav-pill:hover {
  background: var(--bg-inset);
  color: var(--ink);
}
.nav-pill.active {
  background: #0e1235;
  color: #FFFFFF;
}
.nav-pill .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.tier-badge-top {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  padding: 5px 10px;
  border-radius: 999px;
  background: #FEF9C3;
  color: #854D0E;
  border: 1px solid #FDE047;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.tier-badge-top:hover {
  background: #FEF08A;
}
.progress-bar-wrap {
  height: 3px;
  background: var(--bg-inset);
  width: 100%;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--p1), var(--p2), var(--p3), var(--p4), var(--p5), var(--p6), var(--p7));
  width: 0%;
  transition: width 0.3s ease;
}

/* ---------- MAIN CONTAINER ---------- */
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}
main.wide { max-width: 1280px; }

/* ---------- TYPOGRAPHY & BUTTONS ---------- */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #4F46E5;
  font-weight: 700;
}
.lede {
  font-size: 1.06rem;
  color: var(--ink-soft);
  max-width: 72ch;
  line-height: 1.65;
}
.btn {
  appearance: none;
  border: 1px solid #047857;
  background: #047857;
  color: #FFFFFF;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  transition: all 0.15s ease;
}
.btn:hover {
  background: #065F46;
  border-color: #065F46;
}
.btn-secondary {
  background: #FFFFFF;
  color: #374151;
  border: 1px solid #D1D5DB;
}
.btn-secondary:hover {
  background: #F9FAFB;
  border-color: #9CA3AF;
  color: #111827;
}
.btn-warm {
  background: #D97706;
  border-color: #D97706;
  color: #FFFFFF;
}
.btn-warm:hover {
  background: #B45309;
  border-color: #B45309;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 0.81rem;
}

/* ---------- CARDS & SURFACES ---------- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 24px 28px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 18px; }
.callout {
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-left: 4px solid #059669;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.93rem;
  color: var(--ink-soft);
}
.callout strong { color: var(--ink); }
.callout-warm {
  background: #FFFBEB;
  border-color: #FDE68A;
  border-left-color: #D97706;
}
.callout-gold {
  background: #FEFCE8;
  border-color: #FEF08A;
  border-left-color: #EAB308;
}

/* ---------- INLINE GLOSSARY TOOLTIPS ---------- */
.glossary-term {
  border-bottom: 1.5px dotted #4F46E5;
  color: inherit;
  cursor: help;
  padding-bottom: 0.5px;
  transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  border-radius: 2px;
}
.glossary-term:hover,
.glossary-term:focus-visible,
.glossary-term.is-active {
  background: #EEF2FF;
  color: #4338CA;
  border-bottom-style: solid;
  outline: none;
}
.glossary-tooltip {
  position: fixed;
  z-index: 300;
  width: min(340px, calc(100vw - 24px));
  background: #0F172A;
  color: #F8FAFC;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 12px 15px;
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.35);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  line-height: 1.5;
  pointer-events: auto;
  animation: tooltip-pop 0.14s ease-out;
}
.glossary-tooltip strong {
  display: block;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  color: #FACC15;
  margin-bottom: 4px;
}
.glossary-tooltip span {
  display: block;
  color: #E2E8F0;
}
@keyframes tooltip-pop {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- (?) INFO BUTTON & MODAL SHEET ---------- */
.info-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--rule-strong);
  background: #F8FAFC;
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s ease;
  flex-shrink: 0;
}
.info-btn svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}
.info-btn:hover,
.info-btn:focus-visible {
  background: #0e1235;
  color: #FFFFFF;
  border-color: #0e1235;
}
.info-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 250;
  background: rgba(15, 23, 42, 0.58);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 20px;
  animation: sheet-fade 0.18s ease;
}
.info-sheet {
  position: relative;
  width: min(580px, 100%);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--rule-strong);
  border-top: 5px solid var(--sheet-accent, #4F46E5);
  border-radius: 16px;
  padding: 24px 26px;
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
  animation: sheet-pop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.info-sheet-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
}
.info-sheet-close:hover {
  background: var(--ink);
  color: #FFFFFF;
}
.explain-sides-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}
@media (max-width: 640px) {
  .explain-sides-grid { grid-template-columns: 1fr; }
  .info-sheet-backdrop { place-items: end stretch; padding: 0; }
  .info-sheet { border-radius: 18px 18px 0 0; max-height: 88dvh; }
}
.explain-box {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.86rem;
}
.explain-box.is-high {
  border-left: 3px solid var(--ok);
  background: #ECFDF5;
}
.explain-box.is-low {
  border-left: 3px solid var(--bad);
  background: #FEF2F2;
}
.explain-box h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.explain-box.is-high h4 { color: var(--ok); }
.explain-box.is-low h4 { color: var(--bad); }
.explain-box p { margin: 0; color: var(--ink-soft); line-height: 1.48; }

@keyframes sheet-fade { from { opacity: 0; } }
@keyframes sheet-pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } }

/* ---------- TIER SELECTOR CARDS (7 · 49 · 354) ---------- */
.tier-selector-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 18px 0 24px;
}
@media (max-width: 820px) {
  .tier-selector-grid { grid-template-columns: 1fr; }
}
.tier-card {
  background: var(--bg-card);
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  padding: 20px 22px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.tier-card:hover {
  border-color: #94A3B8;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.tier-card.active {
  border-color: #059669;
  background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%);
  box-shadow: 0 4px 18px rgba(5, 150, 105, 0.12);
}
.tier-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tier-num {
  font-family: 'Inter', sans-serif;
  font-size: 1.9rem;
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
}
.tier-card.active .tier-num { color: #047857; }
.tier-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.71rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-inset);
  color: var(--ink-soft);
  font-weight: 600;
}
.tier-card.active .tier-pill {
  background: #059669;
  color: #fff;
}
.tier-rec-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: #FEF9C3;
  color: #854D0E;
  border: 1px solid #FDE047;
  font-weight: 700;
}
.tier-card h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
}
.tier-card p {
  margin: 0;
  font-size: 0.86rem;
  color: var(--ink-soft);
  line-height: 1.5;
}
.tier-card-meta {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  color: var(--ink-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.depth-dots {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}
.depth-dots i {
  width: 10px;
  height: 5px;
  border-radius: 2px;
  background: var(--rule-strong);
  display: inline-block;
}
.depth-dots i.on {
  background: #059669;
}

/* ---------- HUB PLANE GRID (MATCHES AUSTRALIANMATRIX.HTML 7 PLANE CARDS) ---------- */
.plane-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 20px;
  margin-top: 18px;
}
.plane-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--plane-color, var(--accent));
  border-radius: 20px;
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow-sm);
}
.plane-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--plane-color, var(--accent));
}
.plane-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.plane-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  color: var(--plane-color, var(--ink-muted));
  background: var(--bg-inset);
  padding: 3px 9px;
  border-radius: 999px;
  font-weight: 700;
}
.plane-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--bg-inset);
  color: var(--ink-soft);
}
.plane-status.done {
  background: #D1FAE5;
  color: #065F46;
  font-weight: 700;
}
.plane-status.partial {
  background: #FEF3C7;
  color: #92400E;
  font-weight: 600;
}
.plane-card h3 {
  font-size: 1.45rem;
  font-weight: 800;
}
.plane-card .pillar-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  color: var(--plane-color, var(--accent));
  font-weight: 700;
}
.plane-card p {
  margin: 0;
  font-size: 0.88rem;
  color: var(--ink-soft);
  flex: 1;
  line-height: 1.55;
}
.plane-mini-bar {
  height: 6px;
  background: var(--bg-inset);
  border-radius: 999px;
  overflow: hidden;
  display: flex;
}
.plane-mini-bar > span {
  height: 100%;
  background: var(--plane-color, var(--accent));
  transition: width 0.3s ease;
}

/* ---------- QUESTIONNAIRE / ABCD NODE VIEW ---------- */
.plane-banner {
  border-left: 5px solid var(--plane-color, var(--accent));
  padding: 24px 28px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
}
.plane-banner-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.plane-code-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 14px;
  border-radius: 10px;
  background: var(--plane-color, var(--accent));
  color: #FFFFFF;
  font-weight: 800;
  font-size: 0.92rem;
  letter-spacing: 0.02em;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
}
.plane-quote-box {
  margin-top: 12px;
  padding: 14px 18px;
  background: var(--bg-subtle);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--plane-color, var(--accent));
  border-radius: var(--radius-sm);
  font-family: 'Merriweather', Georgia, serif;
  font-style: italic;
  font-size: 0.98rem;
  color: #1F2937;
  line-height: 1.6;
}
.plane-quote-box cite {
  display: block;
  margin-top: 6px;
  font-family: 'Inter', sans-serif;
  font-style: normal;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.72rem;
  color: var(--ink-muted);
}
.plane-totality-box {
  margin-top: 14px;
  padding: 16px 18px;
  background: #FFFFFF;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 0.91rem;
  line-height: 1.68;
  color: #374151;
}
.plane-totality-title {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 1.02rem;
  font-weight: 700;
  color: #111827;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.plane-pillar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.plane-pillar-col {
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius-sm);
  padding: 13px 15px;
  font-size: 0.84rem;
  line-height: 1.58;
  color: #475569;
}
.plane-pillar-col strong.col-head {
  display: block;
  font-size: 0.74rem;
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #0F172A;
  margin-bottom: 5px;
}
.plane-senses-strip {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}
.plane-senses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 7px;
  margin-top: 7px;
}
.plane-sense-chip {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 7px 10px;
  border-radius: 8px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  text-decoration: none;
  color: var(--ink);
  font-size: 0.78rem;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
  text-align: left;
}
.plane-sense-chip:hover {
  border-color: var(--plane-color, var(--accent));
  background: #FFFFFF;
}
.plane-sense-chip .sc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.71rem;
  font-weight: 700;
  color: var(--plane-color, var(--accent));
}
.plane-sense-chip .sc-name {
  font-weight: 600;
  color: #1E293B;
  line-height: 1.3;
}

.legend-sticky {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  margin-bottom: 18px;
  font-size: 0.81rem;
  color: var(--ink-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.legend-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.legend-items span strong {
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
}

.view-mode-switch {
  display: inline-flex;
  background: var(--bg-inset);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  padding: 2px;
  gap: 2px;
}
.view-mode-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.view-mode-btn.active {
  background: #0e1235;
  color: #FFFFFF;
}

/* Focus Mode Stepper Bar */
.focus-stepper-bar {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}
.focus-counter {
  font-family: 'Inter', sans-serif;
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--ink);
}

/* Filter bar for Tier 3 */
.filter-bar {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-chip {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink-soft);
  font-size: 0.76rem;
  font-family: 'JetBrains Mono', monospace;
  padding: 5px 11px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
}
.filter-chip.active {
  background: #2563EB;
  color: #FFFFFF;
  border-color: #2563EB;
}

.sense-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--plane-color, var(--accent));
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  box-shadow: var(--shadow-sm);
}
.sense-card.answered {
  border-color: #A7F3D0;
  border-top-color: var(--plane-color, var(--accent));
}
.sense-card.shadow-node {
  border-left: 4px solid #DC2626;
}
.sense-card.fn-node {
  border-left: 4px solid #7C3AED;
}
.sense-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
}
.sense-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--plane-color, var(--accent));
  background: var(--bg-inset);
  padding: 3px 9px;
  border-radius: 6px;
  white-space: nowrap;
}
.sense-title {
  font-size: 1.12rem;
  font-weight: 800;
  color: var(--ink);
  flex: 1;
}
.node-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.71rem;
  padding: 3px 8px;
  border-radius: 6px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  color: #475569;
  font-weight: 600;
  cursor: help;
}
.badge-fn {
  background: #F3E8FF;
  color: #6B21A8;
  border: 1px solid #E9D5FF;
}
.badge-shadow {
  background: #FEF3C7;
  color: #92400E;
  border: 1px solid #FDE68A;
}
.badge-hit {
  background: #D1FAE5;
  color: #065F46;
  border: 1px solid #A7F3D0;
}
.badge-fail {
  background: #FEE2E2;
  color: #991B1B;
  border: 1px solid #FECACA;
}

.node-lore {
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 14px;
  font-size: 0.89rem;
  color: #374151;
}
.node-lore blockquote {
  margin: 0 0 8px 0;
  font-family: 'Merriweather', Georgia, serif;
  font-style: italic;
  color: #1F2937;
  font-size: 0.96rem;
  line-height: 1.6;
}
.node-lore cite {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #6B7280;
  font-style: normal;
  display: block;
  margin-top: 4px;
}

.probe-row {
  padding: 11px 0;
  border-bottom: 1px solid #F1F5F9;
}
.probe-row:last-child {
  border-bottom: none;
  padding-bottom: 2px;
}
.probe-top {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.probe-letter {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 0.75rem;
  padding: 2px 7px;
  border-radius: 5px;
  background: #1E293B;
  color: #FFFFFF;
  flex-shrink: 0;
}
.probe-letter.letter-a { background: #059669; } /* Emerald 600 */
.probe-letter.letter-b { background: #2563EB; } /* Blue 600 */
.probe-letter.letter-c { background: #CA8A04; color: #fff; } /* Yellow 600 */
.probe-letter.letter-d { background: #D97706; } /* Amber 600 */
.probe-kind {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #475569;
  font-weight: 700;
  flex-shrink: 0;
}
.probe-text {
  font-size: 0.94rem;
  color: var(--ink);
  font-weight: 500;
}

/* ABCD Scale Grid */
.scale-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.seg-group {
  display: grid;
  grid-template-columns: repeat(11, minmax(28px, 1fr));
  gap: 4px;
}
@media (max-width: 720px) {
  .seg-group {
    grid-template-columns: repeat(11, minmax(22px, 1fr));
    gap: 2px;
  }
}
.seg-btn {
  appearance: none;
  border: 1px solid #CBD5E1;
  background: #F8FAFC;
  color: #475569;
  padding: 6px 3px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 0.74rem;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s ease;
  line-height: 1.1;
}
.seg-btn[data-val="0"] {
  border-style: dashed;
  background: #F1F5F9;
}
.seg-btn .num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 0.8rem;
  display: block;
  color: #0F172A;
}
.seg-btn .lbl {
  font-size: 0.6rem;
  color: #64748B;
  display: block;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 780px) {
  .seg-btn .lbl { display: none; }
}
.seg-btn:hover {
  border-color: #475569;
  background: #F1F5F9;
}
.seg-btn.sel {
  background: #0F172A;
  border-color: #0F172A;
  border-style: solid;
  color: #FFFFFF;
  font-weight: 600;
}
.seg-btn.sel .num,
.seg-btn.sel .lbl { color: #FFFFFF; }

/* Unified Kanon Scale Colors: Red (-5 Extractive/Suppress) -> Slate (0 Selfish/Inaction) -> Emerald (+5 Greater Good/Create) */
.seg-btn.sel[data-val="-5"] { background: #991B1B; border-color: #991B1B; }
.seg-btn.sel[data-val="-4"] { background: #B91C1C; border-color: #B91C1C; }
.seg-btn.sel[data-val="-3"] { background: #DC2626; border-color: #DC2626; }
.seg-btn.sel[data-val="-2"] { background: #EA580C; border-color: #EA580C; }
.seg-btn.sel[data-val="-1"] { background: #D97706; border-color: #D97706; }
.seg-btn.sel[data-val="0"]  { background: #475569; border-color: #475569; }
.seg-btn.sel[data-val="1"]  { background: #10B981; border-color: #10B981; }
.seg-btn.sel[data-val="2"]  { background: #059669; border-color: #059669; }
.seg-btn.sel[data-val="3"]  { background: #047857; border-color: #047857; }
.seg-btn.sel[data-val="4"]  { background: #065F46; border-color: #065F46; }
.seg-btn.sel[data-val="5"]  { background: #064E3B; border-color: #064E3B; }

.seg-clear {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-muted);
  font-size: 0.74rem;
  cursor: pointer;
  padding: 4px 6px;
  font-family: 'JetBrains Mono', monospace;
}
.seg-clear:hover { color: var(--bad); }

/* Blocker tags row */
.blocker-chips-wrap {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
.blocker-chip-btn {
  appearance: none;
  border: 1px solid #CBD5E1;
  background: #F8FAFC;
  color: #475569;
  font-size: 0.73rem;
  padding: 3px 9px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.12s;
}
.blocker-chip-btn:hover {
  border-color: #D97706;
  color: #111827;
}
.blocker-chip-btn.active {
  background: #D97706;
  border-color: #D97706;
  color: #fff;
  font-weight: 600;
}

/* ---------- RESULTS JUMP BAR (SECTION TOC) ---------- */
.results-jump-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
  align-items: center;
  box-shadow: var(--shadow-sm);
}
.results-jump-bar a {
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--ink-soft);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-inset);
  font-weight: 600;
  transition: all 0.12s;
}
.results-jump-bar a:hover {
  background: #0e1235;
  color: #FFFFFF;
}

/* ---------- ARCHETYPE HERO (MATCHES AUSTRALIANMATRIX STOIC GUARDIAN BANNER) ---------- */
.archetype-hero {
  background: linear-gradient(135deg, #0e1235 0%, #0f172a 55%, #1e293b 100%);
  color: #F8FAFC;
  border-radius: 24px;
  padding: 32px 34px;
  margin-bottom: 24px;
  box-shadow: 0 20px 35px -10px rgba(14, 18, 53, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.archetype-hero-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 24px;
  align-items: center;
}
@media (max-width: 820px) {
  .archetype-hero-grid { grid-template-columns: 1fr; }
}
.archetype-badge {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(234, 179, 8, 0.2);
  color: #FACC15;
  border: 1px solid rgba(250, 204, 21, 0.45);
  font-weight: 700;
  margin-bottom: 10px;
}
.archetype-hero h2 {
  font-size: clamp(1.85rem, 3.4vw, 2.65rem);
  font-weight: 900;
  color: #FFFFFF;
  margin-bottom: 6px;
}
.archetype-sub {
  font-family: 'Merriweather', Georgia, serif;
  font-style: italic;
  color: #E2E8F0;
  font-size: 1.08rem;
  margin-bottom: 12px;
}
.archetype-desc {
  color: #CBD5E1;
  font-size: 0.95rem;
  line-height: 1.65;
  margin-bottom: 18px;
}
.archetype-stat-boxes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.arch-stat {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  padding: 13px 15px;
}
.arch-stat .num {
  font-family: 'Inter', sans-serif;
  font-size: 1.55rem;
  font-weight: 800;
  color: #FACC15;
  line-height: 1.1;
}
.arch-stat .lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  color: #94A3B8;
  margin-top: 4px;
}

/* ---------- NATIONAL SIGNATURE CARDS ---------- */
.signature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
@media (max-width: 860px) {
  .signature-grid { grid-template-columns: 1fr; }
}
.sig-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}
.sig-card.sig-strong {
  background: linear-gradient(180deg, #ECFDF5 0%, #FFFFFF 100%);
  border-color: #A7F3D0;
}
.sig-card.sig-tension {
  background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 100%);
  border-color: #FDE68A;
}
.sig-big {
  font-family: 'Inter', sans-serif;
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--ink);
}

/* ---------- CLOSENESS PIN TRACK (YOU VS THEM) ---------- */
.closeness-row {
  margin-bottom: 14px;
}
.closeness-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  margin-bottom: 6px;
}
.closeness-track {
  position: relative;
  height: 8px;
  background: var(--bg-inset);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  margin: 10px 10px 6px;
}
.closeness-pin {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.closeness-pin.pin-you {
  background: #059669;
  color: #fff;
  z-index: 2;
  border: 2px solid #fff;
}
.closeness-pin.pin-them {
  background: #CA8A04;
  color: #fff;
  z-index: 1;
  border: 2px solid #fff;
}

/* ---------- 7-PLANE SPLIT BARS ---------- */
.axes-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
}
.axes-row:last-child { border-bottom: none; }
.axes-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.axes-dual-track {
  display: grid;
  grid-template-columns: 120px 1fr 56px;
  gap: 10px;
  align-items: center;
  margin-bottom: 5px;
  font-size: 0.8rem;
}
.axes-bar-outer {
  height: 12px;
  background: var(--bg-inset);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--rule);
}
.axes-bar-inner {
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s ease;
}

/* ---------- BOOKS / READINGS GRID ---------- */
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.book-card {
  background: #F8FAFC;
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------- DASHBOARD / RESULTS ---------- */
.dash-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}
.keyring-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.keyring-stage svg {
  width: 100%;
  max-width: 500px;
  height: auto;
  overflow: visible;
}
.plane-stars-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.plane-star-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--plane-color, var(--accent));
  border-radius: var(--radius);
  padding: 16px;

<script>
/* =========================================================================
   THE AUSTRALIAN KANON ABCD SURVEY & DIAGNOSTIC ENGINE (7 · 49 · 354)
   ========================================================================= */

const DATA = window.KANON_SURVEY_DATA;
const PLANES = DATA.planes;
const SENSES = DATA.senses;
const VECTORS = DATA.vectors;
const ARCHETYPES = DATA.archetypes;
const FIGURES = DATA.figures;
const GLOSSARY = DATA.glossary || [];
const BOOKS = DATA.books || [];
const BLOCKER_TAGS = DATA.blockerTags;

// Index lookups for fast access
const PLANE_BY_N = {};
PLANES.forEach(p => { PLANE_BY_N[p.n] = p; });

const SENSES_BY_PLANE = {};
const SENSE_BY_ID = {};
SENSES.forEach(s => {
  SENSE_BY_ID[s.id] = s;
  if (!SENSES_BY_PLANE[s.plane]) SENSES_BY_PLANE[s.plane] = [];
  SENSES_BY_PLANE[s.plane].push(s);
});

const VECTORS_BY_PLANE = {};
const VECTORS_BY_SENSE = {};
const VECTOR_BY_UID = {};
VECTORS.forEach(v => {
  VECTOR_BY_UID[v.uid] = v;
  if (!VECTORS_BY_PLANE[v.plane]) VECTORS_BY_PLANE[v.plane] = [];
  VECTORS_BY_PLANE[v.plane].push(v);
  if (!VECTORS_BY_SENSE[v.senseId]) VECTORS_BY_SENSE[v.senseId] = [];
  VECTORS_BY_SENSE[v.senseId].push(v);
});

/* ---------- INLINE GLOSSARY ENGINE ---------- */
const GLOSSARY_BY_ID = {};
const GLOSSARY_PATTERNS = [];
GLOSSARY.forEach(entry => {
  GLOSSARY_BY_ID[entry.id] = entry;
  (entry.match || []).forEach(m => {
    if (m && m.length >= 3) {
      GLOSSARY_PATTERNS.push({ phrase: m, phraseLower: m.toLowerCase(), id: entry.id });
    }
  });
});
// Sort longest phrase first so "White Australia Policy" matches before "White Australia"
GLOSSARY_PATTERNS.sort((a, b) => b.phrase.length - a.phrase.length);

function escapeHtml(str) {
  return String(str || "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\*([^*]+)\*/g, "$1")
    .replace(/\*/g, "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isWordBoundaryChar(ch) {
  if (!ch) return true;
  return !/[A-Za-z0-9]/.test(ch);
}

// Finds non-overlapping glossary terms inside plain text and wraps them in <span class="glossary-term">
function renderGlossaryHTML(text, excludeName = "") {
  if (!text) return "";
  const lower = text.toLowerCase();
  const exLower = (excludeName || "").toLowerCase();
  const spans = [];
  const usedIds = new Set();

  for (const pat of GLOSSARY_PATTERNS) {
    if (usedIds.has(pat.id)) continue;
    // Don't underline the card's own title over and over inside its own prompt if we want to keep it clean, or allow first occurrence!
    let idx = lower.indexOf(pat.phraseLower);
    while (idx !== -1) {
      const end = idx + pat.phrase.length;
      const before = idx > 0 ? text[idx - 1] : "";
      const after = end < text.length ? text[end] : "";
      if (isWordBoundaryChar(before) && isWordBoundaryChar(after)) {
        // Check overlap with already claimed spans
        const overlaps = spans.some(s => !(end <= s.start || idx >= s.end));
        if (!overlaps) {
          spans.push({ start: idx, end, id: pat.id });
          usedIds.add(pat.id);
          break;
        }
      }
      idx = lower.indexOf(pat.phraseLower, idx + 1);
    }
  }

  if (spans.length === 0) return escapeHtml(text);
  spans.sort((a, b) => a.start - b.start);

  let out = "";
  let cursor = 0;
  for (const sp of spans) {
    if (sp.start > cursor) {
      out += escapeHtml(text.slice(cursor, sp.start));
    }
    const surface = escapeHtml(text.slice(sp.start, sp.end));
    out += `<span class="glossary-term" role="button" tabindex="0" data-glossary-id="${sp.id}">${surface}</span>`;
    cursor = sp.end;
  }
  if (cursor < text.length) {
    out += escapeHtml(text.slice(cursor));
  }
  return out;
}

// Global floating tooltip controller for .glossary-term and [data-badge-tip]
let activeTooltipEl = null;
let tooltipCloseTimer = null;

function hideFloatingTooltip() {
  if (activeTooltipEl) {
    activeTooltipEl.remove();
    activeTooltipEl = null;
  }
  document.querySelectorAll(".glossary-term.is-active").forEach(el => el.classList.remove("is-active"));
}

function showFloatingTooltip(anchorEl, title, body) {
  clearTimeout(tooltipCloseTimer);
  hideFloatingTooltip();
  anchorEl.classList.add("is-active");

  const tip = document.createElement("div");
  tip.className = "glossary-tooltip";
  tip.setAttribute("role", "tooltip");
  tip.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(body)}</span>`;
  document.body.appendChild(tip);
  activeTooltipEl = tip;

  const rect = anchorEl.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  let top = rect.bottom + 8;
  if (top + tipRect.height > window.innerHeight - 12) {
    top = Math.max(12, rect.top - tipRect.height - 8);
  }
  let left = Math.max(12, Math.min(rect.left, window.innerWidth - tipRect.width - 12));
  tip.style.top = `${top}px`;
  tip.style.left = `${left}px`;
}

function setupGlobalTooltips() {
  document.addEventListener("mouseover", (e) => {
    const gEl = e.target.closest("[data-glossary-id]");
    if (gEl) {
      const entry = GLOSSARY_BY_ID[gEl.getAttribute("data-glossary-id")];
      if (entry) showFloatingTooltip(gEl, entry.term, entry.definition);
      return;
    }
    const bEl = e.target.closest("[data-badge-tip]");
    if (bEl) {
      showFloatingTooltip(bEl, bEl.getAttribute("data-badge-title") || "Kanon Metric", bEl.getAttribute("data-badge-tip"));
    }
  });

  document.addEventListener("mouseout", (e) => {
    const gEl = e.target.closest("[data-glossary-id], [data-badge-tip]");
    if (gEl) {
      tooltipCloseTimer = setTimeout(hideFloatingTooltip, 140);
    }
  });

  document.addEventListener("focusin", (e) => {
    const gEl = e.target.closest("[data-glossary-id]");
    if (gEl) {
      const entry = GLOSSARY_BY_ID[gEl.getAttribute("data-glossary-id")];
      if (entry) showFloatingTooltip(gEl, entry.term, entry.definition);
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      hideFloatingTooltip();
      closeInfoSheet();
    }
  });
}

/* ---------- (?) INFO SHEET MODAL CONTROLLER ---------- */
function openNodeInfoSheet(prefix, id) {
  let item = null;
  let hue = "var(--accent)";
  let headerLabel = "";

  if (prefix === "P") {
    item = PLANE_BY_N[Number(id)];
    if (item) {
      hue = item.hue;
      headerLabel = `Pillar ${item.n} · ${item.pillar}`;
    }
  } else if (prefix === "S") {
    item = SENSE_BY_ID[id];
    if (item) {
      const p = PLANE_BY_N[item.plane];
      hue = p.hue;
      headerLabel = `Theme ${item.id} · Pillar ${p.n}: ${p.name}`;
    }
  } else if (prefix === "V") {
    item = VECTOR_BY_UID[id];
    if (item) {
      const p = PLANE_BY_N[item.plane];
      hue = p.hue;
      headerLabel = `Topic ${item.uid} · Pillar ${p.n}: ${p.name}`;
    }
  }

  if (!item) return;
  const h = item.help || {};
  const title = item.name || item.title;
  const mainBody = item.description || item.narrative || item.totality || h.note || "";

  const portal = document.getElementById("portal-root");
  if (!portal) return;

  portal.innerHTML = `
    <div class="info-sheet-backdrop" id="info-sheet-backdrop">
      <div class="info-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="--sheet-accent:${hue}">
        <button type="button" class="info-sheet-close" id="info-sheet-close" aria-label="Close">×</button>
        <div class="eyebrow" style="color:${hue}">${escapeHtml(headerLabel)}</div>
        <h3 id="sheet-title" style="font-size:1.4rem;margin:4px 36px 8px 0;">${escapeHtml(title)}</h3>
        ${item.quote ? `
          <div class="plane-quote-box" style="margin-bottom:12px;">
            "${escapeHtml(item.quote)}"
            <cite>— ${escapeHtml(item.attribution || "")}${item.source ? ` (${escapeHtml(item.source)})` : ""}</cite>
          </div>
        ` : ""}
        <div style="font-size:0.95rem;line-height:1.65;color:var(--ink);">
          ${renderGlossaryHTML(mainBody)}
        </div>
        ${item.coreMeaning ? `
          <div class="callout" style="margin-top:12px;font-size:0.88rem;">
            <strong>What This Means in Practice:</strong><br/>
            ${escapeHtml(item.coreMeaning)}
          </div>
        ` : ""}
        ${item.practicalText ? `
          <div class="callout" style="margin-top:12px;font-size:0.88rem;">
            <strong>In Everyday Life:</strong><br/>
            ${escapeHtml(item.practicalText)}
          </div>
        ` : ""}
      </div>
    </div>
  `;

  document.getElementById("info-sheet-close")?.addEventListener("click", closeInfoSheet);
  document.getElementById("info-sheet-backdrop")?.addEventListener("click", (e) => {
    if (e.target.id === "info-sheet-backdrop") closeInfoSheet();
  });
}

function openComparisonSheet(targetType, targetId) {
  const profile = computeKanonProfile();
  const list = targetType === "archetype" ? ARCHETYPES : FIGURES;
  const target = list.find(x => (x.id || x.name) === targetId);
  if (!target) return;

  const userPlanes = profile.planeSummaries.map(s => s.total !== null ? Math.round(((s.total + 5) / 10) * 100) : 50);
  const targetPlanes = (target.pillars || [0.5,0.5,0.5,0.5,0.5,0.5,0.5]).map(v => Math.round(v * 100));

  const rows = PLANES.map((p, i) => ({
    plane: p,
    userPct: userPlanes[i],
    targetPct: targetPlanes[i],
    diff: Math.abs(userPlanes[i] - targetPlanes[i])
  }));

  const closest = [...rows].sort((a, b) => a.diff - b.diff).slice(0, 3);
  const furthest = [...rows].sort((a, b) => b.diff - a.diff).slice(0, 2);

  const portal = document.getElementById("portal-root");
  if (!portal) return;

  portal.innerHTML = `
    <div class="info-sheet-backdrop" id="info-sheet-backdrop">
      <div class="info-sheet" role="dialog" aria-modal="true" style="--sheet-accent:${target.color || "var(--accent)"}">
        <button type="button" class="info-sheet-close" id="info-sheet-close" aria-label="Close">×</button>
        <div class="eyebrow">${targetType === "archetype" ? "Australian Archetype Comparison" : "Historical & Audited Figure Comparison"}</div>
        <h3 style="font-size:1.4rem;margin:4px 36px 4px 0;">You vs. ${escapeHtml(target.name)}</h3>
        <div class="mono" style="font-size:0.78rem;color:var(--ink-muted);margin-bottom:10px;">
          ${escapeHtml(target.subtitle || target.role || "")} · Coords (υ=${target.coords.v >= 0 ? "+" : ""}${target.coords.v}, ψ=${target.coords.psi >= 0 ? "+" : ""}${target.coords.psi})
        </div>
        <p style="font-size:0.88rem;color:var(--ink-soft);margin:0 0 14px;">${escapeHtml(target.desc)}</p>

        <div class="mono" style="font-size:0.74rem;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;">
          What Pulls You Closest Together (Top 3 Planes)
        </div>
        ${closest.map(r => `
          <div class="closeness-row">
            <div class="closeness-head">
              <strong>P${r.plane.n} · ${r.plane.name} (${r.plane.pillar})</strong>
              <span class="mono">You: ${r.userPct}% · Them: ${r.targetPct}%</span>
            </div>
            <div class="closeness-track">
              <span class="closeness-pin pin-them" style="left:${r.targetPct}%" title="${escapeHtml(target.name)}: ${r.targetPct}%">T</span>
              <span class="closeness-pin pin-you" style="left:${r.userPct}%" title="You: ${r.userPct}%">Y</span>
            </div>
          </div>
        `).join("")}

        <div class="mono" style="font-size:0.74rem;text-transform:uppercase;color:var(--accent-warm);font-weight:700;margin:14px 0 8px;">
          Where You Diverge Most
        </div>
        ${furthest.map(r => `
          <div class="closeness-row">

        tier: (parsed.tier === 353 ? 354 : (parsed.tier || 49)), // 7, 49, or 354

      };

let STATE = loadState();

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
  updateHeaderProgress();
}

function ansKey(prefix, id, probe) { return `${prefix}|${id}|${probe}`; }
function getAns(prefix, id, probe) { return STATE.answers[ansKey(prefix, id, probe)] ?? null; }
function setAns(prefix, id, probe, val) {
  const k = ansKey(prefix, id, probe);
  if (val === null || val === undefined) delete STATE.answers[k];
  else STATE.answers[k] = Number(val);
  saveState();
}

function getBlockers(prefix, id) {
  return STATE.blockers[`${prefix}|${id}`] || [];
}
function toggleBlocker(prefix, id, tag) {
  const k = `${prefix}|${id}`;
  const arr = (STATE.blockers[k] || []).slice();
  const idx = arr.indexOf(tag);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(tag);
  if (arr.length === 0) delete STATE.blockers[k];
  else STATE.blockers[k] = arr;
  saveState();
}

function activeTierVectors(planeNum = null) {
  return planeNum ? (VECTORS_BY_PLANE[planeNum] || []) : VECTORS;
}

function isNodeAnswered(prefix, id) {
  return (
    getAns(prefix, id, "A") !== null ||
    getAns(prefix, id, "B") !== null ||
    getAns(prefix, id, "C") !== null
  );
}

/* ---------- HIERARCHICAL SCORE ENGINE (7 <-> 49 <-> 354) ---------- */
function avgNums(arr) {
  const v = arr.filter(x => x !== null && x !== undefined && !Number.isNaN(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function getSenseMultiTierProbe(senseId, probe) {
  const s = SENSE_BY_ID[senseId];
  if (!s) return { tier1: null, tier2: null, tier3: null, effective: null };
  const t1 = getAns("P", s.plane, probe);
  const t2 = getAns("S", senseId, probe);
  const vecs = (VECTORS_BY_SENSE[senseId] || []);
  const t3 = avgNums(vecs.map(v => getAns("V", v.uid, probe)));

  let effective = null;
  if (STATE.tier === 7) effective = t1 ?? t2 ?? t3;
  else if (STATE.tier === 49) effective = t2 ?? t3 ?? t1;
  else effective = t3 ?? t2 ?? t1;

  return { tier1: t1, tier2: t2, tier3: t3, effective };
}

function computeSenseSummary(senseId) {
  const mA = getSenseMultiTierProbe(senseId, "A");
  const mB = getSenseMultiTierProbe(senseId, "B");
  const mC = getSenseMultiTierProbe(senseId, "C");

  const A = mA.effective; // Personal Ideal ("Should")
  const B = mB.effective; // Personal Actual ("Would")
  const C = mC.effective; // Australian Society ("Systemic Reality")

  const total = avgNums([A, B, C]);
  const personalMean = avgNums([A, B]);
  const gapAB = (A !== null && B !== null) ? (A - B) : null; // Personal Should-Would Gap
  const gapAC = (A !== null && C !== null) ? (A - C) : null; // Social Contradiction Gap (Should A vs Society C)
  return { A, B, C, D: C, total, personalMean, gapAB, gapAC, gapAD: gapAC, multiA: mA, multiB: mB };
}

function computePlaneSummary(pNum) {
  const plane = PLANE_BY_N[pNum];
  const senses = SENSES_BY_PLANE[pNum] || [];
  const senseScores = senses.map(s => ({ sense: s, ...computeSenseSummary(s.id) }));

  const A = avgNums(senseScores.map(x => x.A));
  const B = avgNums(senseScores.map(x => x.B));
  const C = avgNums(senseScores.map(x => x.C));
  const D = C;
  const total = avgNums(senseScores.map(x => x.total));

  let totalNodes = 1;
  let answeredNodes = 0;
  if (STATE.tier === 7) {
    totalNodes = 1;
    answeredNodes = isNodeAnswered("P", pNum) ? 1 : (total !== null ? 1 : 0);
  } else if (STATE.tier === 49) {
    totalNodes = senses.length;
    answeredNodes = senses.filter(s => isNodeAnswered("S", s.id) || computeSenseSummary(s.id).total !== null).length;
  } else {
    const vecs = activeTierVectors(pNum);
    totalNodes = vecs.length;
    answeredNodes = vecs.filter(v => isNodeAnswered("V", v.uid)).length;
  }

  return {
    plane,
    senses: senseScores,
    A, B, C, D, total,
    answeredNodes,
    totalNodes
  };
}

function computeGlobalProgress() {
  if (STATE.tier === 7) {
    const done = PLANES.filter(p => isNodeAnswered("P", p.n)).length;
    return { done, total: 7, pct: Math.round((done / 7) * 100) };
  } else if (STATE.tier === 49) {
    const done = SENSES.filter(s => isNodeAnswered("S", s.id)).length;
    return { done, total: 49, pct: Math.round((done / 49) * 100) };
  } else {
    const vecs = activeTierVectors();
    const done = vecs.filter(v => isNodeAnswered("V", v.uid)).length;
    return { done, total: vecs.length, pct: Math.round((done / vecs.length) * 100) };
  }
}

/* ---------- ARCHETYPE, HEGEMONY (v, psi) & AUDIT ENGINE ---------- */
function computeKanonProfile() {
  const planeSummaries = PLANES.map(p => computePlaneSummary(p.n));
  const answeredPlanes = planeSummaries.filter(p => p.total !== null);

  // Normalize [-5, +5] -> [0, 1] via (val + 5) / 10
  // Use personal Should/Would mean (or overall total) for personal archetype matching
  const planeNormTotal = planeSummaries.map(p => {
    const pm = avgNums([p.A, p.B, p.C]);
    const ref = pm !== null ? pm : p.total;
    return ref !== null ? (ref + 5) / 10 : 0.5;
  });

  const avgA = avgNums(planeSummaries.map(p => p.A));
  const avgB = avgNums(planeSummaries.map(p => p.B));
  const avgC = avgNums(planeSummaries.map(p => p.C));
  const avgD = avgC;
  const avgTot = avgNums(planeSummaries.map(p => p.total));

  const avgPersonal = avgNums([avgA, avgB]);
  const personalAlignmentPct = avgPersonal !== null ? Math.round(((avgPersonal + 5) / 10) * 100) : null;
  const alignmentPct = avgTot !== null ? Math.round(((avgTot + 5) / 10) * 100) : null;
  const ethosPct = avgA !== null ? Math.round(((avgA + 5) / 10) * 100) : null;
  const livedPct = avgB !== null ? Math.round(((avgB + 5) / 10) * 100) : null;
  const societyPct = avgC !== null ? Math.round(((avgC + 5) / 10) * 100) : null;
  const communityPct = societyPct;

  let sumWA = 0, vA = 0, psiA = 0;
  let sumWB = 0, vB = 0, psiB = 0;

  let hitCount = 0, failCount = 0, neutralCount = 0, totalEvaluated = 0;
  let hansonAgree = 0, hansonCompared = 0;
  let alboAgree = 0, alboCompared = 0;

  const vecList = activeTierVectors();
  vecList.forEach(vec => {
    let a = getAns("V", vec.uid, "A");
    let b = getAns("V", vec.uid, "B");
    if (a === null && STATE.tier === 49) a = getAns("S", vec.senseId, "A");
    if (b === null && STATE.tier === 49) b = getAns("S", vec.senseId, "B");
    if (a === null && STATE.tier === 7) a = getAns("P", vec.plane, "A");
    if (b === null && STATE.tier === 7) b = getAns("P", vec.plane, "B");

    const nodeScore = avgNums([a, b]);
    if (nodeScore !== null) {
      totalEvaluated++;
      let userVerdict = "NEUTRAL";
      if (nodeScore >= 1.0) { hitCount++; userVerdict = "HIT"; }
      else if (nodeScore <= -1.0) { failCount++; userVerdict = "FAIL"; }
      else { neutralCount++; }

      if (userVerdict !== "NEUTRAL") {
        if (vec.hansonVerdict) {
          hansonCompared++;
          if (vec.hansonVerdict === userVerdict) hansonAgree++;
        }
        if (vec.alboVerdict) {
          alboCompared++;
          if (vec.alboVerdict === userVerdict) alboAgree++;
        }
      }
    }

    const targetV = vec.coords.v < 0 ? Math.abs(vec.coords.v) : vec.coords.v;
    const targetPsi = vec.coords.v < 0 ? -vec.coords.psi : vec.coords.psi;

    if (a !== null) {
      const polA = a / 5;
      vA += polA * targetV;
      psiA += polA * targetPsi;
      sumWA += 1;
    }
    if (b !== null) {
      const polB = b / 5;
      vB += polB * targetV;
      psiB += polB * targetPsi;
      sumWB += 1;
    }
  });

  const coordsA = sumWA > 0 ? { v: +(vA / sumWA * 1.35).toFixed(2), psi: +(psiA / sumWA * 1.35).toFixed(2) } : { v: 0, psi: 0 };
  const coordsB = sumWB > 0 ? { v: +(vB / sumWB * 1.35).toFixed(2), psi: +(psiB / sumWB * 1.35).toFixed(2) } : coordsA;

  // Personal Should-Would gap (ΔH_personal) & Social Contradiction gap (Should A - Society D)
  const personalGap = (avgA !== null && avgB !== null) ? Math.abs(avgA - avgB) : 0;
  const socialGap = (avgA !== null && avgC !== null) ? (avgA - avgC) : ((avgA !== null && avgB !== null) ? (avgA - avgB) : 0);
  const stressGap = Math.max(socialGap, (avgA !== null && avgB !== null) ? (avgA - avgB) : 0);

  const archetypeMatches = ARCHETYPES.map(arch => {
    let sqDist = 0;
    for (let i = 0; i < 7; i++) {
      const w = (arch.pillars || arch.weights)[i];
      const diff = planeNormTotal[i] - w;
      sqDist += diff * diff;
    }
    let rms = Math.sqrt(sqDist / 7);
    let sim = Math.max(0, 1 - rms * 1.15);

    if (arch.id === "betrayed_battler" && stressGap >= 1.5) {
      sim = Math.min(0.99, sim + Math.min(0.28, stressGap * 0.045));
    }
    if (arch.id === "stoic_guardian" && avgTot !== null && avgTot >= 2.5 && stressGap < 1.8) {
      sim = Math.min(0.99, sim + 0.12);
    }

    return {
      ...arch,
      matchPct: Math.round(sim * 100)
    };
  }).sort((a, b) => b.matchPct - a.matchPct);

  const userOverallCoords = {
    v: +((coordsA.v * 0.55 + coordsB.v * 0.45)).toFixed(2),
    psi: +((coordsA.psi * 0.55 + coordsB.psi * 0.45)).toFixed(2)
  };
  const refAlignForFigures = personalAlignmentPct ?? alignmentPct;
  const figureMatches = FIGURES.map(fig => {
    const dv = userOverallCoords.v - fig.coords.v;
    const dpsi = userOverallCoords.psi - fig.coords.psi;
    const coordDist = Math.sqrt(dv * dv + dpsi * dpsi);
    const alignDiff = refAlignForFigures !== null ? Math.abs(refAlignForFigures - fig.alignment) / 100 : 0.3;
    let match = Math.max(5, Math.round((1 - (coordDist * 0.38 + alignDiff * 0.45)) * 100));

    if (fig.name.includes("Pauline Hanson") && hansonCompared > 0) {
      match = Math.round((hansonAgree / hansonCompared) * 100);
    } else if (fig.name.includes("Anthony Albanese") && alboCompared > 0) {
      match = Math.round((alboAgree / alboCompared) * 100);
    }
    return { ...fig, matchPct: Math.min(99, Math.max(4, match)) };
  }).sort((a, b) => b.matchPct - a.matchPct);

  const blockerCounts = {};
  Object.values(STATE.blockers).forEach(arr => {
    (arr || []).forEach(tag => {
      blockerCounts[tag] = (blockerCounts[tag] || 0) + 1;
    });
  });
  const topBlockers = Object.entries(blockerCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([tag, count]) => ({ tag, count }));

  return {
    planeSummaries,
    answeredPlanes,
    avgA, avgB, avgC, avgD, avgTot,
    personalGap, socialGap,
    personalAlignmentPct, alignmentPct, ethosPct, livedPct, communityPct, societyPct,
    coordsA, coordsB, userOverallCoords,
    hitCount, failCount, neutralCount, totalEvaluated,
    netAlignmentPct: totalEvaluated > 0 ? +(((hitCount - failCount) / totalEvaluated) * 100).toFixed(1) : 0,
    hansonAgree, hansonCompared,
    alboAgree, alboCompared,
    archetypeMatches,
    figureMatches,
    topBlockers
  };
}

/* ---------- DEMO PRESET PROFILES ---------- */
function loadPresetProfile(presetId) {
  STATE.answers = {};
  STATE.blockers = {};

  if (presetId === "stoic_guardian") {
    PLANES.forEach(p => {
      setAns("P", p.n, "A", 5); setAns("P", p.n, "B", 4); setAns("P", p.n, "C", 3);
    });
    SENSES.forEach((s, idx) => {
      setAns("S", s.id, "A", idx % 3 === 0 ? 5 : 4);
      setAns("S", s.id, "B", idx % 4 === 0 ? 5 : 4);
      setAns("S", s.id, "C", 3);
    });
  } else if (presetId === "betrayed_battler") {
    const demoBlockers = ["Cost of Living / Priced Out", "Corporate / Political Capture", "Broken Trust / Burned Before"];
    PLANES.forEach(p => {
      setAns("P", p.n, "A", 5);
      setAns("P", p.n, "B", 4);
      setAns("P", p.n, "C", p.n === 2 || p.n === 3 || p.n === 7 ? -3 : -2);
      STATE.blockers[`P|${p.n}`] = [demoBlockers[p.n % demoBlockers.length]];
    });
    SENSES.forEach((s, idx) => {
      setAns("S", s.id, "A", idx % 2 === 0 ? 5 : 4);
      setAns("S", s.id, "B", idx % 3 === 0 ? 4 : 3);
      setAns("S", s.id, "C", (s.plane === 2 || s.plane === 3 || idx % 3 === 0) ? -3 : -2);
      STATE.blockers[`S|${s.id}`] = [demoBlockers[idx % demoBlockers.length]];
    });
  } else if (presetId === "hanson_354") {
    STATE.tier = 354;
    VECTORS.forEach(v => {
      const val = v.hansonVerdict === "HIT" ? 4 : -3;
      STATE.answers[ansKey("V", v.uid, "A")] = val;
      STATE.answers[ansKey("V", v.uid, "B")] = val;
      STATE.answers[ansKey("V", v.uid, "C")] = v.hansonVerdict === "FAIL" ? -3 : 2;
    });
  }
  saveState();
  render();
}

/* =========================================================================
   KEYRING PLOT SVG GENERATOR: BIPOLAR LAYERED GEOMETRY (−5 .. 0 .. +5)
   =========================================================================
   Shaft = 0 Axis (Neutral).
   Right deflection (+1..+5) = Positive / Support / Thriving (Plane Hue).
   Left deflection (-1..-5) = Negative / Opposed / Broken / Betrayal (#DC2626 Crimson).
   Layers along the blade = Perspectives A (Should), B (Personal Would), C (Circle), D (Society).
   ========================================================================= */

function subKeyringSlots(senseId) {
  const sense = SENSE_BY_ID[senseId];
  if (!sense) {
    return {
      A: null, B: null, C: null, D: null,
      layers: [
        { id: "A", label: "Should", v: null },
        { id: "B", label: "Personal", v: null },
        { id: "C", label: "Society", v: null }
      ],
      answered: []
    };
  }

  const pA = getAns("P", sense.plane, "A");
  const pB = getAns("P", sense.plane, "B");
  const pC = getAns("P", sense.plane, "C");

  const sA = getAns("S", senseId, "A");
  const sB = getAns("S", senseId, "B");
  const sC = getAns("S", senseId, "C");

  const vecs = (VECTORS_BY_SENSE[senseId] || []);
  const vA = avgNums(vecs.map(v => getAns("V", v.uid, "A")));
  const vB = avgNums(vecs.map(v => getAns("V", v.uid, "B")));
  const vC = avgNums(vecs.map(v => getAns("V", v.uid, "C")));

  const effA = vA ?? sA ?? pA;
  const effB = vB ?? sB ?? pB ?? effA;
  const effC = vC ?? sC ?? pC ?? effB;

  const layers = [
    { id: "A", label: "Should", v: effA },
    { id: "B", label: "Personal", v: effB },
    { id: "C", label: "Society", v: effC }
  ];

  const answered = layers.filter(l => l.v !== null);
  return { A: effA, B: effB, C: effC, D: effC, layers, answered };
}

// Draw a single bipolar layered arm for a Sense (Tier 2 / Tier 3 Star)
function armSVG(cx, cy, angleDeg, armLen, hue, subId, labelSize, showScale) {
  const ang = angleDeg * Math.PI / 180;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx; // Perpendicular vector (points to the right side of the blade)
  const { layers, answered } = subKeyringSlots(subId);
  const parts = [];
  const tipX = cx + dx * armLen, tipY = cy + dy * armLen;
  const maxTlen = 16; // Maximum deflection for +-5

  if (!answered.length) {
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1.2" opacity="0.3"/>`);
  } else {
    // Centerline shaft (0 axis)
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="${hue}" stroke-width="3" stroke-linecap="round"/>`);
    // 3 Layered slots along the blade: A (0.65), B (0.80), C (0.95)
    const slotFracs = [0.65, 0.80, 0.95];
    layers.forEach((layer, i) => {
      const v = layer.v;
      const frac = slotFracs[i];
      const bx = cx + dx * armLen * frac, by = cy + dy * armLen * frac;
      if (v === null || v === undefined) {
        parts.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="1.5" fill="var(--ink-soft)" opacity="0.4"/>`);
        return;
      }
      if (v === 0) {
        parts.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="2.2" fill="#64748B"/>`);
        return;
      }
      const isPos = v > 0;
      const norm = Math.min(1, Math.abs(v) / 5);
      const tlen = 3 + norm * maxTlen;
      const sgn = isPos ? 1 : -1; // +1 right (Plane Hue), -1 left (Crimson #DC2626)
      const toothHue = isPos ? hue : "#DC2626";
      const ex = bx + px * tlen * sgn, ey = by + py * tlen * sgn;
      parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${toothHue}" stroke-width="3.2" stroke-linecap="round"/>`);
    });
  }

  if (showScale) {
    const fw = maxTlen + 4;
    const bx0 = cx + dx * armLen * 0.60, by0 = cy + dy * armLen * 0.60;
    const bx1 = tipX, by1 = tipY;
    const pLeft0 = { x: bx0 - px * fw, y: by0 - py * fw };
    const pRight0 = { x: bx0 + px * fw, y: by0 + py * fw };
    const pLeft1 = { x: bx1 - px * fw, y: by1 - py * fw };
    const pRight1 = { x: bx1 + px * fw, y: by1 + py * fw };

    // U-bracket framing [-5, +5] around shaft (0)
    parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.7" opacity="0.25"/>`);
    parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pLeft1.x.toFixed(1)},${pLeft1.y.toFixed(1)}" stroke="#DC2626" stroke-width="0.7" opacity="0.35"/>`);
    parts.push(`<polyline points="${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)} ${pRight1.x.toFixed(1)},${pRight1.y.toFixed(1)}" stroke="${hue}" stroke-width="0.7" opacity="0.35"/>`);

    if (Math.abs(angleDeg - (-90)) < 1) { // Top arm gets explicit scale callouts
      parts.push(`<text x="${(pLeft1.x - px * 3).toFixed(1)}" y="${(pLeft1.y - py * 3).toFixed(1)}" font-size="7.5" fill="#DC2626" opacity="0.7" text-anchor="middle" font-family="'JetBrains Mono', monospace">−5</text>`);
      parts.push(`<text x="${bx1.toFixed(1)}" y="${(by1 - py * 3).toFixed(1)}" font-size="7" fill="var(--ink-soft)" opacity="0.6" text-anchor="middle" font-family="'JetBrains Mono', monospace">0</text>`);
      parts.push(`<text x="${(pRight1.x + px * 3).toFixed(1)}" y="${(pRight1.y + py * 3).toFixed(1)}" font-size="7.5" fill="${hue}" opacity="0.7" text-anchor="middle" font-family="'JetBrains Mono', monospace">+5</text>`);
    }
  }

  if (labelSize) {
    const lx = cx + dx * (armLen + labelSize + 6), ly = cy + dy * (armLen + labelSize + 6);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${labelSize}" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">${escapeHtml(subId)}</text>`);
  }
  return parts.join("");
}

function planeStarSVG(pNum, maxWidth = 200) {
  const p = PLANE_BY_N[pNum];
  const senses = SENSES_BY_PLANE[pNum] || [];
  const cx = 100, cy = 100, armLen = 76;
  const hue = p.hue;
  const parts = senses.map((s, i) => armSVG(cx, cy, -90 + i * (360 / 7), armLen, hue, s.id, 8.5, true));
  return `<svg viewBox="0 0 200 200" style="max-width:${maxWidth}px;display:block;margin:0 auto" role="img" aria-label="${escapeHtml(p.name)} diagnostic star">
    <circle cx="${cx}" cy="${cy}" r="3" fill="${hue}"/>
    ${parts.join("")}
  </svg>`;
}

/* ---------- TIER 2: 49 SENSES OVERLAID KEYRING STAR (7 ARMS X 7 PLANE RINGS) ---------- */
function combinedArmSVG(cx, cy, angleDeg, armLen, i) {
  const ang = angleDeg * Math.PI / 180;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx; // Perpendicular: +right, -left
  const parts = [];
  const tipX = cx + dx * armLen, tipY = cy + dy * armLen;

  // Shaft (0 axis)
  parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1.2" opacity="0.35"/>`);

  const maxTlen = 24;
  const zoneStart = 0.45, zoneEnd = 0.98;
  const ringW = (zoneEnd - zoneStart) / 7;

  // 7 nested Plane rings from outer (Plane 1) to inner (Plane 7)
  PLANES.forEach((p, pi) => {
    const senseId = `${p.n}.${i + 1}`;
    const { layers } = subKeyringSlots(senseId);
    const ringStart = zoneEnd - (pi + 1) * ringW;
    // 3 layered teeth per ring: Should (A), Personal (B), Society (C)
    const slotFracs = [ringStart + ringW * 0.22, ringStart + ringW * 0.55, ringStart + ringW * 0.85];
    const pickedLayers = [layers[0], layers[1], layers[2]]; // A, B, C

    pickedLayers.forEach((layer, k) => {
      const v = layer.v;
      if (v === null || v === undefined) return;
      const frac = slotFracs[k];
      const bx = cx + dx * armLen * frac, by = cy + dy * armLen * frac;
      if (v === 0) {
        parts.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="1.8" fill="#64748B"/>`);
        return;
      }
      const isPos = v > 0;
      const norm = Math.min(1, Math.abs(v) / 5);
      const tlen = 3 + norm * maxTlen;
      const sgn = isPos ? 1 : -1; // +1 right in Plane Hue, -1 left in Crimson #DC2626
      const toothHue = isPos ? p.hue : "#DC2626";
      const ex = bx + px * tlen * sgn, ey = by + py * tlen * sgn;
      parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${toothHue}" stroke-width="2.6" stroke-linecap="round"/>`);
    });
  });

  // Bipolar scale bracket framing the entire 7-plane zone
  const fw = maxTlen + 4;
  const bx0 = cx + dx * armLen * zoneStart, by0 = cy + dy * armLen * zoneStart;
  const bx1 = tipX, by1 = tipY;
  const pLeft0 = { x: bx0 - px * fw, y: by0 - py * fw };
  const pRight0 = { x: bx0 + px * fw, y: by0 + py * fw };
  const pLeft1 = { x: bx1 - px * fw, y: by1 - py * fw };
  const pRight1 = { x: bx1 + px * fw, y: by1 + py * fw };

  parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.25"/>`);
  parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pLeft1.x.toFixed(1)},${pLeft1.y.toFixed(1)}" stroke="#DC2626" stroke-width="0.8" opacity="0.35"/>`);
  parts.push(`<polyline points="${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)} ${pRight1.x.toFixed(1)},${pRight1.y.toFixed(1)}" stroke="var(--accent)" stroke-width="0.8" opacity="0.35"/>`);

  if (i === 0) { // Q1 arm gets scale callouts
    parts.push(`<text x="${(pLeft1.x - px * 4).toFixed(1)}" y="${(pLeft1.y - py * 4).toFixed(1)}" font-size="8" fill="#DC2626" opacity="0.75" text-anchor="middle" font-family="'JetBrains Mono', monospace">−5</text>`);
    parts.push(`<text x="${bx1.toFixed(1)}" y="${(by1 - py * 4).toFixed(1)}" font-size="7.5" fill="var(--ink-soft)" opacity="0.6" text-anchor="middle" font-family="'JetBrains Mono', monospace">0</text>`);
    parts.push(`<text x="${(pRight1.x + px * 4).toFixed(1)}" y="${(pRight1.y + py * 4).toFixed(1)}" font-size="8" fill="var(--accent)" opacity="0.75" text-anchor="middle" font-family="'JetBrains Mono', monospace">+5</text>`);
  }

  const S_NAMES = [".1 Who", ".2 What", ".3 Where", ".4 Why", ".5 How", ".6 Cause", ".7 Effect"];
  const lx = cx + dx * (armLen + 18), ly = cy + dy * (armLen + 18);
  parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9" font-weight="600" fill="var(--ink)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">Q${i + 1} (${S_NAMES[i]})</text>`);
  return parts.join("");
}

/* ---------- TIER 1 KEYRING: 7 PILLARS MASTER KEY (1 ARM PER PLANE, 4 BIPOLAR LAYERS) ---------- */
function pillarArmSVG(cx, cy, angleDeg, armLen, pNum) {
  const p = PLANE_BY_N[pNum];
  const sum = computePlaneSummary(pNum);
  const ang = angleDeg * Math.PI / 180;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx; // Perpendicular: +1 right, -1 left
  const parts = [];
  const tipX = cx + dx * armLen, tipY = cy + dy * armLen;

  const hasAns = isNodeAnswered("P", pNum) || sum.total !== null;
  const shaftColor = hasAns ? p.hue : "var(--ink-soft)";
  const shaftWidth = hasAns ? 4.5 : 1.5;
  const shaftOpacity = hasAns ? 1 : 0.25;

  // Centerline shaft (0 Axis)
  parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="${shaftColor}" stroke-width="${shaftWidth}" opacity="${shaftOpacity}" stroke-linecap="round"/>`);

  const maxTlen = 26; // Maximum deflection for +-5
  // 3 Horizon Layers along the blade:
  const layers = [
    { tag: "A", name: "Should (A)", frac: 0.65, v: sum.A },
    { tag: "B", name: "Personal (B)", frac: 0.80, v: sum.B },
    { tag: "C", name: "Society (C)", frac: 0.95, v: sum.C }
  ];

  if (hasAns) {
    layers.forEach(layer => {
      const v = layer.v;
      const bx = cx + dx * armLen * layer.frac, by = cy + dy * armLen * layer.frac;
      if (v === null || v === undefined) {
        parts.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="2" fill="var(--ink-soft)" opacity="0.4"/>`);
        return;
      }
      if (v === 0) {
        parts.push(`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="2.8" fill="#64748B"/>`);
        return;
      }
      const isPos = v > 0;
      const norm = Math.min(1, Math.abs(v) / 5);
      const tlen = 4 + norm * maxTlen;
      const sgn = isPos ? 1 : -1; // +1 right in Plane Hue, -1 left in Crimson #DC2626
      const toothHue = isPos ? p.hue : "#DC2626";
      const ex = bx + px * tlen * sgn, ey = by + py * tlen * sgn;
      parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${toothHue}" stroke-width="3.8" stroke-linecap="round"/>`);
      // Layer label tag along the shaft
      parts.push(`<text x="${(bx - dx * 4).toFixed(1)}" y="${(by - dy * 4).toFixed(1)}" font-size="6.5" font-weight="700" fill="var(--ink-soft)" opacity="0.6" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">${layer.tag}</text>`);
    });
  }

  // Scale bracket framing the 4-layer tooth zone [-5, +5]
  const fw = maxTlen + 4;
  const bx0 = cx + dx * armLen * 0.58, by0 = cy + dy * armLen * 0.58;
  const bx1 = tipX, by1 = tipY;
  const pLeft0 = { x: bx0 - px * fw, y: by0 - py * fw };
  const pRight0 = { x: bx0 + px * fw, y: by0 + py * fw };
  const pLeft1 = { x: bx1 - px * fw, y: by1 - py * fw };
  const pRight1 = { x: bx1 + px * fw, y: by1 + py * fw };

  parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.25"/>`);
  parts.push(`<polyline points="${pLeft0.x.toFixed(1)},${pLeft0.y.toFixed(1)} ${pLeft1.x.toFixed(1)},${pLeft1.y.toFixed(1)}" stroke="#DC2626" stroke-width="0.8" opacity="0.4"/>`);
  parts.push(`<polyline points="${pRight0.x.toFixed(1)},${pRight0.y.toFixed(1)} ${pRight1.x.toFixed(1)},${pRight1.y.toFixed(1)}" stroke="${p.hue}" stroke-width="0.8" opacity="0.4"/>`);

  if (pNum === 1) { // Top arm gets explicit scale text
    parts.push(`<text x="${(pLeft1.x - px * 5).toFixed(1)}" y="${(pLeft1.y - py * 5).toFixed(1)}" font-size="8" fill="#DC2626" opacity="0.8" text-anchor="middle" font-family="'JetBrains Mono', monospace">−5</text>`);
    parts.push(`<text x="${bx1.toFixed(1)}" y="${(by1 - py * 5).toFixed(1)}" font-size="7.5" fill="var(--ink-soft)" opacity="0.7" text-anchor="middle" font-family="'JetBrains Mono', monospace">0</text>`);
    parts.push(`<text x="${(pRight1.x + px * 5).toFixed(1)}" y="${(pRight1.y + py * 5).toFixed(1)}" font-size="8" fill="${p.hue}" opacity="0.8" text-anchor="middle" font-family="'JetBrains Mono', monospace">+5</text>`);
  }

  // Label at tip
  const labelDist = armLen + 22;
  const lx = cx + dx * labelDist, ly = cy + dy * labelDist;
  parts.push(`<text x="${lx.toFixed(1)}" y="${(ly - 5).toFixed(1)}" font-size="9.5" font-weight="700" fill="${p.hue}" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">P${p.n} ${escapeHtml(p.name)}</text>`);
  parts.push(`<text x="${lx.toFixed(1)}" y="${(ly + 8).toFixed(1)}" font-size="7.5" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'Inter', sans-serif">${escapeHtml(p.pillar)}</text>`);

  return parts.join("");
}

function pillarKeyringSVG() {
  const cx = 240, cy = 240, armLen = 160;
  const parts = [];
  for (let i = 0; i < 7; i++) {
    parts.push(pillarArmSVG(cx, cy, -90 + i * (360 / 7), armLen, i + 1));

  }).join("");

  return `<svg viewBox="0 0 480 480" style="max-width:460px;width:100%;display:block;margin:0 auto" role="img" aria-label="Tier 1 Master Keyring: 7 Pillars, 1 arm per Plane, 4 Bipolar Layers">
    <circle cx="${cx}" cy="${cy}" r="4" fill="var(--ink)"/>
    <circle cx="${cx}" cy="${cy}" r="12" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" opacity="0.4"/>
    ${parts.join("")}
  </svg>
  <div style="margin:12px 0 0;text-align:center;line-height:1.6">${legend}</div>`;
}

function combinedStarSVG() {
  const cx = 220, cy = 220, armLen = 165;
  const parts = [];
  for (let i = 0; i < 7; i++) parts.push(combinedArmSVG(cx, cy, -90 + i * (360 / 7), armLen, i));

  </svg>
  <p style="font-size:12.5px;margin:10px 0 0;text-align:center;line-height:1.7">${legend}</p>`;
}
