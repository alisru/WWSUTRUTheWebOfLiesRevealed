<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>What Kind of Australian Are You? — The Australian Kanon ABCD Survey (7 · 49 · 353)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #FAF6EE;
  --bg-card:   #FFFDF8;
  --bg-subtle: #F2ECE0;
  --bg-muted:  #E8E0D0;
  --ink:       #1F2421;
  --ink-soft:  #4A514C;
  --ink-muted: #757C76;
  --rule:      #DFD6C3;
  --rule-strong:#C8BDA6;

  --accent:        #1F5E4B;
  --accent-soft:   #DCECE5;
  --accent-warm:   #C86D3B;
  --accent-warm-soft:#F7E3D6;
  --gold:          #B98B22;
  --gold-soft:     #F5EBD0;

  --p1: #B98B22; /* Plane 1 Identity - Ochre Gold */
  --p2: #D97706; /* Plane 2 Definition - Amber */
  --p3: #1F7A6B; /* Plane 3 Land - Eucalyptus Teal */
  --p4: #2E6F95; /* Plane 4 Drive - Southern Cross Blue */
  --p5: #4A3E8E; /* Plane 5 Method - Indigo */
  --p6: #7B3F8C; /* Plane 6 Cause - Deep Violet */
  --p7: #B8423A; /* Plane 7 Result - Red Earth */

  --ok:   #2D7A4F;
  --warn: #C97A1B;
  --bad:  #B8392E;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(31,36,33,0.05);
  --shadow-md: 0 4px 16px rgba(31,36,33,0.08);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
h1, h2, h3, h4, .serif {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.2;
  margin: 0;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85em;
}

/* ---------- KANON SITE BANNER ---------- */
.kanon-site-bar {
  background: #141917;
  color: #E5E0D5;
  font-size: 0.8rem;
  border-bottom: 1px solid #2C3531;
}
.kanon-site-bar-inner {
  max-width: 1220px;
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.kanon-site-links {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.kanon-site-links a {
  color: #B5BDB8;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.15s;
}
.kanon-site-links a:hover { color: #FFF; }
.kanon-site-links a.active {
  color: #F5EBD0;
  font-weight: 700;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 2px;
}

/* ---------- STICKY APP HEADER ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 238, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.header-inner {
  max-width: 1220px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--ink);
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 1.05rem;
  margin-right: auto;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--p1), var(--p2), var(--p3), var(--p4), var(--p5), var(--p6), var(--p7), var(--p1));
  box-shadow: inset 0 0 0 5px var(--bg), inset 0 0 0 6.5px var(--ink);
  flex-shrink: 0;
}
.nav-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
}
.nav-pill {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}
.nav-pill:hover {
  background: var(--bg-subtle);
  color: var(--ink);
}
.nav-pill.active {
  background: var(--ink);
  color: var(--bg);
}
.nav-pill .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.tier-badge-top {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: #6E500D;
  border: 1px solid #E2CA87;
  font-weight: 600;
  cursor: pointer;
}
.progress-bar-wrap {
  height: 3px;
  background: var(--bg-subtle);
  width: 100%;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--p1), var(--p3), var(--p5), var(--p7));
  width: 0%;
  transition: width 0.3s ease;
}

/* ---------- MAIN CONTAINER ---------- */
main {
  max-width: 1140px;
  margin: 0 auto;
  padding: 28px 20px 80px;
}
main.wide { max-width: 1220px; }

/* ---------- TYPOGRAPHY & BUTTONS ---------- */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 600;
}
.lede {
  font-size: 1.08rem;
  color: var(--ink-soft);
  max-width: 68ch;
  line-height: 1.6;
}
.btn {
  appearance: none;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--bg);
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.15s ease;
}
.btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}
.btn-secondary {
  background: var(--bg-card);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
}
.btn-secondary:hover {
  background: var(--bg-subtle);
  border-color: var(--ink);
  color: var(--ink);
}
.btn-warm {
  background: var(--accent-warm);
  border-color: var(--accent-warm);
  color: #fff;
}
.btn-warm:hover {
  background: #A95527;
  border-color: #A95527;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 0.82rem;
}

/* ---------- CARDS & SURFACES ---------- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 16px; }
.callout {
  background: var(--bg-subtle);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.94rem;
  color: var(--ink-soft);
}
.callout strong { color: var(--ink); }
.callout-warm {
  background: var(--accent-warm-soft);
  border-left-color: var(--accent-warm);
}
.callout-gold {
  background: var(--gold-soft);
  border-left-color: var(--gold);
}

/* ---------- 12AXES-STYLE INLINE GLOSSARY TOOLTIPS ---------- */
.glossary-term {
  border-bottom: 1.5px dotted var(--accent);
  color: inherit;
  cursor: help;
  padding-bottom: 0.5px;
  transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  border-radius: 2px;
}
.glossary-term:hover,
.glossary-term:focus-visible,
.glossary-term.is-active {
  background: var(--accent-soft);
  color: var(--accent);
  border-bottom-style: solid;
  outline: none;
}
.glossary-tooltip {
  position: fixed;
  z-index: 300;
  width: min(330px, calc(100vw - 24px));
  background: #161D1A;
  color: #FAF6EE;
  border: 1px solid #35473F;
  border-radius: 10px;
  padding: 11px 14px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  line-height: 1.48;
  pointer-events: auto;
  animation: tooltip-pop 0.14s ease-out;
}
.glossary-tooltip strong {
  display: block;
  font-family: 'Fraunces', serif;
  font-size: 0.92rem;
  color: #F5D77F;
  margin-bottom: 4px;
}
.glossary-tooltip span {
  display: block;
  color: #E2DDD2;
}
@keyframes tooltip-pop {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 12AXES-STYLE (?) INFO BUTTON & MODAL SHEET ---------- */
.info-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.14s ease;
  flex-shrink: 0;
}
.info-btn svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}
.info-btn:hover,
.info-btn:focus-visible {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.info-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 250;
  background: rgba(20, 25, 23, 0.54);
  backdrop-filter: blur(3px);
  display: grid;
  place-items: center;
  padding: 20px;
  animation: sheet-fade 0.18s ease;
}
.info-sheet {
  position: relative;
  width: min(580px, 100%);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--rule-strong);
  border-top: 5px solid var(--sheet-accent, var(--accent));
  border-radius: 16px;
  padding: 24px 26px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  animation: sheet-pop 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.info-sheet-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
}
.info-sheet-close:hover {
  background: var(--ink);
  color: var(--bg);
}
.explain-sides-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}
@media (max-width: 640px) {
  .explain-sides-grid { grid-template-columns: 1fr; }
  .info-sheet-backdrop { place-items: end stretch; padding: 0; }
  .info-sheet { border-radius: 18px 18px 0 0; max-height: 88dvh; }
}
.explain-box {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.86rem;
}
.explain-box.is-high {
  border-left: 3px solid var(--ok);
  background: #F4FAF6;
}
.explain-box.is-low {
  border-left: 3px solid var(--bad);
  background: #FDF5F4;
}
.explain-box h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.explain-box.is-high h4 { color: var(--ok); }
.explain-box.is-low h4 { color: var(--bad); }
.explain-box p { margin: 0; color: var(--ink-soft); line-height: 1.48; }

@keyframes sheet-fade { from { opacity: 0; } }
@keyframes sheet-pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } }

/* ---------- TIER SELECTOR CARDS (7 · 49 · 353) ---------- */
.tier-selector-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 18px 0 24px;
}
@media (max-width: 820px) {
  .tier-selector-grid { grid-template-columns: 1fr; }
}
.tier-card {
  background: var(--bg-card);
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.16s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.tier-card:hover {
  border-color: var(--ink-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.tier-card.active {
  border-color: var(--accent);
  background: linear-gradient(180deg, #F4FAF7 0%, var(--bg-card) 100%);
  box-shadow: 0 4px 18px rgba(31,94,75,0.12);
}
.tier-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tier-num {
  font-family: 'Fraunces', serif;
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
.tier-card.active .tier-num { color: var(--accent); }
.tier-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.71rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--ink-soft);
  font-weight: 600;
}
.tier-card.active .tier-pill {
  background: var(--accent);
  color: #fff;
}
.tier-rec-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: #6E500D;
  border: 1px solid #E2CA87;
  font-weight: 700;
}
.tier-card h3 {
  font-size: 1.05rem;
  color: var(--ink);
}
.tier-card p {
  margin: 0;
  font-size: 0.85rem;
  color: var(--ink-soft);
  line-height: 1.45;
}
.tier-card-meta {
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px dashed var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  color: var(--ink-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.depth-dots {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}
.depth-dots i {
  width: 10px;
  height: 5px;
  border-radius: 2px;
  background: var(--rule-strong);
  display: inline-block;
}
.depth-dots i.on {
  background: var(--accent);
}

/* ---------- HUB PLANE GRID ---------- */
.plane-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 14px;
  margin-top: 16px;
}
.plane-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--plane-color, var(--accent));
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.plane-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: var(--rule-strong);
  border-top-color: var(--plane-color, var(--accent));
}
.plane-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.plane-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  color: var(--ink-muted);
  font-weight: 600;
}
.plane-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--ink-soft);
}
.plane-status.done {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.plane-status.partial {
  background: var(--gold-soft);
  color: #7A5A10;
}
.plane-card h3 { font-size: 1.18rem; }
.plane-card .pillar-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--plane-color, var(--accent));
  font-weight: 600;
}
.plane-card p {
  margin: 0;
  font-size: 0.88rem;
  color: var(--ink-soft);
  flex: 1;
}
.plane-mini-bar {
  height: 6px;
  background: var(--bg-subtle);
  border-radius: 999px;
  overflow: hidden;
  display: flex;
}
.plane-mini-bar > span {
  height: 100%;
  background: var(--plane-color, var(--accent));
  transition: width 0.3s ease;
}

/* ---------- QUESTIONNAIRE / ABCD NODE VIEW ---------- */
.plane-banner {
  border-left: 5px solid var(--plane-color, var(--accent));
  padding: 18px 22px;
  background: var(--bg-card);
  border-radius: 0 var(--radius) var(--radius) 0;
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin-bottom: 18px;
}
.plane-banner-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.plane-quote-box {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 0.94rem;
  color: var(--ink);
}
.plane-quote-box cite {
  display: block;
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 0.74rem;
  color: var(--ink-muted);
}

.legend-sticky {
  background: var(--bg-subtle);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 18px;
  font-size: 0.81rem;
  color: var(--ink-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: center;
  justify-content: space-between;
}
.legend-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
}
.legend-items span strong {
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
}

.view-mode-switch {
  display: inline-flex;
  background: var(--bg-card);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  padding: 2px;
  gap: 2px;
}
.view-mode-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.view-mode-btn.active {
  background: var(--ink);
  color: var(--bg);
}

/* Focus Mode Stepper Bar */
.focus-stepper-bar {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.focus-counter {
  font-family: 'Fraunces', serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ink);
}

/* Filter bar for Tier 3 */
.filter-bar {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.filter-chip {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink-soft);
  font-size: 0.76rem;
  font-family: 'JetBrains Mono', monospace;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.filter-chip.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* ABCD Scale Grid */
.scale-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.seg-group {
  display: grid;
  grid-template-columns: repeat(11, minmax(28px, 1fr));
  gap: 4px;
}
@media (max-width: 720px) {
  .seg-group {
    grid-template-columns: repeat(11, minmax(22px, 1fr));
    gap: 2px;
  }
}
.seg-btn {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink-soft);
  padding: 6px 3px;
  border-radius: 5px;
  font-family: 'Inter', sans-serif;
  font-size: 0.74rem;
  font-weight: 500;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s ease;
  line-height: 1.1;
}
.seg-btn[data-val="0"] {
  border-style: dashed;
  background: var(--bg-subtle);
}
.seg-btn .num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 0.8rem;
  display: block;
  color: var(--ink);
}
.seg-btn .lbl {
  font-size: 0.6rem;
  color: var(--ink-muted);
  display: block;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (max-width: 780px) {
  .seg-btn .lbl { display: none; }
}
.seg-btn:hover {
  border-color: var(--ink);
  background: var(--bg-subtle);
}
.seg-btn.sel {
  background: var(--ink);
  border-color: var(--ink);
  border-style: solid;
  color: var(--bg);
  font-weight: 600;
}
.seg-btn.sel .num,
.seg-btn.sel .lbl { color: var(--bg); }

.seg-btn.sel-a[data-val="-5"], .seg-btn.sel-b[data-val="-5"] { background: #8E2019; border-color: #8E2019; }
.seg-btn.sel-a[data-val="-4"], .seg-btn.sel-b[data-val="-4"] { background: #A82E24; border-color: #A82E24; }
.seg-btn.sel-a[data-val="-3"], .seg-btn.sel-b[data-val="-3"] { background: #BF432B; border-color: #BF432B; }
.seg-btn.sel-a[data-val="-2"], .seg-btn.sel-b[data-val="-2"] { background: #C9602E; border-color: #C9602E; }
.seg-btn.sel-a[data-val="-1"], .seg-btn.sel-b[data-val="-1"] { background: #B87B38; border-color: #B87B38; }
.seg-btn.sel-a[data-val="0"],  .seg-btn.sel-b[data-val="0"]  { background: #6E6A5E; border-color: #6E6A5E; }
.seg-btn.sel-a[data-val="1"],  .seg-btn.sel-b[data-val="1"]  { background: #558568; border-color: #558568; }
.seg-btn.sel-a[data-val="2"],  .seg-btn.sel-b[data-val="2"]  { background: #437A5B; border-color: #437A5B; }
.seg-btn.sel-a[data-val="3"],  .seg-btn.sel-b[data-val="3"]  { background: #326E4F; border-color: #326E4F; }
.seg-btn.sel-a[data-val="4"],  .seg-btn.sel-b[data-val="4"]  { background: #236144; border-color: #236144; }
.seg-btn.sel-a[data-val="5"],  .seg-btn.sel-b[data-val="5"]  { background: #165136; border-color: #165136; }

.seg-btn.sel-c[data-val="-5"], .seg-btn.sel-d[data-val="-5"] { background: #264663; border-color: #264663; }
.seg-btn.sel-c[data-val="-4"], .seg-btn.sel-d[data-val="-4"] { background: #32587A; border-color: #32587A; }
.seg-btn.sel-c[data-val="-3"], .seg-btn.sel-d[data-val="-3"] { background: #41698E; border-color: #41698E; }
.seg-btn.sel-c[data-val="-2"], .seg-btn.sel-d[data-val="-2"] { background: #52799D; border-color: #52799D; }
.seg-btn.sel-c[data-val="-1"], .seg-btn.sel-d[data-val="-1"] { background: #6688A8; border-color: #6688A8; }
.seg-btn.sel-c[data-val="0"],  .seg-btn.sel-d[data-val="0"]  { background: #6E6A5E; border-color: #6E6A5E; }
.seg-btn.sel-c[data-val="1"],  .seg-btn.sel-d[data-val="1"]  { background: #8F7632; border-color: #8F7632; }
.seg-btn.sel-c[data-val="2"],  .seg-btn.sel-d[data-val="2"]  { background: #B07828; border-color: #B07828; }
.seg-btn.sel-c[data-val="3"],  .seg-btn.sel-d[data-val="3"]  { background: #C46428; border-color: #C46428; }
.seg-btn.sel-c[data-val="4"],  .seg-btn.sel-d[data-val="4"]  { background: #BC4522; border-color: #BC4522; }
.seg-btn.sel-c[data-val="5"],  .seg-btn.sel-d[data-val="5"]  { background: #9E241C; border-color: #9E241C; }

.seg-clear {

  background: transparent;

}

/* Blocker tags row */
.blocker-chips-wrap {
  margin-top: 8px;

  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
.blocker-chip-btn {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: var(--bg);
  color: var(--ink-soft);
  font-size: 0.73rem;
  padding: 3px 9px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.12s;
}
.blocker-chip-btn:hover {
  border-color: var(--accent-warm);
  color: var(--ink);
}
.blocker-chip-btn.active {
  background: var(--accent-warm);
  border-color: var(--accent-warm);
  color: #fff;
  font-weight: 600;
}

/* ---------- RESULTS JUMP BAR (12AXES TOC STYLE) ---------- */
.results-jump-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
  align-items: center;
}
.results-jump-bar a {
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--ink-soft);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-subtle);
  transition: all 0.12s;
}
.results-jump-bar a:hover {
  background: var(--ink);
  color: var(--bg);
}

/* ---------- ARCHETYPE HERO (12AXES STYLE) ---------- */
.archetype-hero {
  background: linear-gradient(135deg, #18221F 0%, #24352F 60%, #2C2519 100%);
  color: #FAF6EE;
  border-radius: var(--radius);
  padding: 28px 30px;
  margin-bottom: 22px;

}
.archetype-hero-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 24px;
  align-items: center;
}
@media (max-width: 820px) {
  .archetype-hero-grid { grid-template-columns: 1fr; }
}
.archetype-badge {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(185, 139, 34, 0.25);
  color: #F5D77F;
  border: 1px solid rgba(245, 215, 127, 0.4);
  margin-bottom: 10px;
}
.archetype-hero h2 {
  font-size: clamp(1.7rem, 3.2vw, 2.4rem);
  color: #FFFDF8;
  margin-bottom: 6px;
}
.archetype-sub {
  font-family: 'Fraunces', serif;
  font-style: italic;
  color: #D5CFC0;
  font-size: 1.08rem;
  margin-bottom: 12px;
}
.archetype-desc {
  color: #E2DDD2;
  font-size: 0.95rem;
  line-height: 1.6;
  margin-bottom: 16px;
}
.archetype-stat-boxes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.arch-stat {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.arch-stat .num {
  font-family: 'Fraunces', serif;
  font-size: 1.55rem;
  font-weight: 700;
  color: #F5D77F;
  line-height: 1.1;
}
.arch-stat .lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  color: #B8C2BC;
  margin-top: 4px;
}

/* ---------- 12AXES SIGNATURE CARDS ---------- */
.signature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
@media (max-width: 860px) {
  .signature-grid { grid-template-columns: 1fr; }
}
.sig-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sig-card.sig-strong {
  background: linear-gradient(180deg, #F3FAF6 0%, var(--bg-card) 100%);
  border-color: #B7D4C8;
}
.sig-card.sig-tension {
  background: linear-gradient(180deg, #FCF3EE 0%, var(--bg-card) 100%);
  border-color: #E8C5B0;
}
.sig-big {
  font-family: 'Fraunces', serif;
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--ink);
}

/* ---------- CLOSENESS PIN TRACK (YOU VS THEM) ---------- */
.closeness-row {
  margin-bottom: 14px;
}
.closeness-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  margin-bottom: 6px;
}
.closeness-track {
  position: relative;
  height: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  margin: 10px 10px 6px;
}
.closeness-pin {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.closeness-pin.pin-you {
  background: var(--accent);
  color: #fff;
  z-index: 2;
  border: 2px solid #fff;
}
.closeness-pin.pin-them {
  background: var(--gold);
  color: #fff;
  z-index: 1;
  border: 2px solid #fff;
}

/* ---------- 12AXES-STYLE 7-PLANE BARS ---------- */
.axes-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
}
.axes-row:last-child { border-bottom: none; }
.axes-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.axes-dual-track {
  display: grid;
  grid-template-columns: 110px 1fr 52px;
  gap: 10px;
  align-items: center;
  margin-bottom: 5px;
  font-size: 0.8rem;
}
.axes-bar-outer {
  height: 12px;
  background: var(--bg-subtle);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--rule);
}
.axes-bar-inner {
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s ease;
}

/* ---------- BOOKS / READINGS GRID ---------- */
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.book-card {
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.dash-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }

  gap: 14px;
  margin-top: 16px;
}
.plane-star-card {
  background: var(--bg-card);

.plane-star-card svg {

  max-width: 185px;
  height: auto;
}
.stat-Strip {

.stat-box {

  border-radius: var(--radius-sm);

}

  line-height: 1.1;

  font-size: 0.74rem;

.rank-table th {

  font-size: 0.72rem;

.pill-score {

.page-footer-nav {

/* ---------- 12AXES-STYLE INLINE GLOSSARY ENGINE ---------- */
const GLOSSARY_BY_ID = {};
const GLOSSARY_PATTERNS = [];
GLOSSARY.forEach(entry => {
  GLOSSARY_BY_ID[entry.id] = entry;
  (entry.match || []).forEach(m => {
    if (m && m.length >= 3) {
      GLOSSARY_PATTERNS.push({ phrase: m, phraseLower: m.toLowerCase(), id: entry.id });
    }
  });
});
// Sort longest phrase first so "White Australia Policy" matches before "White Australia"
GLOSSARY_PATTERNS.sort((a, b) => b.phrase.length - a.phrase.length);

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isWordBoundaryChar(ch) {
  if (!ch) return true;
  return !/[A-Za-z0-9]/.test(ch);
}

// Finds non-overlapping glossary terms inside plain text and wraps them in <span class="glossary-term">
function renderGlossaryHTML(text, excludeName = "") {
  if (!text) return "";
  const lower = text.toLowerCase();
  const exLower = (excludeName || "").toLowerCase();
  const spans = [];
  const usedIds = new Set();

  for (const pat of GLOSSARY_PATTERNS) {
    if (usedIds.has(pat.id)) continue;
    // Don't underline the card's own title over and over inside its own prompt if we want to keep it clean, or allow first occurrence!
    let idx = lower.indexOf(pat.phraseLower);
    while (idx !== -1) {
      const end = idx + pat.phrase.length;
      const before = idx > 0 ? text[idx - 1] : "";
      const after = end < text.length ? text[end] : "";
      if (isWordBoundaryChar(before) && isWordBoundaryChar(after)) {
        // Check overlap with already claimed spans
        const overlaps = spans.some(s => !(end <= s.start || idx >= s.end));
        if (!overlaps) {
          spans.push({ start: idx, end, id: pat.id });
          usedIds.add(pat.id);
          break;
        }
      }
      idx = lower.indexOf(pat.phraseLower, idx + 1);
    }
  }

  if (spans.length === 0) return escapeHtml(text);
  spans.sort((a, b) => a.start - b.start);

  let out = "";
  let cursor = 0;
  for (const sp of spans) {
    if (sp.start > cursor) {
      out += escapeHtml(text.slice(cursor, sp.start));
    }
    const surface = escapeHtml(text.slice(sp.start, sp.end));
    out += `<span class="glossary-term" role="button" tabindex="0" data-glossary-id="${sp.id}">${surface}</span>`;
    cursor = sp.end;
  }
  if (cursor < text.length) {
    out += escapeHtml(text.slice(cursor));
  }
  return out;
}

// Global floating tooltip controller for .glossary-term and [data-badge-tip]
let activeTooltipEl = null;
let tooltipCloseTimer = null;

function hideFloatingTooltip() {
  if (activeTooltipEl) {
    activeTooltipEl.remove();
    activeTooltipEl = null;
  }
  document.querySelectorAll(".glossary-term.is-active").forEach(el => el.classList.remove("is-active"));
}

function showFloatingTooltip(anchorEl, title, body) {
  clearTimeout(tooltipCloseTimer);
  hideFloatingTooltip();
  anchorEl.classList.add("is-active");

  const tip = document.createElement("div");
  tip.className = "glossary-tooltip";
  tip.setAttribute("role", "tooltip");
  tip.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(body)}</span>`;
  document.body.appendChild(tip);
  activeTooltipEl = tip;

  const rect = anchorEl.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  let top = rect.bottom + 8;
  if (top + tipRect.height > window.innerHeight - 12) {
    top = Math.max(12, rect.top - tipRect.height - 8);
  }
  let left = Math.max(12, Math.min(rect.left, window.innerWidth - tipRect.width - 12));
  tip.style.top = `${top}px`;
  tip.style.left = `${left}px`;
}

function setupGlobalTooltips() {
  document.addEventListener("mouseover", (e) => {
    const gEl = e.target.closest("[data-glossary-id]");
    if (gEl) {
      const entry = GLOSSARY_BY_ID[gEl.getAttribute("data-glossary-id")];
      if (entry) showFloatingTooltip(gEl, entry.term, entry.definition);

    const bEl = e.target.closest("[data-badge-tip]");
    if (bEl) {
      showFloatingTooltip(bEl, bEl.getAttribute("data-badge-title") || "Kanon Metric", bEl.getAttribute("data-badge-tip"));

  });

  document.addEventListener("mouseout", (e) => {
    const gEl = e.target.closest("[data-glossary-id], [data-badge-tip]");
    if (gEl) {
      tooltipCloseTimer = setTimeout(hideFloatingTooltip, 140);

    }
  });

    if (e.key === "Escape") {

  });
}

const STORAGE_KEY = "aus_kanon_abcd_survey_v2";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        tier: parsed.tier || 49,               // 7, 49, or 353
        include354: !!parsed.include354,       // false = 353 Hanson Audit set, true = all 354 JSON nodes
        viewMode: parsed.viewMode || "list",   // 'list' (all cards in plane) or 'focus' (1 card at a time like 12axes)
        focusIdx: parsed.focusIdx || 0,        // active card index in focus mode
        planeFilter: parsed.planeFilter || "all",
        compareTargetId: parsed.compareTargetId || "monash",
        answers: parsed.answers || {},
        blockers: parsed.blockers || {},
        notes: parsed.notes || {},
        expandedSenses: parsed.expandedSenses || {}
      };
    }
  } catch (e) {}
  return {
    tier: 49,
    include354: false,
    viewMode: "list",
    focusIdx: 0,
    planeFilter: "all",
    compareTargetId: "monash",
    answers: {},
    blockers: {},
    notes: {},
    expandedSenses: {}
  };
}

let STATE = loadState();

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
  updateHeaderProgress();
}

function ansKey(prefix, id, probe) { return `${prefix}|${id}|${probe}`; }
function getAns(prefix, id, probe) { return STATE.answers[ansKey(prefix, id, probe)] ?? null; }
function setAns(prefix, id, probe, val) {
  const k = ansKey(prefix, id, probe);
  if (val === null || val === undefined) delete STATE.answers[k];
  else STATE.answers[k] = Number(val);
  saveState();
}

function getBlockers(prefix, id) {
  return STATE.blockers[`${prefix}|${id}`] || [];
}
function toggleBlocker(prefix, id, tag) {
  const k = `${prefix}|${id}`;
  const arr = (STATE.blockers[k] || []).slice();
  const idx = arr.indexOf(tag);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(tag);
  if (arr.length === 0) delete STATE.blockers[k];
  else STATE.blockers[k] = arr;
  saveState();
}

function activeTierVectors(planeNum = null) {
  const list = planeNum ? (VECTORS_BY_PLANE[planeNum] || []) : VECTORS;
  return STATE.include354 ? list : list.filter(v => v.inHanson353);
}

function isNodeAnswered(prefix, id) {
  return (
    getAns(prefix, id, "A") !== null ||
    getAns(prefix, id, "B") !== null ||
    getAns(prefix, id, "C") !== null ||
    getAns(prefix, id, "D") !== null
  );
}

function avgNums(arr) {
  const v = arr.filter(x => x !== null && x !== undefined && !Number.isNaN(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function getSenseMultiTierProbe(senseId, probe) {
  const s = SENSE_BY_ID[senseId];
  if (!s) return { tier1: null, tier2: null, tier3: null, effective: null };
  const t1 = getAns("P", s.plane, probe);
  const t2 = getAns("S", senseId, probe);
  const vecs = (VECTORS_BY_SENSE[senseId] || []).filter(v => STATE.include354 || v.inHanson353);
  const t3 = avgNums(vecs.map(v => getAns("V", v.uid, probe)));

  let effective = null;
  if (STATE.tier === 7) effective = t1 ?? t2 ?? t3;
  else if (STATE.tier === 49) effective = t2 ?? t3 ?? t1;
  else effective = t3 ?? t2 ?? t1;

  return { tier1: t1, tier2: t2, tier3: t3, effective };
}

function computeSenseSummary(senseId) {
  const mA = getSenseMultiTierProbe(senseId, "A");
  const mB = getSenseMultiTierProbe(senseId, "B");
  const mC = getSenseMultiTierProbe(senseId, "C");
  const mD = getSenseMultiTierProbe(senseId, "D");

  const A = mA.effective; // Personal Ideal ("Should")
  const B = mB.effective; // Personal Actual ("Would")
  const C = mC.effective; // Community Circle ("Should & Would")
  const D = mD.effective; // Australian Society ("Would" / Actual Outcome)

  const total = avgNums([A, B, C, D]);
  const personalMean = avgNums([A, B]);
  const gapAB = (A !== null && B !== null) ? (A - B) : null; // Personal Should-Would Gap (ΔH_personal)
  const gapAD = (A !== null && D !== null) ? (A - D) : null; // Social Contradiction Gap (Should A vs Society D)
  return { A, B, C, D, total, personalMean, gapAB, gapAD, multiA: mA, multiB: mB };
}

function computePlaneSummary(pNum) {
  const plane = PLANE_BY_N[pNum];
  const senses = SENSES_BY_PLANE[pNum] || [];
  const senseScores = senses.map(s => ({ sense: s, ...computeSenseSummary(s.id) }));

  const A = avgNums(senseScores.map(x => x.A));
  const B = avgNums(senseScores.map(x => x.B));
  const C = avgNums(senseScores.map(x => x.C));
  const D = avgNums(senseScores.map(x => x.D));
  const total = avgNums(senseScores.map(x => x.total));

  let totalNodes = 1;
  let answeredNodes = 0;
  if (STATE.tier === 7) {
    totalNodes = 1;
    answeredNodes = isNodeAnswered("P", pNum) ? 1 : (total !== null ? 1 : 0);
  } else if (STATE.tier === 49) {
    totalNodes = senses.length;
    answeredNodes = senses.filter(s => isNodeAnswered("S", s.id) || computeSenseSummary(s.id).total !== null).length;
  } else {
    const vecs = activeTierVectors(pNum);
    totalNodes = vecs.length;
    answeredNodes = vecs.filter(v => isNodeAnswered("V", v.uid)).length;
  }

  return {
    plane,
    senses: senseScores,
    A, B, C, D, total,
    answeredNodes,
    totalNodes
  };
}

function computeGlobalProgress() {
  if (STATE.tier === 7) {
    const done = PLANES.filter(p => isNodeAnswered("P", p.n)).length;
    return { done, total: 7, pct: Math.round((done / 7) * 100) };
  } else if (STATE.tier === 49) {
    const done = SENSES.filter(s => isNodeAnswered("S", s.id)).length;
    return { done, total: 49, pct: Math.round((done / 49) * 100) };
  } else {
    const vecs = activeTierVectors();
    const done = vecs.filter(v => isNodeAnswered("V", v.uid)).length;
    return { done, total: vecs.length, pct: Math.round((done / vecs.length) * 100) };
  }
}

/* ---------- ARCHETYPE, HEGEMONY (v, psi) & AUDIT ENGINE ---------- */
function computeKanonProfile() {
  const planeSummaries = PLANES.map(p => computePlaneSummary(p.n));
  const answeredPlanes = planeSummaries.filter(p => p.total !== null);

  // Normalize [-5, +5] -> [0, 1] via (val + 5) / 10
  // Use personal Should/Would mean (or overall total) for personal archetype matching
  const planeNormTotal = planeSummaries.map(p => {
    const pm = avgNums([p.A, p.B, p.C]);
    const ref = pm !== null ? pm : p.total;
    return ref !== null ? (ref + 5) / 10 : 0.5;
  });

  const avgA = avgNums(planeSummaries.map(p => p.A));
  const avgB = avgNums(planeSummaries.map(p => p.B));
  const avgC = avgNums(planeSummaries.map(p => p.C));
  const avgD = avgNums(planeSummaries.map(p => p.D));
  const avgTot = avgNums(planeSummaries.map(p => p.total));

  const alignmentPct = avgTot !== null ? Math.round(((avgTot + 5) / 10) * 100) : null;
  const ethosPct = avgA !== null ? Math.round(((avgA + 5) / 10) * 100) : null;
  const livedPct = avgB !== null ? Math.round(((avgB + 5) / 10) * 100) : null;
  const communityPct = avgC !== null ? Math.round(((avgC + 5) / 10) * 100) : null;
  const societyPct = avgD !== null ? Math.round(((avgD + 5) / 10) * 100) : null;

  let sumWA = 0, vA = 0, psiA = 0;
  let sumWB = 0, vB = 0, psiB = 0;

  let hitCount = 0, failCount = 0, neutralCount = 0, totalEvaluated = 0;
  let hansonAgree = 0, hansonCompared = 0;
  let alboAgree = 0, alboCompared = 0;

  const vecList = activeTierVectors();
  vecList.forEach(vec => {
    let a = getAns("V", vec.uid, "A");
    let b = getAns("V", vec.uid, "B");
    if (a === null && STATE.tier === 49) a = getAns("S", vec.senseId, "A");
    if (b === null && STATE.tier === 49) b = getAns("S", vec.senseId, "B");
    if (a === null && STATE.tier === 7) a = getAns("P", vec.plane, "A");
    if (b === null && STATE.tier === 7) b = getAns("P", vec.plane, "B");

    const nodeScore = avgNums([a, b]);
    if (nodeScore !== null) {
      totalEvaluated++;
      let userVerdict = "NEUTRAL";
      if (nodeScore >= 1.0) { hitCount++; userVerdict = "HIT"; }
      else if (nodeScore <= -1.0) { failCount++; userVerdict = "FAIL"; }
      else { neutralCount++; }

      if (userVerdict !== "NEUTRAL") {
        if (vec.hansonVerdict) {
          hansonCompared++;
          if (vec.hansonVerdict === userVerdict) hansonAgree++;
        }
        if (vec.alboVerdict) {
          alboCompared++;
          if (vec.alboVerdict === userVerdict) alboAgree++;
        }
      }
    }

    const targetV = vec.coords.v < 0 ? Math.abs(vec.coords.v) : vec.coords.v;
    const targetPsi = vec.coords.v < 0 ? -vec.coords.psi : vec.coords.psi;

    if (a !== null) {
      const polA = a / 5;
      vA += polA * targetV;
      psiA += polA * targetPsi;
      sumWA += 1;
    }
    if (b !== null) {
      const polB = b / 5;
      vB += polB * targetV;
      psiB += polB * targetPsi;
      sumWB += 1;
    }
  });

  const coordsA = sumWA > 0 ? { v: +(vA / sumWA * 1.35).toFixed(2), psi: +(psiA / sumWA * 1.35).toFixed(2) } : { v: 0, psi: 0 };
  const coordsB = sumWB > 0 ? { v: +(vB / sumWB * 1.35).toFixed(2), psi: +(psiB / sumWB * 1.35).toFixed(2) } : coordsA;

  // Personal Should-Would gap (ΔH_personal) & Social Contradiction gap (Should A - Society D)
  const personalGap = (avgA !== null && avgB !== null) ? Math.abs(avgA - avgB) : 0;
  const socialGap = (avgA !== null && avgD !== null) ? (avgA - avgD) : ((avgA !== null && avgB !== null) ? (avgA - avgB) : 0);
  const stressGap = Math.max(socialGap, (avgA !== null && avgB !== null) ? (avgA - avgB) : 0);

  const archetypeMatches = ARCHETYPES.map(arch => {
    let sqDist = 0;
    for (let i = 0; i < 7; i++) {
      const w = (arch.pillars || arch.weights)[i];
      const diff = planeNormTotal[i] - w;
      sqDist += diff * diff;
    }
    let rms = Math.sqrt(sqDist / 7);
    let sim = Math.max(0, 1 - rms * 1.15);

    if (arch.id === "betrayed_battler" && stressGap >= 1.5) {
      sim = Math.min(0.99, sim + Math.min(0.28, stressGap * 0.045));
    }
    if (arch.id === "stoic_guardian" && avgTot !== null && avgTot >= 2.5 && stressGap < 1.8) {
      sim = Math.min(0.99, sim + 0.12);
    }

    return {
      ...arch,
      matchPct: Math.round(sim * 100)
    };
  }).sort((a, b) => b.matchPct - a.matchPct);

  const userOverallCoords = {
    v: +((coordsA.v * 0.55 + coordsB.v * 0.45)).toFixed(2),
    psi: +((coordsA.psi * 0.55 + coordsB.psi * 0.45)).toFixed(2)
  };
  const figureMatches = FIGURES.map(fig => {
    const dv = userOverallCoords.v - fig.coords.v;
    const dpsi = userOverallCoords.psi - fig.coords.psi;
    const coordDist = Math.sqrt(dv * dv + dpsi * dpsi);
    const alignDiff = alignmentPct !== null ? Math.abs(alignmentPct - fig.alignment) / 100 : 0.3;
    let match = Math.max(5, Math.round((1 - (coordDist * 0.38 + alignDiff * 0.45)) * 100));

    if (fig.name.includes("Pauline Hanson") && hansonCompared > 0) {
      match = Math.round((hansonAgree / hansonCompared) * 100);
    } else if (fig.name.includes("Anthony Albanese") && alboCompared > 0) {
      match = Math.round((alboAgree / alboCompared) * 100);
    }
    return { ...fig, matchPct: Math.min(99, Math.max(4, match)) };
  }).sort((a, b) => b.matchPct - a.matchPct);

  const blockerCounts = {};
  Object.values(STATE.blockers).forEach(arr => {
    (arr || []).forEach(tag => {
      blockerCounts[tag] = (blockerCounts[tag] || 0) + 1;
    });
  });
  const topBlockers = Object.entries(blockerCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([tag, count]) => ({ tag, count }));

  return {
    planeSummaries,
    answeredPlanes,
    avgA, avgB, avgC, avgD, avgTot,
    personalGap, socialGap,
    alignmentPct, ethosPct, livedPct, communityPct, societyPct,
    coordsA, coordsB, userOverallCoords,
    hitCount, failCount, neutralCount, totalEvaluated,
    netAlignmentPct: totalEvaluated > 0 ? +(((hitCount - failCount) / totalEvaluated) * 100).toFixed(1) : 0,
    hansonAgree, hansonCompared,
    alboAgree, alboCompared,
    archetypeMatches,
    figureMatches,
    topBlockers
  };
}

/* ---------- DEMO PRESET PROFILES ---------- */
function loadPresetProfile(presetId) {
  STATE.answers = {};
  STATE.blockers = {};

  if (presetId === "stoic_guardian") {
    PLANES.forEach(p => {
      setAns("P", p.n, "A", 5); setAns("P", p.n, "B", 4); setAns("P", p.n, "C", 4); setAns("P", p.n, "D", 3);
    });
    SENSES.forEach((s, idx) => {
      setAns("S", s.id, "A", idx % 3 === 0 ? 5 : 4);
      setAns("S", s.id, "B", idx % 4 === 0 ? 5 : 4);
      setAns("S", s.id, "C", 4);
      setAns("S", s.id, "D", 3);
    });
  } else if (presetId === "betrayed_battler") {
    const demoBlockers = ["Cost of Living / Priced Out", "Corporate / Political Capture", "Broken Trust / Burned Before"];
    PLANES.forEach(p => {
      setAns("P", p.n, "A", 5);
      setAns("P", p.n, "B", 4);
      setAns("P", p.n, "C", 3);
      setAns("P", p.n, "D", p.n === 2 || p.n === 3 || p.n === 7 ? -3 : -2);
      STATE.blockers[`P|${p.n}`] = [demoBlockers[p.n % demoBlockers.length]];
    });
    SENSES.forEach((s, idx) => {
      setAns("S", s.id, "A", idx % 2 === 0 ? 5 : 4);
      setAns("S", s.id, "B", idx % 3 === 0 ? 4 : 3);
      setAns("S", s.id, "C", idx % 2 === 0 ? 3 : 2);
      setAns("S", s.id, "D", (s.plane === 2 || s.plane === 3 || idx % 3 === 0) ? -3 : -2);
      STATE.blockers[`S|${s.id}`] = [demoBlockers[idx % demoBlockers.length]];
    });
  } else if (presetId === "hanson_353") {
    STATE.tier = 353;
    STATE.include354 = false;
    VECTORS.filter(v => v.inHanson353).forEach(v => {
      const val = v.hansonVerdict === "HIT" ? 4 : -3;
      STATE.answers[ansKey("V", v.uid, "A")] = val;
      STATE.answers[ansKey("V", v.uid, "B")] = val;
      STATE.answers[ansKey("V", v.uid, "C")] = val;
      STATE.answers[ansKey("V", v.uid, "D")] = v.hansonVerdict === "FAIL" ? -3 : 2;
    });
  }
  saveState();
  render();
}

/* =========================================================================
   KEYRING PLOT SVG GENERATOR (EXACT WWSUTRU WELFARE-SURVEY IMPLEMENTATION)
   ========================================================================= */
// Extracts the 3 Left ("Should") teeth and 3 Right ("Would") teeth (-5..+5 or null) for a Sense ("1.1".."7.7").
// Left teeth (`aVals`) encode the Ideal ("Should", A) across the 3 horizons.
// Right teeth (`bVals`) encode the Actual ("Would") across the 3 horizons:
//   Slot 0 (Inner tooth): Personal Actual ("Would", B)
//   Slot 1 (Middle tooth): Community Circle ("Should & Would", C)
//   Slot 2 (Outer tooth): Australian Society ("Would", D)
// When Tier 3 vectors are answered in that Sense, the 3 slots also incorporate the inner/middle/outer vector ratings.
function subKeyringSlots(senseId) {
  const sense = SENSE_BY_ID[senseId];
  if (!sense) return { raw: [null, null, null, null, null, null], aVals: [null, null, null], bVals: [null, null, null], answered: [] };

  const pA = getAns("P", sense.plane, "A");
  const pB = getAns("P", sense.plane, "B");
  const pC = getAns("P", sense.plane, "C");
  const pD = getAns("P", sense.plane, "D");

  const sA = getAns("S", senseId, "A");
  const sB = getAns("S", senseId, "B");
  const sC = getAns("S", senseId, "C");
  const sD = getAns("S", senseId, "D");

  const vecs = (VECTORS_BY_SENSE[senseId] || []).filter(v => STATE.include354 || v.inHanson353);
  const vecNum = (v) => parseInt(String(v.addr || "").split(".")[2], 10) || 1;
  const g0 = vecs.filter(v => vecNum(v) <= 3);
  const g1 = vecs.filter(v => vecNum(v) === 4 || vecNum(v) === 5);
  const g2 = vecs.filter(v => vecNum(v) >= 6);

  const vA0 = avgNums(g0.map(v => getAns("V", v.uid, "A")));
  const vB0 = avgNums(g0.map(v => getAns("V", v.uid, "B")));
  const vA1 = avgNums(g1.map(v => getAns("V", v.uid, "A")));
  const vB1 = avgNums(g1.map(v => getAns("V", v.uid, "C") ?? getAns("V", v.uid, "B")));
  const vA2 = avgNums(g2.map(v => getAns("V", v.uid, "A")));
  const vB2 = avgNums(g2.map(v => getAns("V", v.uid, "D") ?? getAns("V", v.uid, "B")));

  const hasVecA = vA0 !== null || vA1 !== null || vA2 !== null;
  const hasVecB = vB0 !== null || vB1 !== null || vB2 !== null;

  const effA = sA ?? pA;
  const effB = sB ?? pB ?? effA;
  const effC = sC ?? pC ?? effB;
  const effD = sD ?? pD ?? effB;

  const aVals = hasVecA
    ? [vA0 ?? effA, vA1 ?? effA, vA2 ?? effA]
    : [effA, effA, effA];

  const bVals = hasVecB
    ? [vB0 ?? effB, vB1 ?? effC, vB2 ?? effD]
    : [effB, effC, effD];

  const raw = [aVals[0], bVals[0], aVals[1], bVals[1], aVals[2], bVals[2]];
  const answered = raw.filter(v => v != null);
  return { raw, aVals, bVals, answered };
}

// One arm = one key blade. Teeth are cut into both edges clustered near the
// shaft's tip (85%-98% of its length) -- the Should (A) vector's 3 slots on the left
// edge, the Would (B/C/D) vector's 3 on the right, each side's 3 slots sharing the same
// radial positions so a left/right pair lines up directly opposite each other.
// `showScale` draws the bracket framing the tooth zone with "Should:+5" and "Would:+5"
// labeled at each end, showing what full-length teeth look like.
function armSVG(cx, cy, angleDeg, armLen, hue, subId, labelSize, showScale) {
  const ang = angleDeg * Math.PI / 180;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx;
  const { aVals, bVals, answered } = subKeyringSlots(subId);
  const parts = [];
  const tipX = cx + dx * armLen, tipY = cy + dy * armLen;
  if (!answered.length) {
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
  } else {
    parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="${hue}" stroke-width="4" stroke-linecap="round"/>`);
    const slots = [0.85, 0.915, 0.98];
    [[aVals, -1], [bVals, 1]].forEach(([vals, sgn]) => {
      vals.forEach((v, i) => {
        if (v == null) return;
        const frac = slots[i];
        const bx = cx + dx * armLen * frac, by = cy + dy * armLen * frac;
        const norm = Math.max(0, Math.min(1, (v + 5) / 10));
        const tlen = 3 + norm * 12;
        const ex = bx + px * tlen * sgn, ey = by + py * tlen * sgn;
        parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${hue}" stroke-width="3" stroke-linecap="round"/>`);
      });
    });
  }
  if (showScale) {
    const bx = cx + dx * armLen * 0.83, by = cy + dy * armLen * 0.83;
    const fw = 15; // frame half-width, matches max tooth length (3+12=15)
    const p1x = bx - px * fw, p1y = by - py * fw, p2x = bx + px * fw, p2y = by + py * fw;
    const p3x = tipX - px * fw, p3y = tipY - py * fw, p4x = tipX + px * fw, p4y = tipY + py * fw;
    parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.35"/>`);
    parts.push(`<text x="${(p3x - px * 5).toFixed(1)}" y="${(p3y - py * 5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Should:+5</text>`);
    parts.push(`<text x="${(p4x + px * 5).toFixed(1)}" y="${(p4y + py * 5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Would:+5</text>`);
  }
  if (labelSize) {
    const lx = cx + dx * (armLen + labelSize + 4), ly = cy + dy * (armLen + labelSize + 4);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${labelSize}" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">${escapeHtml(subId)}</text>`);
  }
  return parts.join("");
}

function planeStarSVG(pNum, maxWidth = 200) {
  const p = PLANE_BY_N[pNum];
  const senses = SENSES_BY_PLANE[pNum] || [];
  const cx = 100, cy = 100, armLen = 78;
  const hue = p.hue;
  const parts = senses.map((s, i) => armSVG(cx, cy, -90 + i * (360 / 7), armLen, hue, s.id, 9, true));
  return `<svg viewBox="0 0 200 200" style="max-width:${maxWidth}px;display:block;margin:0 auto" role="img" aria-label="${escapeHtml(p.name)} diagnostic star">
    <circle cx="${cx}" cy="${cy}" r="3" fill="${hue}"/>
    ${parts.join("")}
  </svg>`;
}

// One arm direction (Q1-Q7, the i-th sub-indicator slot, same generic
// position every plane shares) carrying all 7 planes' teeth at once.
// Each plane gets its own thin ring within the tooth zone, nested outer-to-inner
// from Plane 1 (Identity) to Plane 7 (Result): 3 Should teeth on the left of that
// ring, 3 Would teeth on the right -- 7 rings x 3 = 21 teeth per side, all on the one arm.
function combinedArmSVG(cx, cy, angleDeg, armLen, i) {
  const ang = angleDeg * Math.PI / 180;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const px = -dy, py = dx;
  const parts = [];
  const tipX = cx + dx * armLen, tipY = cy + dy * armLen;
  parts.push(`<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
  const maxTlen = 36;
  const zoneStart = 0.5, zoneEnd = 0.98, ringW = (zoneEnd - zoneStart) / 7;
  PLANES.forEach((p, pi) => {
    const senseId = `${p.n}.${i + 1}`;
    const { aVals, bVals } = subKeyringSlots(senseId);
    const ringStart = zoneEnd - (pi + 1) * ringW;
    const slotFracs = [ringStart + ringW * 0.2, ringStart + ringW * 0.5, ringStart + ringW * 0.8];
    const hue = p.hue;
    [[aVals, -1], [bVals, 1]].forEach(([vals, sgn]) => {
      vals.forEach((v, k) => {
        if (v == null) return;
        const bx = cx + dx * armLen * slotFracs[k], by = cy + dy * armLen * slotFracs[k];
        const norm = Math.max(0, Math.min(1, (v + 5) / 10));
        const tlen = 4 + norm * maxTlen;
        const ex = bx + px * tlen * sgn, ey = by + py * tlen * sgn;
        parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${hue}" stroke-width="3.2" stroke-linecap="round"/>`);
      });
    });
  });
  // Scale bracket — frames the full 7-plane tooth zone
  const fw = maxTlen + 6;
  const bx0 = cx + dx * armLen * zoneStart, by0 = cy + dy * armLen * zoneStart;
  const bx1 = cx + dx * armLen * zoneEnd,   by1 = cy + dy * armLen * zoneEnd;
  const p1x = bx0 - px * fw, p1y = by0 - py * fw, p2x = bx0 + px * fw, p2y = by0 + py * fw;
  const p3x = bx1 - px * fw, p3y = by1 - py * fw, p4x = bx1 + px * fw, p4y = by1 + py * fw;
  parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>`);
  parts.push(`<text x="${(p3x - px * 5).toFixed(1)}" y="${(p3y - py * 5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Should:+5</text>`);
  parts.push(`<text x="${(p4x + px * 5).toFixed(1)}" y="${(p4y + py * 5).toFixed(1)}" font-size="8" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Would:+5</text>`);
  const lx = cx + dx * (armLen + 14), ly = cy + dy * (armLen + 14);
  parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">Q${i + 1}</text>`);
  return parts.join("");
}

// Baked-in illustrative mini keyring diagram (from welfare-survey.html)
function keyringExampleSVG() {
  const cx = 100, cy = 100, r = 82, viewW = 200, viewH = 220;
  const HUES_EX = PLANES.map(p => p.hue);
  const DATA_EX = [
    { a: [5, 4, 3], b: [5, 3, 2] }, // Plane 1 — Identity
    { a: [3, 3, 4], b: [4, 2, 3] }, // Plane 2 — Definition
    { a: [4, 4, 5], b: [2, 3, 4] }, // Plane 3 — Land
    { a: [3, 2, 3], b: [3, 3, 2] }, // Plane 4 — Drive
    { a: [5, 4, 4], b: [4, 3, 3] }, // Plane 5 — Method
    { a: [2, 3, 2], b: [3, 2, 2] }, // Plane 6 — Cause
    { a: [4, 3, 4], b: [3, 4, 3] }  // Plane 7 — Result
  ];
  const maxTlen = 18, zoneStart = 0.42, zoneEnd = 0.94;
  const ringW = (zoneEnd - zoneStart) / 7;
  const parts = [];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>`);
  for (let ai = 0; ai < 7; ai++) {
    const ang = (-90 + ai * (360 / 7)) * Math.PI / 180;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const px = -dy, py = dx;
    const tipX = cx + dx * r, tipY = cy + dy * r;
    parts.push(`<line x1="${cx}" y1="${cy}" x2="${tipX.toFixed(1)}" y2="${tipY.toFixed(1)}" stroke="var(--ink-soft)" stroke-width="1" opacity="0.3"/>`);
    for (let ri = 0; ri < 7; ri++) {
      const ringStart = zoneEnd - (ri + 1) * ringW;
      const slots = [ringStart + ringW * 0.2, ringStart + ringW * 0.5, ringStart + ringW * 0.8];
      const { a, b } = DATA_EX[ri];
      [[a, -1], [b, 1]].forEach(([vals, sgn]) => {
        vals.forEach((v, k) => {
          const bx = cx + dx * r * slots[k], by = cy + dy * r * slots[k];
          const tlen = 2 + (v - 1) / 4 * maxTlen;
          parts.push(`<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${(bx + px * tlen * sgn).toFixed(1)}" y2="${(by + py * tlen * sgn).toFixed(1)}" stroke="${HUES_EX[ri]}" stroke-width="1.8" stroke-linecap="round"/>`);
        });
      });
    }
    if (ai === 0) {
      const fw = maxTlen + 4;
      const bx0 = cx + dx * r * zoneStart, by0 = cy + dy * r * zoneStart;
      const bx1 = cx + dx * r * zoneEnd,   by1 = cy + dy * r * zoneEnd;
      const p1x = bx0 - px * fw, p1y = by0 - py * fw, p2x = bx0 + px * fw, p2y = by0 + py * fw;
      const p3x = bx1 - px * fw, p3y = by1 - py * fw, p4x = bx1 + px * fw, p4y = by1 + py * fw;
      parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<polyline points="${p1x.toFixed(1)},${p1y.toFixed(1)} ${p3x.toFixed(1)},${p3y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<polyline points="${p2x.toFixed(1)},${p2y.toFixed(1)} ${p4x.toFixed(1)},${p4y.toFixed(1)}" stroke="var(--ink)" stroke-width="0.8" opacity="0.3"/>`);
      parts.push(`<text x="${(p3x - px * 5).toFixed(1)}" y="${(p3y - py * 5).toFixed(1)}" font-size="7" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Should:+5</text>`);
      parts.push(`<text x="${(p4x + px * 5).toFixed(1)}" y="${(p4y + py * 5).toFixed(1)}" font-size="7" fill="var(--ink)" opacity="0.5" text-anchor="middle" font-family="'JetBrains Mono', monospace">Would:+5</text>`);
    }
    const lx = cx + dx * (r + 13), ly = cy + dy * (r + 13);
    parts.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="8" fill="var(--ink-soft)" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', monospace">Q${ai + 1}</text>`);
  }
  PLANES.forEach((p, i) => {
    const lx = 10 + i * 27, ly = viewH - 8;
    parts.push(`<circle cx="${lx}" cy="${ly}" r="3" fill="${HUES_EX[i]}"/>`);
  });
  return `<svg viewBox="0 0 ${viewW} ${viewH}" style="width:100%;max-width:${viewW}px;flex-shrink:0;display:block" role="img" aria-label="Keyring plot mini example, 7 arms and 7 planes">${parts.join("")}</svg>`;
}

/* ---------- PSOCHIC HEGEMONY (v, psi) CANVAS RENDERER ---------- */
function drawHegemonyCanvas(profile) {
  const canvas = document.getElementById("hegemony-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const pad = 44;
  const plotW = W - pad * 2;
  const plotH = H - pad * 2;
  const range = 1.25;

  const toX = (v) => pad + ((v + range) / (2 * range)) * plotW;
  const toY = (psi) => pad + ((range - psi) / (2 * range)) * plotH;

  ctx.fillStyle = "rgba(45, 122, 79, 0.12)";
  ctx.fillRect(W / 2, pad, plotW / 2, plotH / 2);
  ctx.fillStyle = "rgba(46, 111, 149, 0.10)";
  ctx.fillRect(W / 2, H / 2, plotW / 2, plotH / 2);
  ctx.fillStyle = "rgba(200, 109, 59, 0.11)";
  ctx.fillRect(pad, pad, plotW / 2, plotH / 2);
  ctx.fillStyle = "rgba(184, 57, 46, 0.12)";
  ctx.fillRect(pad, H / 2, plotW / 2, plotH / 2);

  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  [-1.0, -0.5, 0.5, 1.0].forEach(val => {
    ctx.beginPath(); ctx.moveTo(toX(val), pad); ctx.lineTo(toX(val), H - pad); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, toY(val)); ctx.lineTo(W - pad, toY(val)); ctx.stroke();
  });

  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W / 2, pad); ctx.lineTo(W / 2, H - pad); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, H / 2); ctx.lineTo(W - pad, H / 2); ctx.stroke();

  ctx.font = "600 11px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#6CD49A";
  ctx.textAlign = "right";
  ctx.fillText("GREATER GOOD (+υ, +ψ)", W - pad - 8, pad + 18);
  ctx.fillStyle = "#7BC0E3";
  ctx.fillText("LESSER GOOD / STOIC PEACE (+υ, -ψ)", W - pad - 8, H - pad - 10);
  ctx.textAlign = "left";
  ctx.fillStyle = "#F29D6B";
  ctx.fillText("GREATEST LIE / EXTRACTION (-υ, +ψ)", pad + 8, pad + 18);
  ctx.fillStyle = "#E87A72";
  ctx.fillText("GREATER EVIL / NEGLECT (-υ, -ψ)", pad + 8, H - pad - 10);

  ctx.fillStyle = "#B5BDB8";
  ctx.textAlign = "center";
  ctx.font = "500 10px 'JetBrains Mono', monospace";
  ctx.fillText("← Self / Group (-υ)          MORALITY (υ: Who benefits?)          All / Greater Good (+υ) →", W / 2, H - 12);

  const vecs = activeTierVectors();
  vecs.forEach(vec => {
    const x = toX(vec.coords.v);
    const y = toY(vec.coords.psi);
    let a = getAns("V", vec.uid, "A");
    let b = getAns("V", vec.uid, "B");
    const sc = avgNums([a, b]);

    ctx.beginPath();
    ctx.arc(x, y, sc !== null ? 3.6 : 2.3, 0, Math.PI * 2);
    if (sc === null) {
      ctx.fillStyle = "rgba(229, 224, 213, 0.22)";
    } else if (sc >= 1.0) {
      ctx.fillStyle = "rgba(74, 210, 138, 0.85)";
    } else if (sc <= -1.0) {
      ctx.fillStyle = "rgba(235, 94, 85, 0.85)";
    } else {
      ctx.fillStyle = "rgba(245, 215, 127, 0.85)";
    }
    ctx.fill();
  });

  const drawMarker = (v, psi, label, color, r = 7) => {
    const x = toX(Math.max(-range, Math.min(range, v)));
    const y = toY(Math.max(-range, Math.min(range, psi)));
    ctx.beginPath();
    ctx.arc(x, y, r + 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(20, 25, 23, 0.85)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#FFF";
    ctx.stroke();

    ctx.font = "600 10.5px 'JetBrains Mono', monospace";
    ctx.fillStyle = color;
    ctx.textAlign = x > W * 0.7 ? "right" : "left";
    const offX = x > W * 0.7 ? -12 : 12;
    ctx.fillText(label, x + offX, y + 4);
  };

  drawMarker(0.47, 0.23, "Stoic Guardian (+0.47, +0.23)", "#F5D77F", 6);
  drawMarker(-0.05, -0.01, "Pauline Hanson (-0.05, -0.01)", "#E8836B", 5.5);
  drawMarker(0.18, -0.12, "Albanese (+0.18, -0.12)", "#95B8D1", 5.5);

  if (profile.answeredPlanes.length > 0) {
    const xA = toX(Math.max(-range, Math.min(range, profile.coordsA.v)));
    const yA = toY(Math.max(-range, Math.min(range, profile.coordsA.psi)));
    const xB = toX(Math.max(-range, Math.min(range, profile.coordsB.v)));
    const yB = toY(Math.max(-range, Math.min(range, profile.coordsB.psi)));

    ctx.beginPath();
    ctx.setLineDash([4, 3]);
    ctx.moveTo(xA, yA);
    ctx.lineTo(xB, yB);
    ctx.strokeStyle = "#FFF";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);

    drawMarker(profile.coordsB.v, profile.coordsB.psi, `YOUR LIVED REALITY B (${profile.coordsB.v >= 0 ? "+" : ""}${profile.coordsB.v}, ${profile.coordsB.psi >= 0 ? "+" : ""}${profile.coordsB.psi})`, "#5BC0EB", 8);
    drawMarker(profile.coordsA.v, profile.coordsA.psi, `YOUR ETHOS A (${profile.coordsA.v >= 0 ? "+" : ""}${profile.coordsA.v}, ${profile.coordsA.psi >= 0 ? "+" : ""}${profile.coordsA.psi})`, "#4AD28A", 9);
  }
}

/* ---------- 12AXES-STYLE SOCIAL SHARE CARD PNG GENERATOR ---------- */
function downloadShareCardPNG(profile) {
  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1350;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const arch = profile.archetypeMatches[0];
  const topFig = profile.figureMatches[0];

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 1080, 1350);
  grad.addColorStop(0, "#141D1A");
  grad.addColorStop(0.6, "#1F2E28");
  grad.addColorStop(1, "#2A2318");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1350);

  // Border frame
  ctx.strokeStyle = "rgba(245, 215, 127, 0.35)";
  ctx.lineWidth = 3;
  ctx.strokeRect(36, 36, 1008, 1278);

  // Header eyebrow
  ctx.fillStyle = "#F5D77F";
  ctx.font = "700 22px 'JetBrains Mono', monospace";
  ctx.fillText("WHAT KIND OF AUSTRALIAN ARE YOU? · THE AUSTRALIAN KANON", 76, 98);

  // Archetype badge & title
  ctx.fillStyle = "#6CD49A";
  ctx.font = "600 24px 'JetBrains Mono', monospace";
  ctx.fillText(`${arch.badge.toUpperCase()} · ${arch.matchPct}% MATCH`, 76, 165);

  ctx.fillStyle = "#FFFDF8";
  ctx.font = "700 58px 'Fraunces', Georgia, serif";
  ctx.fillText(arch.name, 76, 235);

  ctx.fillStyle = "#D5CFC0";
  ctx.font = "italic 30px 'Fraunces', Georgia, serif";
  ctx.fillText(arch.subtitle, 76, 282);

  // 4 Key Stat Boxes
  const stats = [
    { lbl: "OVERALL KANON ALIGNMENT", val: `${profile.alignmentPct ?? "—"}%` },
    { lbl: "ETHOS (A) VS LIVED (B)", val: `${profile.ethosPct ?? "—"}% vs ${profile.livedPct ?? "—"}%` },
    { lbl: "HEGEMONY COORDINATE (υ, ψ)", val: `(${profile.userOverallCoords.v >= 0 ? "+" : ""}${profile.userOverallCoords.v}, ${profile.userOverallCoords.psi >= 0 ? "+" : ""}${profile.userOverallCoords.psi})` },
    { lbl: "CLOSEST HISTORICAL FIGURE", val: `${topFig.name} (${topFig.matchPct}%)` }
  ];

  stats.forEach((st, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const bx = 76 + col * 470;
    const by = 325 + row * 125;
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(bx, by, 450, 105);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, 450, 105);

    ctx.fillStyle = "#F5D77F";
    ctx.font = "700 32px 'Fraunces', Georgia, serif";
    ctx.fillText(st.val, bx + 22, by + 52);

    ctx.fillStyle = "#B8C2BC";
    ctx.font = "600 16px 'JetBrains Mono', monospace";
    ctx.fillText(st.lbl, bx + 22, by + 84);
  });

  // 7 Planes Dual Bars
  ctx.fillStyle = "#FFFDF8";
  ctx.font = "700 28px 'Fraunces', Georgia, serif";
  ctx.fillText("The 7 Pillars of the Australian Kanon — Ethos (A) vs. Lived Reality (B)", 76, 625);

  profile.planeSummaries.forEach((sum, idx) => {
    const p = sum.plane;
    const y = 665 + idx * 82;
    const pctA = sum.A !== null ? Math.round(((sum.A + 5) / 10) * 100) : 50;
    const pctB = sum.B !== null ? Math.round(((sum.B + 5) / 10) * 100) : 50;

    ctx.fillStyle = "#FAF6EE";
    ctx.font = "600 22px 'Inter', sans-serif";
    ctx.fillText(`P${p.n} ${p.name} (${p.pillar})`, 76, y + 20);

    ctx.fillStyle = "#B8C2BC";
    ctx.font = "600 18px 'JetBrains Mono', monospace";
    ctx.fillText(`Ethos A: ${pctA}%  |  Lived B: ${pctB}%`, 720, y + 20);

    // Bar A
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(76, y + 32, 928, 14);
    ctx.fillStyle = p.hue;
    ctx.fillRect(76, y + 32, (928 * pctA) / 100, 14);

    // Bar B
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(76, y + 50, 928, 10);
    ctx.fillStyle = "#5BC0EB";
    ctx.fillRect(76, y + 50, (928 * pctB) / 100, 10);
  });

  ctx.fillStyle = "#95A39C";
  ctx.font = "500 18px 'JetBrains Mono', monospace";
  ctx.fillText("Australian Kanon 7×7×7 Matrix · WWSUTRU ABCD Welfare Diagnostic (−5 to +5)", 76, 1280);

  const link = document.createElement("a");
  link.download = `australian-kanon-archetype-${new Date().toISOString().slice(0, 10)}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

   HEADER & ROUTER
   ========================================================================= */
function updateHeaderProgress() {
  const prog = computeGlobalProgress();
  const bar = document.getElementById("global-progress");
  if (bar) bar.style.width = `${prog.pct}%`;

  const tierBtn = document.getElementById("header-tier-btn");
  if (tierBtn) {
    const tierLbl = STATE.tier === 7
      ? "Tier 1: 7 Pillars"
      : STATE.tier === 49
        ? "Tier 2: 49 Senses"
        : `Tier 3: ${STATE.include354 ? 354 : 353} Vectors`;
    tierBtn.textContent = `${tierLbl} (${prog.done}/${prog.total})`;
    tierBtn.onclick = () => {
      if (STATE.tier === 7) STATE.tier = 49;
      else if (STATE.tier === 49) STATE.tier = 353;
      else STATE.tier = 7;
      STATE.focusIdx = 0;
      saveState();
      render();
    };
  }
}

function renderNav(route) {
  const nav = document.getElementById("top-nav");
  const items = [
    { href: "#/hub", label: "Hub", active: route.page === "hub" },
    { href: "#/framework", label: "Scoring Key", active: route.page === "framework" },
    ...PLANES.map(p => ({
      href: `#/plane/${p.n}`,
      label: `${p.n}·${p.name}`,
      dot: p.hue,
      active: route.page === "plane" && route.planeNum === p.n
    })),
    { href: "#/search", label: "Search", active: route.page === "search" },
    { href: "#/review", label: "Review", active: route.page === "review" },
    { href: "#/results", label: "Results & Archetype", active: route.page === "results" }
  ];

  nav.innerHTML = items.map(it => `
    <a class="nav-pill ${it.active ? "active" : ""}" href="${it.href}">
      ${it.dot ? `<span class="dot" style="background:${it.dot}"></span>` : ""}
      <span>${it.label}</span>
    </a>
  `).join("");
  updateHeaderProgress();
}

function parseRoute() {
  const h = (location.hash || "#/hub").replace(/^#\/?/, "");
  const parts = h.split("/");
  if (parts[0] === "plane") {
    const n = Math.min(7, Math.max(1, parseInt(parts[1] || "1", 10) || 1));
    return { page: "plane", planeNum: n };
  }
  if (["framework", "results", "search", "review"].includes(parts[0])) {
    return { page: parts[0] };
  }
  return { page: "hub" };
}

function render() {
  hideFloatingTooltip();
  const route = parseRoute();
  renderNav(route);
  const app = document.getElementById("app");
  app.className = (route.page === "results" || route.page === "hub") ? "wide" : "";

  if (route.page === "hub") renderHub(app);
  else if (route.page === "framework") renderFramework(app);
  else if (route.page === "plane") renderPlane(app, route.planeNum);
  else if (route.page === "search") renderSearch(app);
  else if (route.page === "review") renderReview(app);
  else if (route.page === "results") renderResults(app);

  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", render);

      <span>Explain</span>

function renderABCDBlockHTML(prefix, id, item, planeHue, extraHeaderHTML = "", extraFooterHTML = "") {
  const valA = getAns(prefix, id, "A");
  const valB = getAns(prefix, id, "B");
  const valC = getAns(prefix, id, "C");
  const valD = getAns(prefix, id, "D");
  const chosenBlockers = getBlockers(prefix, id);
  const answered = valA !== null || valB !== null || valC !== null || valD !== null;

  const isShadow = item.coords && item.coords.v < 0;
  const isFN = !!item.fn;

  const makeRow = (probe, kindLabel, promptText, scaleList, curVal) => {
    const selClass = `sel-${probe.toLowerCase()}`;
    const letterClass = `letter-${probe.toLowerCase()}`;
    return `
      <div class="probe-row">
        <div class="probe-top">
          <span class="probe-letter ${letterClass}">${probe}</span>
          <span class="probe-kind">${kindLabel}</span>
          <span class="probe-text">${renderGlossaryHTML(promptText)}</span>
        </div>
        <div class="scale-row">
          <div class="seg-group" role="radiogroup" aria-label="${probe} rating">
            ${scaleList.map(opt => {
              const sel = curVal === opt.v;
              const numStr = opt.v > 0 ? `+${opt.v}` : `${opt.v}`;
              return `
                <button type="button"
                  class="seg-btn ${sel ? `sel ${selClass}` : ""}"
                  data-prefix="${prefix}" data-id="${id}" data-probe="${probe}" data-val="${opt.v}"
                  title="${escapeHtml(opt.tip || `${numStr}: ${opt.lbl}`)}"
                  aria-pressed="${sel ? "true" : "false"}">
                  <span class="num">${numStr}</span>
                  <span class="lbl">${opt.lbl}</span>
                </button>
              `;
            }).join("")}
          </div>
          <button type="button" class="seg-clear" title="Clear row"
            data-clear-prefix="${prefix}" data-clear-id="${id}" data-clear-probe="${probe}">clear</button>
        </div>
        ${probe === "D" ? `
          <div class="blocker-chips-wrap">
            <span class="mono" style="font-size:0.7rem;color:var(--ink-muted);margin-right:4px;">What's blocking it in Australia?</span>
            ${BLOCKER_TAGS.map(tag => {
              const active = chosenBlockers.includes(tag);
              return `<button type="button" class="blocker-chip-btn ${active ? "active" : ""}" data-blocker-prefix="${prefix}" data-blocker-id="${id}" data-blocker-tag="${tag}">${tag}</button>`;
            }).join("")}
          </div>
        ` : ""}
      </div>
    `;
  };

  return `
    <section class="sense-card ${answered ? "answered" : ""} ${isShadow ? "shadow-node" : ""} ${isFN ? "fn-node" : ""}" id="node-${prefix}-${id}" style="--plane-color:${planeHue}">
      ${extraHeaderHTML}
      ${makeRow("A", "Personal · Should", item.qA, SCALE_A, valA)}
      ${makeRow("B", "Personal · Would", item.qB, SCALE_B, valB)}
      ${makeRow("C", "Community · Circle", item.qC, SCALE_C, valC)}
      ${makeRow("D", "Society · Australia", item.qD, SCALE_D, valD)}
      ${extraFooterHTML}
    </section>
  `;
}

function bindABCDDelegation(container, onUpdateCallback) {
  container.addEventListener("click", (e) => {
    // (?) Explain button
    const infoBtn = e.target.closest("[data-open-info-prefix]");
    if (infoBtn) {
      openNodeInfoSheet(infoBtn.getAttribute("data-open-info-prefix"), infoBtn.getAttribute("data-open-info-id"));
      return;
    }

    // Inline glossary term click (for touch/click devices)
    const gTerm = e.target.closest("[data-glossary-id]");
    if (gTerm) {
      const entry = GLOSSARY_BY_ID[gTerm.getAttribute("data-glossary-id")];
      if (entry) showFloatingTooltip(gTerm, entry.term, entry.definition);
      return;
    }

    const segBtn = e.target.closest(".seg-btn");
    if (segBtn) {
      const prefix = segBtn.getAttribute("data-prefix");
      const id = segBtn.getAttribute("data-id");
      const probe = segBtn.getAttribute("data-probe");
      const val = parseInt(segBtn.getAttribute("data-val"), 10);
      const cur = getAns(prefix, id, probe);
      setAns(prefix, id, probe, cur === val ? null : val);

      const group = segBtn.parentElement;
      const newVal = getAns(prefix, id, probe);
      group.querySelectorAll(".seg-btn").forEach(b => {
        const bVal = parseInt(b.getAttribute("data-val"), 10);
        const sel = bVal === newVal;
        b.classList.toggle("sel", sel);
        b.classList.toggle(`sel-${probe.toLowerCase()}`, sel);
        b.setAttribute("aria-pressed", sel ? "true" : "false");
      });
      const card = segBtn.closest(".sense-card");
      if (card) card.classList.toggle("answered", isNodeAnswered(prefix, id));
      if (onUpdateCallback) onUpdateCallback();
      return;
    }

    const clrBtn = e.target.closest(".seg-clear");
    if (clrBtn) {
      const prefix = clrBtn.getAttribute("data-clear-prefix");
      const id = clrBtn.getAttribute("data-clear-id");
      const probe = clrBtn.getAttribute("data-clear-probe");
      setAns(prefix, id, probe, null);
      const row = clrBtn.closest(".scale-row");
      if (row) {
        row.querySelectorAll(".seg-btn").forEach(b => {
          b.classList.remove("sel", "sel-a", "sel-b", "sel-c", "sel-d");
          b.setAttribute("aria-pressed", "false");
        });
      }
      const card = clrBtn.closest(".sense-card");
      if (card) card.classList.toggle("answered", isNodeAnswered(prefix, id));
      if (onUpdateCallback) onUpdateCallback();
      return;
    }

    const blkBtn = e.target.closest(".blocker-chip-btn");
    if (blkBtn) {
      const prefix = blkBtn.getAttribute("data-blocker-prefix");
      const id = blkBtn.getAttribute("data-blocker-id");
      const tag = blkBtn.getAttribute("data-blocker-tag");
      toggleBlocker(prefix, id, tag);
      blkBtn.classList.toggle("active", getBlockers(prefix, id).includes(tag));
      if (onUpdateCallback) onUpdateCallback();
      return;
    }

    const expandSenseBtn = e.target.closest("[data-toggle-sense-vectors]");
    if (expandSenseBtn) {
      const sId = expandSenseBtn.getAttribute("data-toggle-sense-vectors");
      STATE.expandedSenses[sId] = !STATE.expandedSenses[sId];
      saveState();
      render();
      return;
    }
  });
}

  bindABCDDelegation(app, () => {

/* =========================================================================
   VIEW 6: RESULTS, ARCHETYPE & KEYRING DASHBOARD (#/results)
   Includes 12Axes Signature, Closeness Modal, Head-to-Head Compare, Books & PNG Export
   ========================================================================= */
function renderResults(app) {
  const profile = computeKanonProfile();
  const summaries = profile.planeSummaries;
  const primaryArch = profile.archetypeMatches[0];
  const secondaryArch = profile.archetypeMatches[1];

  const answeredPlanes = profile.answeredPlanes;
  let V_norm = null, V_signed = null;
  if (answeredPlanes.length > 0) {
    const norms = answeredPlanes.map(s => Math.max(0.05, (s.total + 5) / 10));
    const prod = norms.reduce((acc, v) => acc * v, 1);
    V_norm = Math.pow(prod, 1 / norms.length);
    V_signed = -5 + 10 * V_norm;
  }

  // 12Axes-Style Signature Insights:
  // 1. Defining Pillar (highest total or A)
  const sortedByTotal = [...summaries].filter(s => s.total !== null).sort((a, b) => b.total - a.total);
