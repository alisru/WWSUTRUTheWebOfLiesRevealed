<!DOCTYPE html>

.starttile{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:18px}

</style>

  </div>

<main class="wrap">
  <h1>Open surveys</h1>
  <p class="prose">Nothing here talks to a server until you answer one and submit.</p>

  <!--
    Plain hand-edited list -- there is no server here to scan the folder for
    survey files, so add one card per exported survey, same as any other
    index page in this repo. Copy the block below for each one.
  -->
  <div class="startgrid">

    <div class="starttile">
      <h2>Judgement</h2>
      <p>The Psochic Hegemony — judging ideas, concepts and people through relative morality.</p>
      <a class="btn" href="hegemony-survey.html">Start</a>
    </div>

  </div>
