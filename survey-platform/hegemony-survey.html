<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Psochic Hegemony — Judgement</title>
<style>
:root{
  --bg:#0d0f16; --panel:#12141c; --panel-2:#171a24; --rule:#252a38;
  --ink:#e6e9f2; --ink-soft:#9aa3b8; --focus:#30c8e0;
  --gg:#3bde84; --le:#f05060; --ge:#e04080; --lg:#30c8e0;
  --mono:ui-monospace,"JetBrains Mono","IBM Plex Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:1020px;margin:0 auto;padding:0 20px}

header.mast{border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:40}
.mast-in{max-width:1020px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.prog{flex:1;height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;min-width:60px;cursor:pointer}
.prog i{display:block;height:100%;background:var(--gg);transition:width .35s ease}
.progn{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}

main{padding:34px 0 90px}
h1{font-size:clamp(26px,4.5vw,38px);line-height:1.12;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px}
.prose{max-width:66ch;color:var(--ink-soft)}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}

/* ---------- choice ---------- */
.opts{display:flex;flex-direction:column;gap:8px;margin:20px 0 0;max-width:560px}
.opts label{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1px solid var(--rule);
  border-radius:6px;background:var(--panel);cursor:pointer}
.opts label:hover{border-color:var(--ink-soft)}
.opts input{margin-top:5px;accent-color:var(--gg);flex:none}
.opts label:has(input:checked){border-color:var(--gg);background:#3bde840f}
textarea{width:100%;max-width:66ch;min-height:150px;font-family:inherit;font-size:16px;padding:12px;
  border:1px solid var(--rule);background:var(--panel);border-radius:6px;color:var(--ink);resize:vertical}
input[type=text]{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--rule);
  background:var(--panel);border-radius:6px;color:var(--ink);width:100%;max-width:340px}
textarea:focus,input:focus{outline:2px solid var(--focus);outline-offset:1px}

/* ---------- map ---------- */
.maprow{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:26px;margin:22px 0 0;align-items:start}
@media(max-width:840px){.maprow{grid-template-columns:1fr}}
/* The map is a light panel on the dark page -- the hegemony's own artwork
   is white-grounded, and the two fields wash out to white at their weak
   ends, which only reads correctly against white. */
.mapbox{background:#ffffff;border:1px solid var(--rule);border-radius:8px;padding:10px;
  touch-action:none;position:relative}
svg.map{display:block;width:100%;height:auto;cursor:crosshair}
svg.map text{font-family:var(--mono);pointer-events:none;user-select:none}
.tok{cursor:grab}
.tok.dragging{cursor:grabbing}

.tray{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px}
.tray h3{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px;font-weight:400}
.chip{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:6px;background:var(--panel-2);margin-bottom:7px;cursor:grab;touch-action:none;
  font-size:14px;user-select:none}
.chip:last-child{margin-bottom:0}
.chip .dot{width:11px;height:11px;border-radius:50%;flex:none}
.chip[data-placed=true]{opacity:.42}
.chip.sel{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
/* Drag ghost. Deliberately NOT called .ghost -- .btn.ghost is the secondary
   button style, and a bare .ghost rule would give the Back button
   position:fixed and pointer-events:none, making it unclickable. */
.dragghost{position:fixed;z-index:99;pointer-events:none;padding:7px 11px;border-radius:6px;
  background:var(--panel-2);border:1px solid var(--focus);font-size:14px;display:flex;gap:8px;
  align-items:center;transform:translate(-50%,-50%);white-space:nowrap}
.hint{font-size:12.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5}

.readout{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
table.rd{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
table.rd th{text-align:right;font-weight:400;color:var(--ink-soft);padding:3px 0 3px 8px}
table.rd th:first-child{text-align:left;padding-left:0}
table.rd td{text-align:right;padding:3px 0 3px 8px;font-variant-numeric:tabular-nums}
table.rd td:first-child{text-align:left;padding-left:0;color:var(--ink-soft)}
table.rd tr.near td{color:var(--gg)}
.clr{font-family:var(--mono);font-size:11px;background:none;border:none;color:var(--ink-soft);
  cursor:pointer;text-decoration:underline;padding:0;margin-top:10px}

/* ---------- nav ---------- */
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:34px;padding-top:22px;
  border-top:1px solid var(--rule)}
.btn{font-family:inherit;font-weight:600;font-size:15px;padding:11px 20px;border-radius:6px;
  border:1px solid var(--gg);background:var(--gg);color:#08120c;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.msg{font-size:13.5px;color:var(--ink-soft)}
.msg.err{color:var(--le)}

/* ---------- collapsible theory ---------- */
details.more{max-width:66ch;margin:16px 0 0;border:1px solid var(--rule);
  border-radius:6px;background:var(--panel);overflow:hidden}
details.more summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;
  color:var(--ink);list-style:none;display:flex;align-items:center;gap:9px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'▸';color:var(--ink-soft);font-size:12px;flex:none}
details.more[open] summary::before{content:'▾'}
details.more summary:hover{background:var(--panel-2)}
details.more summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
details.more > .prose{padding:0 14px 13px;border-top:1px solid var(--rule);margin-top:0}
details.more > .prose p:first-child{margin-top:13px}
pre.out{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--rule);
  padding:14px;border-radius:6px;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="brand">Judgement<span>The Psochic Hegemony</span></div>
    <div class="prog" title="Overall progress -- click to jump"><i id="progBar" style="width:0"></i></div>
    <div class="progn" id="progNum"></div>
  </div>
  <div class="mast-in" id="sectionProgRow" style="display:none;padding-top:0">
    <button type="button" id="toTopicsBtn" class="btn ghost" style="padding:5px 10px;font-size:12px;font-weight:600">◂ All topics</button>
    <div class="progn" id="sectionLabel" style="white-space:nowrap"></div>
    <div class="prog" id="sectionProgWrap" style="height:4px"><i id="sectionProgBar" style="width:0;background:var(--focus)"></i></div>
    <div class="progn" id="sectionProgNum"></div>
  </div>
</header>
<main id="view" class="wrap" tabindex="-1"></main>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Supabase. Same project as the welfare survey; the publishable key is
 * meant to ship in the page -- schema.sql (RLS + the pre-request
 * throttle) is what actually protects the data.
 * ------------------------------------------------------------------ */
const SUPABASE_URL = 'https://iaudayzofxrgzwutittm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WlfhOxEkAGDwAk5oZV2YrA_BIFfI0XN';

let supa = null;
if (window.supabase) supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Anonymous sign-in gives a stable respondent_id, so a second run from the
// same browser updates the first row instead of creating a duplicate.
async function ensureSession() {
  if (!supa) return { error: { message: 'Supabase is not configured.' } };
  const { data: { session } } = await supa.auth.getSession();
  if (session) return { session };
  const { data, error } = await supa.auth.signInAnonymously();
  if (error) return { error };
  return { session: data.session };
}

/* ------------------------------------------------------------------ *
 * Map geometry. Anchors and the pixel mapping are taken from
 * CoreTools/hegemony_map.html (canonicalAnchors + toPixel), so a point
 * placed here lands where it would land there.
 *
 *   v   = Good <-> Bad          (v > 0 is Good, and draws to the LEFT)
 *   psi = Active <-> Suppressive (psi > 0 is Active, draws UP)
 *
 * The grid spans -2..2 on both axes; the four anchors sit at +/-1.
 * ------------------------------------------------------------------ */
const S = 400;                                    // svg viewBox size
const toPx  = (v, psi) => [ (2 - v) * S / 4, (2 - psi) * S / 4 ];
const toVPsi = (x, y)  => [ 2 - x * 4 / S, 2 - y * 4 / S ];

// Colours are the darkened variants of the map's palette -- the field
// behind them is white-to-saturated now, not the dark canvas, so the
// bright originals wash out against it.
// Every fixture on the map, in one list. `draw` says how buildMap renders
// it: 'anchor' = a canonical corner, 'minor' = the smaller preference
// markers, 'ring' = the dashed perceptual-inversion points, 'centre' = the
// No-one/Confusion node that owns the origin. `stored` marks the points
// survey_placements has real distance columns for.
//
// This was four overlapping arrays (ANCHORS / INNER / EXTRA_POINTS /
// REFERENCE_POINTS) plus a `key === 'cf'` skip in the draw loop. Worse, the
// ring was decorative -- drawn, but excluded from classification -- so a
// respondent who followed the recap's instruction to place on the marked
// inner ring was told they were closest to that ring point's exact
// inversion. One list with flags removes the special-casing and lets the
// ring classify.
const POINTS = [
  { key: 'gg', label: 'Greater Good', sub: 'Productive · The Good Truth',   v:  1, psi:  1, color: '#0d6b2f', draw: 'anchor', stored: true },
  { key: 'le', label: 'Lesser Evil',  sub: 'Reductive · The Bad Lie',       v: -1, psi:  1, color: '#9c3a20', draw: 'anchor', stored: true },
  { key: 'ge', label: 'Greater Evil', sub: 'Regressive · The Bad Truth',    v: -1, psi: -1, color: '#b81f1f', draw: 'anchor', stored: true },
  { key: 'lg', label: 'Lesser Good',  sub: 'Constructive · The Good Lie',   v:  1, psi: -1, color: '#15708c', draw: 'anchor', stored: true },

  // No active/suppressive charge, so these sit on the psi=0 axis rather
  // than at a corner. Both have columns in survey_placements (d_gp/d_bp).
  { key: 'gp', label: 'Good Preference', v:  1, psi: 0, color: '#4a8a6e', draw: 'minor', stored: true },
  { key: 'bp', label: 'Bad Preference',  v: -1, psi: 0, color: '#8a5a4a', draw: 'minor', stored: true },
  { key: 'cf', label: 'Confusion',       v:  0, psi: 0, color: '#46505e', draw: 'centre' },

  // The perceptual inversion ring: each sits at half magnitude inside the
  // quadrant of its own opposite. That inversion is the entire point.
  { key: 'pge', label: 'Perc. Greater Evil', v:  0.5, psi:  0.5, color: '#b81f1f', draw: 'ring', inverts: 'gg' },
  { key: 'plg', label: 'Perc. Lesser Good',  v: -0.5, psi:  0.5, color: '#15708c', draw: 'ring', inverts: 'le' },
  { key: 'ple', label: 'Perc. Lesser Evil',  v:  0.5, psi: -0.5, color: '#9c3a20', draw: 'ring', inverts: 'lg' },
  { key: 'pgg', label: 'Perc. Greater Good', v: -0.5, psi: -0.5, color: '#0d6b2f', draw: 'ring', inverts: 'ge' },
];

const byKey    = k => POINTS.find(p => p.key === k);
const ANCHORS  = POINTS.filter(p => p.draw === 'anchor');
const STORED   = POINTS.filter(p => p.stored);
// Everything the readout lists a closeness figure for. The ring is excluded
// -- it is reported as a callout when you land on one, not as four more
// rows of numbers on every single question.
const REFERENCE_POINTS = POINTS.filter(p => p.draw !== 'ring');

// The stored answer: straight-line distance from the placed point to every
// point survey_placements has a column for -- the four canonical anchors
// plus the two preference anchors. 0 on the point itself, 2 to either
// side-neighbour, 2*sqrt(2) diagonally opposite.
function distances(v, psi) {
  const d = {};
  for (const a of STORED) d['d_' + a.key] = Math.hypot(v - a.v, psi - a.psi);
  return d;
}

// How close counts as "on" a marked ring point. The ring sits at half
// magnitude, exactly sqrt(0.5) from three other fixtures at once, so it can
// never win on distance alone -- (0.5, 0.5) is equidistant from Greater
// Good, Good Preference and Confusion, and the old scan silently returned
// whichever came first in the array, which was the ring point's own
// inversion.
//
// Snapping instead of tie-breaking is deliberate. A tie-break would also
// claim points like (0, 1) that are merely nearest-to a ring point without
// being on one, and would disagree with the equivalent test in schema.sql.
// This threshold is a radius in map units (the grid spans -2..2), so it is
// the same test in both layers.
const RING_SNAP = 0.2;

// Exact ties are common on this map -- (0, 1) is precisely 1.0 from Greater
// Good, Lesser Evil AND Confusion at once -- so the ordering has to be fully
// determined rather than left to whichever entry the array happens to list
// first. Distance, then label alphabetically: the same `order by dist, label`
// that nearest_point() in schema.sql uses, so the live readout and the
// server-side classification cannot disagree about the same placement.
function nearestAnchor(v, psi) {
  return POINTS
    .filter(a => a.draw !== 'ring' || Math.hypot(v - a.v, psi - a.psi) <= RING_SNAP)
    .map(a => [a, Math.hypot(v - a.v, psi - a.psi)])
    .sort((x, y) => x[1] - y[1] || x[0].label.localeCompare(y[0].label))[0][0];
}

function quadrant(v, psi) {
  if (v  >  0 && psi >  0) return 'Productive (Greater Good)';
  if (v <=  0 && psi >  0) return 'Reductive (Lesser Evil)';
  if (v  >  0 && psi <= 0) return 'Constructive (Lesser Good)';
  return 'Regressive (Greater Evil)';
}

const clamp = n => Math.max(-2, Math.min(2, n));

// Topic colours live on the section objects in survey-data, not in a second
// lookup keyed by section id -- that arrangement had to be hand-synced, and
// renaming a section silently dropped its colour to grey.

// A distance-based readout is hard to feel: is 1.9142 close or far? Convert
// to closeness instead, 0-100%: 100% right on the point, 0% at 2*sqrt(2)
// away (the distance between two diagonally opposite canonical anchors --
// e.g. Greater Good to Greater Evil). The origin sits at sqrt(2) from every
// canonical anchor, so Confusion reads as an even 50% to each of them,
// which is exactly the intuition it's meant to carry.
const CLOSE_SPAN = 2 * Math.SQRT2;
const closeness = d => Math.max(0, 100 * (1 - d / CLOSE_SPAN));

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
const SURVEY = JSON.parse(document.getElementById('survey-data').textContent);
const STORE_KEY = 'hegemony-survey:' + SURVEY.id;

const state = loadState();

// Section hub-and-spoke: which array indices belong to each topic, and
// where the menu step itself lives. Sections are contiguous runs in the
// flat steps array (see survey-data), so first/last per id is enough.
const SECTION_RANGE = {};
SURVEY.steps.forEach((s, i) => {
  if (!s.section) return;
  if (!SECTION_RANGE[s.section]) SECTION_RANGE[s.section] = { first: i, last: i };
  else SECTION_RANGE[s.section].last = i;
});
const MENU_INDEX = SURVEY.steps.findIndex(s => s.type === 'menu');

function stepAnswered(step) {
  if (step.type === 'place') return step.tokens.every(t => (state.placements[step.id] || {})[t.id]);
  if (step.type === 'choice') return (state.choices[step.id] || []).length > 0;
  if (step.type === 'text')   return (state.texts[step.id] || '').trim().length > 0;
  return true;
}

// Calibration is the only part that has to happen in order: everything
// before the menu is a linear run the respondent must finish before topics
// unlock. Past the menu the survey is hub-and-spoke and order is the
// respondent's business.
const CALIBRATION_DONE = () =>
  SURVEY.steps.slice(0, MENU_INDEX).every(s => !s.required || stepAnswered(s));

// The ceiling for the progress-bar scrubber.
//
// This used to be "the first required unanswered step in array order",
// which quietly assumed a linear survey. It is not one: pick a late topic
// off the menu, finish it, and the frontier still pointed at the first
// question of the first topic you skipped -- so the scrubber refused to
// return you to work you had actually completed, and reload dumped you
// into a topic you had deliberately passed over.
//
// During calibration the old linear rule is exactly right. After it, every
// answered step is fair game, plus the next unanswered step in whatever
// section you are currently in.
function computeFrontier() {
  if (!CALIBRATION_DONE()) {
    const idx = SURVEY.steps.findIndex(s => s.required && !stepAnswered(s));
    return idx === -1 ? SURVEY.steps.length - 1 : idx;
  }
  let last = MENU_INDEX;
  SURVEY.steps.forEach((s, i) => {
    if (!s.required || stepAnswered(s)) last = Math.max(last, i);
  });
  const step = SURVEY.steps[stepIndex];
  const range = step && step.section ? SECTION_RANGE[step.section] : null;
  if (range) {
    const next = SURVEY.steps.findIndex((s, i) =>
      i >= range.first && i <= range.last && s.required && !stepAnswered(s));
    if (next !== -1) last = Math.max(last, next);
  }
  return last;
}

// Where a returning respondent lands. Mid-calibration they resume exactly
// where they stopped, because that run is linear and has to be finished.
// Once calibration is done the hub is the honest answer -- it is the screen
// they were actually navigating from, and dropping them back into some
// half-finished topic they chose to leave is a worse guess than the menu.
function resumeIndex() {
  if (!state.stepIndex) return 0;
  return CALIBRATION_DONE() ? MENU_INDEX : computeFrontier();
}

let stepIndex = 0;
function isSectionComplete(id) {
  return SURVEY.steps.filter(s => s.section === id && s.required).every(stepAnswered);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* private mode, corrupt json -- start fresh */ }
  return { choices: {}, texts: {}, placements: {}, responseId: null };
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { /* storage full or blocked -- the run still works in memory */ }
}

/* ------------------------------------------------------------------ *
 * Map rendering
 * ------------------------------------------------------------------ */
function svgEl(name, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k, val] of Object.entries(attrs || {})) el.setAttribute(k, val);
  return el;
}

// One text helper for every label on the map, so the halo-behind-text
// treatment isn't respelled at each call site.
function mapTxt(host, x, y, str, o) {
  const t = svgEl('text', { x, y, fill: o.fill, 'font-size': o.size,
                            'text-anchor': o.anchor || 'middle' });
  if (o.bold)    t.setAttribute('font-weight', 'bold');
  if (o.opacity) t.setAttribute('fill-opacity', o.opacity);
  if (o.halo !== false) {
    t.setAttribute('stroke', '#ffffff');
    t.setAttribute('stroke-width', o.halo || 2.2);
    t.setAttribute('paint-order', 'stroke');
  }
  t.textContent = str;
  host.appendChild(t);
  return t;
}

/* ------------------------------------------------------------------ *
 * Map type scale.
 *
 * The map is drawn in a 400-unit viewBox and scaled to whatever width the
 * column gives it, so declared font-size is NOT rendered size. At 375px
 * the box lands around 313px -- a scale of ~0.78 -- which pushed the
 * 6.5-9.5 range down to 5.1-7.4 real pixels. Sub-6px type is not readable,
 * and this map carried 28 labels at once.
 *
 * So the scale is chosen from the viewport rather than fixed: phones get
 * larger type on the few labels that matter and lose the secondary lines
 * (anchor sub-titles, preference coordinates, ring names) entirely. The
 * fixtures stay drawn and stay classifiable -- only their captions go.
 * ------------------------------------------------------------------ */
function typeScale() {
  const narrow = window.matchMedia('(max-width: 700px)').matches;
  return narrow
    ? { anchor: 13, minor: 11.5, primary: 10, sub: 9, ring: 9.5, axis: 11,
        showSub: false, showRingLabel: false }
    : { anchor: 9.5, minor: 8.5, primary: 7.5, sub: 7, ring: 7, axis: 9,
        showSub: true,  showRingLabel: true };
}
let TYPE = typeScale();

function buildMap(step) {
  TYPE = typeScale();
  const svg = svgEl('svg', { class: 'map', viewBox: `0 0 ${S} ${S}`,
                             role: 'application',
                             'aria-label': 'Psochic Hegemony map. Drag each item onto the map to place it.' });

  // ---- the two moral fields -------------------------------------------
  // Good and Bad are not split down the middle: the boundary is a taiji S,
  // so Good reaches across the centre line at the top and Bad reaches back
  // under it at the bottom. Two arcs of radius S/4 -- the upper bulging
  // right, the lower bulging left -- make the S; the same arc string closes
  // to the left edge for one field and the right edge for the other, so the
  // two regions share an exact boundary with no seam between them.
  // A single cubic, written in (u, will) so it reads the way it was drawn:
  // pen down at 0u / +2will, up at 0u / -2will, handles pulled out along
  // 0will. The first handle is the Bad side and the second is Good -- that
  // order is what sends Good sweeping across the top and lets Bad reach back
  // underneath it at the bottom. Swapping the two mirrors the whole figure.
  //
  // HANDLE is the only knob for how pronounced the S is: with handles at
  // +/-h the curve peaks at 0.2887 * h. Full-length handles at +/-2u peak at
  // 0.577u, which overshoots the artwork; 1.4 lands at 0.404u.
  const HANDLE = 1.4;
  const P = (u, will) => toPx(u, will).join(' ');
  const CURVE      = `C ${P(-HANDLE, 0)}, ${P(HANDLE, 0)}, ${P(0, -2)}`;
  const GOOD_FIELD = `M 0 0 L ${P(0, 2)} ${CURVE} L 0 ${S} Z`;
  const BAD_FIELD  = `M ${S} 0 L ${P(0, 2)} ${CURVE} L ${S} ${S} Z`;
  const SPLIT      = `M ${P(0, 2)} ${CURVE}`;

  // Each field carries its own vertical gradient, clipped to its own side:
  // Good is saturated at the Active edge and washes out to white going down,
  // Bad is white at the top and saturates toward Suppressive.
  const defs = svgEl('defs', {});
  const grad = (id, stops) => {
    const g = svgEl('linearGradient', { id, gradientUnits: 'userSpaceOnUse',
                                        x1: 0, y1: 0, x2: 0, y2: S });
    for (const [offset, color, opacity] of stops)
      g.appendChild(svgEl('stop', { offset, 'stop-color': color, 'stop-opacity': opacity }));
    defs.appendChild(g);
  };
  // Neither field ever reaches white. In the artwork the weak end is a pale
  // tint, not bare paper -- the bottom-left stays visibly green and the
  // top-right visibly pink -- so both ramps bottom out around 0.26 instead
  // of fading to zero. Fading to zero left the centre and the two far
  // corners blank, which read as holes in the map rather than as a wash.
  // The two fields tile the whole square, so with a floor every part of the
  // map carries some colour.
  // One saturated hue per field, faded by opacity alone. Lightening the
  // colour toward white AND dropping the opacity fades twice over, which is
  // why the weak ends kept landing on bare paper however high the floor was
  // set. Holding the hue means 0.32 opacity still reads as a clear light
  // green or pink rather than as almost-white.
  grad('goodField', [['0%',  '#1faf52', 0.95], ['30%', '#1faf52', 0.78],
                     ['60%', '#22b355', 0.56], ['85%', '#26b95c', 0.40],
                     ['100%','#2cc063', 0.32]]);
  grad('badField',  [['0%',  '#d93b34', 0.32], ['15%', '#d93b34', 0.40],
                     ['40%', '#d63029', 0.56], ['70%', '#d62a23', 0.78],
                     ['100%','#d4231c', 0.95]]);
  svg.appendChild(defs);

  svg.appendChild(svgEl('rect', { x: 0, y: 0, width: S, height: S, fill: '#ffffff' }));
  svg.appendChild(svgEl('path', { d: GOOD_FIELD, fill: 'url(#goodField)' }));
  svg.appendChild(svgEl('path', { d: BAD_FIELD,  fill: 'url(#badField)'  }));

  // The division itself, drawn as a soft band over the seam.
  svg.appendChild(svgEl('path', { d: SPLIT, fill: 'none', stroke: '#6b7280',
    'stroke-opacity': 0.20, 'stroke-width': 11, 'stroke-linecap': 'round' }));
  svg.appendChild(svgEl('path', { d: SPLIT, fill: 'none', stroke: '#4b5563',
    'stroke-opacity': 0.45, 'stroke-width': 1.2 }));

  // Grid at every 0.5 units.
  for (let i = -2; i <= 2; i += 0.5) {
    const [gx] = toPx(i, 0), [, gy] = toPx(0, i);
    const major = Number.isInteger(i);
    svg.appendChild(svgEl('line', { x1: gx, y1: 0, x2: gx, y2: S,
      stroke: '#16202b', 'stroke-opacity': major ? 0.16 : 0.07, 'stroke-width': 1 }));
    svg.appendChild(svgEl('line', { x1: 0, y1: gy, x2: S, y2: gy,
      stroke: '#16202b', 'stroke-opacity': major ? 0.16 : 0.07, 'stroke-width': 1 }));
  }

  // Central axes.
  const [cx, cy] = toPx(0, 0);
  svg.appendChild(svgEl('line', { x1: 0, y1: cy, x2: S, y2: cy,
    stroke: '#16202b', 'stroke-opacity': 0.42, 'stroke-width': 1.2 }));
  svg.appendChild(svgEl('line', { x1: cx, y1: 0, x2: cx, y2: S,
    stroke: '#16202b', 'stroke-opacity': 0.42, 'stroke-width': 1.2 }));

  // Every fixture, one pass over POINTS. `draw` picks the treatment; the
  // secondary lines (anchor sub-titles, preference coordinates, the ring
  // names) are the first thing to go on a narrow screen -- see TYPE below.
  for (const p of POINTS) {
    const [px, py] = toPx(p.v, p.psi);

    if (p.draw === 'centre') {
      svg.appendChild(svgEl('circle', { cx: px, cy: py, r: 15, fill: '#ffffff',
        stroke: '#46505e', 'stroke-opacity': 0.6, 'stroke-width': 1.2 }));
      mapTxt(svg, px, py - 1, 'No-one', { size: TYPE.primary, fill: '#16202b', bold: true });
      if (TYPE.showSub) mapTxt(svg, px, py + 8, p.label, { size: TYPE.sub, fill: '#46505e' });
      continue;
    }

    if (p.draw === 'ring') {
      svg.appendChild(svgEl('circle', { cx: px, cy: py, r: 5, fill: '#ffffff',
        'fill-opacity': 0.5, stroke: p.color, 'stroke-opacity': 0.8,
        'stroke-width': 1, 'stroke-dasharray': '2 2' }));
      if (TYPE.showRingLabel)
        mapTxt(svg, px, py + 15, p.label, { size: TYPE.ring, fill: p.color, halo: 2 });
      continue;
    }

    // 'anchor' and 'minor' differ only in weight.
    const big = p.draw === 'anchor';
    svg.appendChild(svgEl('circle', { cx: px, cy: py, r: big ? 9 : 7.5,
      fill: p.color, 'fill-opacity': big ? 0.30 : 0.28,
      stroke: p.color, 'stroke-width': big ? 1.8 : 1.6 }));
    mapTxt(svg, px, py - (big ? 15 : 12), p.label,
      { size: big ? TYPE.anchor : TYPE.minor, fill: p.color, bold: true, halo: 2.6 });
    if (TYPE.showSub) {
      const sub = big ? p.sub : `(${p.v > 0 ? '+' + p.v : p.v}υ, 0ψ)`;
      mapTxt(svg, px, py + (big ? 21 : 18), sub,
        { size: TYPE.sub, fill: '#4b5563', opacity: 0.65, halo: 2.2 });
    }
  }

  // --- OVERLAY: Axis names, Corner Quadrants & Numeric Ticks (rendered above nodes) ---
  const axisTxt = (x, y, t, anchor, col, op) => {
    const el = svgEl('text', { x, y, fill: col || '#374151',
                               'font-size': col ? TYPE.axis - 0.5 : TYPE.axis,
                               'text-anchor': anchor, 'letter-spacing': '.08em',
                               'font-weight': 'bold',
                               stroke: '#ffffff', 'stroke-width': 2.6,
                               'paint-order': 'stroke' });
    if (op) el.setAttribute('opacity', op);
    else if (!col) el.setAttribute('fill-opacity', '0.75');
    else el.setAttribute('fill-opacity', '0.60');
    el.textContent = t; svg.appendChild(el);
  };

  // Corner quadrant names (faded ~50%)
  axisTxt(10,     22,    'PRODUCTIVE',   'start', '#0d6b2f', '0.50');
  axisTxt(S - 10, 22,    'REDUCTIVE',    'end',   '#9c3a20', '0.50');
  axisTxt(10,     S - 12,'CONSTRUCTIVE', 'start', '#15708c', '0.50');
  axisTxt(S - 10, S - 12,'REGRESSIVE',   'end',   '#b81f1f', '0.50');

  // Central Horizontal (υ) Axis Labels (faded ~25%)
  axisTxt(8,      cy - 7, 'GOOD  +2υ',        'start');
  axisTxt(S - 8,  cy - 7, '-2υ  BAD',         'end');

  // Central Vertical (ψ) Axis Labels & Ticks (faded 25%-40%)
  axisTxt(cx + 7, 14,     'ACTIVE  +2ψ',       'start');
  axisTxt(cx + 7, S - 6,  '-2ψ  SUPPRESSIVE',  'start');
  axisTxt(cx + 7, 103,    '+1ψ',              'start', '#4b5563');
  axisTxt(cx + 7, 303,    '-1ψ',              'start', '#4b5563');

  // Placed tokens, drawn last so they sit above everything.
  const layer = svgEl('g', { class: 'tokens' });
  svg.appendChild(layer);
  return { svg, layer };
}

function drawTokens(step, layer) {
  layer.textContent = '';
  const placed = state.placements[step.id] || {};
  for (const tok of step.tokens) {
    const p = placed[tok.id];
    if (!p) continue;
    const [px, py] = toPx(p.v, p.psi);
    const g = svgEl('g', { class: 'tok', 'data-token': tok.id, tabindex: '0',
                           role: 'button',
                           'aria-label': `${tok.label}, placed at ${quadrant(p.v, p.psi)}. Drag to move.` });
    g.appendChild(svgEl('line', { x1: px, y1: py, x2: px, y2: py })); // hit padding
    g.appendChild(svgEl('circle', { cx: px, cy: py, r: 11, fill: 'transparent' }));
    g.appendChild(svgEl('circle', { cx: px, cy: py, r: 6.5, fill: tok.color,
      stroke: '#ffffff', 'stroke-width': 2 }));
    // Label sits beside the dot, not above it: the anchors already own the
    // space above (their name) and below (their sub-title), so a centred
    // label lands right on top of "Greater Good" whenever a token is placed
    // near an anchor -- which is most of the time.
    const flip = px > S - 110;                  // too close to the right edge
    const t = svgEl('text', { x: px + (flip ? -13 : 13), y: py + 3.5,
                              fill: '#16202b', 'font-size': TYPE.minor, 'font-weight': 'bold',
                              'text-anchor': flip ? 'end' : 'start' });
    t.textContent = tok.label;
    g.appendChild(t);
    layer.appendChild(g);

    // Backing plate, sized from the text once it's laid out, so the label
    // stays readable over the grid and the saturated end of either field.
    const bb = t.getBBox();
    const plate = svgEl('rect', { x: bb.x - 3, y: bb.y - 2,
      width: bb.width + 6, height: bb.height + 4, rx: 2,
      fill: '#ffffff', 'fill-opacity': 0.88, stroke: tok.color,
      'stroke-opacity': 0.5, 'stroke-width': 0.7 });
    g.insertBefore(plate, t);
  }
}

/* ------------------------------------------------------------------ *
 * Place step: map + tray + live distance readout
 * ------------------------------------------------------------------ */
function renderPlace(step, host) {
  const row = document.createElement('div');
  row.className = 'maprow';

  const mapbox = document.createElement('div');
  mapbox.className = 'mapbox';

  const { svg, layer } = buildMap(step);
  mapbox.appendChild(svg);

  const tray = document.createElement('div');
  tray.className = 'tray';
  tray.innerHTML = `
    <div class="map-legend" style="background:var(--panel-2,#f6f8fa);border:1px solid var(--rule,#e5e7eb);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:11px;line-height:1.4">
      <div style="font-weight:700;color:var(--ink,#111827);margin-bottom:5px;font-size:11.5px;letter-spacing:.02em">Map Coordinate Legend</div>
      <div style="margin-bottom:5px;color:var(--ink-soft,#4b5563)">
        <strong style="color:var(--ink,#111827)">&upsilon; (Morality / Benefit):</strong>
        <div style="font-size:10px;color:var(--ink-soft,#6b7280);margin-top:1px">
          <span style="color:#0d6b2f">+2</span> Everyone &middot; <span style="color:#15708c">+1</span> Others &middot; <span style="color:#46505e">0</span> Neutral &middot; <span style="color:#9c3a20">-1</span> My Group &middot; <span style="color:#b81f1f">-2</span> Only Me
        </div>
      </div>
      <div style="color:var(--ink-soft,#4b5563)">
        <strong style="color:var(--ink,#111827)">&psi; (Will):</strong>
        <div style="font-size:10px;color:var(--ink-soft,#6b7280);margin-top:1px">
          <span style="color:#0d6b2f">+2</span> Active &middot; <span style="color:#15708c">+1</span> Proactive &middot; <span style="color:#46505e">0</span> Neutral &middot; <span style="color:#9c3a20">-1</span> Passive &middot; <span style="color:#b81f1f">-2</span> Suppressive
        </div>
      </div>
    </div>
    <h3>Items to place</h3>`;

  row.appendChild(mapbox);
  row.appendChild(tray);
  host.appendChild(row);

  if (!state.placements[step.id]) state.placements[step.id] = {};
  const placed = state.placements[step.id];
  let selected = step.tokens.find(t => !placed[t.id])?.id || step.tokens[0].id;

  const chips = new Map();
  for (const tok of step.tokens) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.token = tok.id;
    chip.innerHTML = `<span class="dot" style="background:${tok.color}"></span><span>${tok.label}</span>`;
    chip.tabIndex = 0;
    chip.addEventListener('click', () => { selected = tok.id; paint(); });
    chip.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selected = tok.id; paint(); }
    });
    startDragFrom(chip, tok.id);
    tray.appendChild(chip);
    chips.set(tok.id, chip);
  }

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = step.tokens.length > 1
    ? 'Drag each item onto the map, or select one and click where it belongs. Drag a placed dot to move it.'
    : 'Drag the item onto the map, or just click where it belongs.';
  tray.appendChild(hint);

  const readout = document.createElement('div');
  readout.className = 'readout';
  tray.appendChild(readout);

  const clear = document.createElement('button');
  clear.className = 'clr';
  clear.type = 'button';
  clear.textContent = 'Clear placements';
  clear.addEventListener('click', () => {
    state.placements[step.id] = {};
    selected = step.tokens[0].id;
    saveState(); paint();
  });
  tray.appendChild(clear);

  /* ---- placing ---- */
  // Screen -> viewBox via the SVG's own transform. Doing this with
  // getBoundingClientRect arithmetic instead is wrong by however much
  // preserveAspectRatio letterboxes the drawing inside a not-exactly-square
  // box -- about 0.025 units here, enough to miss an anchor you clicked on.
  function svgPoint(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const { x, y } = pt.matrixTransform(svg.getScreenCTM().inverse());
    return toVPsi(x, y).map(clamp);
  }

  function place(tokenId, v, psi) {
    const existing = state.placements[step.id][tokenId];
    const seq = existing ? existing.seq
              : Object.keys(state.placements[step.id]).length + 1;
    state.placements[step.id][tokenId] = { v, psi, seq };
    saveState();
    paint();
  }

  // Click-to-place for the selected token, and keyboard users.
  svg.addEventListener('click', e => {
    if (dragging) return;                    // pointerup already handled it
    const [v, psi] = svgPoint(e);
    place(selected, v, psi);
    const next = step.tokens.find(t => !state.placements[step.id][t.id]);
    if (next) selected = next.id;
    paint();
  });

  // One pointer-drag implementation, shared by tray chips and placed dots.
  let dragging = null, ghost = null;

  function startDragFrom(el, tokenId) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      dragging = tokenId;
      selected = tokenId;
      el.setPointerCapture?.(e.pointerId);
      ghost = document.createElement('div');
      ghost.className = 'dragghost';
      const tok = step.tokens.find(t => t.id === tokenId);
      ghost.innerHTML = `<span class="dot" style="width:11px;height:11px;border-radius:50%;background:${tok.color}"></span>${tok.label}`;
      document.body.appendChild(ghost);
      moveGhost(e);

      const onMove = ev => moveGhost(ev);
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (ghost) { ghost.remove(); ghost = null; }
        const r = svg.getBoundingClientRect();
        const inside = ev.clientX >= r.left && ev.clientX <= r.right &&
                       ev.clientY >= r.top  && ev.clientY <= r.bottom;
        if (inside) { const [v, psi] = svgPoint(ev); place(tokenId, v, psi); }
        // Defer clearing so the svg click handler above can see it was a drag.
        setTimeout(() => { dragging = null; }, 0);
        paint();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  function moveGhost(e) {
    if (!ghost) return;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
  }

  /* ---- paint ---- */
  function paint() {
    drawTokens(step, layer);
    // Re-arm drag on the freshly drawn dots.
    for (const g of layer.querySelectorAll('.tok')) startDragFrom(g, g.dataset.token);

    for (const [id, chip] of chips) {
      chip.dataset.placed = !!state.placements[step.id][id];
      chip.classList.toggle('sel', id === selected);
    }

    const rows = [];
    for (const tok of step.tokens) {
      const p = state.placements[step.id][tok.id];
      if (!p) continue;
      const near = nearestAnchor(p.v, p.psi);
      // Landing on a ring point is the perceptual inversion the calibration
      // taught, so say so outright. Without this the readout just names the
      // point's opposite and reads as a bug.
      const inv = near.draw === 'ring' ? byKey(near.inverts) : null;
      rows.push(`
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:var(--ink-soft);margin-bottom:5px">${tok.label}</div>
          ${inv ? `<div style="font-size:11.5px;line-height:1.45;margin:0 0 8px;padding:7px 9px;
              border:1px solid ${near.color}55;border-left:2px solid ${near.color};border-radius:4px;
              background:${near.color}12;color:var(--ink)">
              On <strong>${near.label}</strong> — the perceived point. True reading:
              <strong>${inv.label}</strong>.</div>` : ''}
          <table class="rd">
            <tr><th></th><th>closeness</th></tr>
            ${REFERENCE_POINTS.map(a => `
              <tr class="${a.key === near.key || (inv && a.key === inv.key) ? 'near' : ''}">
                <td>${a.label}</td><td>${closeness(Math.hypot(p.v - a.v, p.psi - a.psi)).toFixed(2)}%</td>
              </tr>`).join('')}
            <tr><td colspan="2" style="padding-top:6px;color:var(--ink-soft)">
              v ${p.v.toFixed(2)} &nbsp; ψ ${p.psi.toFixed(2)} &nbsp; · &nbsp; ${quadrant(p.v, p.psi)}
            </td></tr>
          </table>
        </div>`);
    }
    readout.innerHTML = rows.length ? rows.join('') :
      '<div style="font-size:12.5px;color:var(--ink-soft)">Nothing placed yet.</div>';
    clear.style.display = rows.length ? '' : 'none';

    updateNav();
  }

  paint();
  return () => step.tokens.every(t => state.placements[step.id][t.id]);
}

/* ------------------------------------------------------------------ *
 * Step rendering
 * ------------------------------------------------------------------ */
let isComplete = () => true;

function render() {
  const step = SURVEY.steps[stepIndex];
  const view = document.getElementById('view');
  view.textContent = '';
  isComplete = () => true;

  state.stepIndex = stepIndex;
  saveState();

  const eyebrow = document.createElement('p');
  eyebrow.className = 'eyebrow';
  eyebrow.textContent = `Step ${stepIndex + 1} of ${SURVEY.steps.length}`;
  view.appendChild(eyebrow);

  const h = document.createElement('h1');
  h.textContent = step.heading;
  view.appendChild(h);

  if (step.body) {
    const prose = document.createElement('div');
    prose.className = 'prose';
    for (const para of step.body) {
      const p = document.createElement('p');
      p.textContent = para;
      prose.appendChild(p);
    }
    view.appendChild(prose);
  }

  // Theory that supports a step without gating it. The calibration recaps
  // ran to five dense paragraphs before any interaction, which is a lot of
  // reading to demand of someone mid-run; the argument is kept in full,
  // just folded away by default.
  if (step.more && step.more.length) {
    const d = document.createElement('details');
    d.className = 'more';
    const sum = document.createElement('summary');
    sum.textContent = step.more_label || 'Read more';
    d.appendChild(sum);
    const inner = document.createElement('div');
    inner.className = 'prose';
    for (const para of step.more) {
      const p = document.createElement('p');
      p.textContent = para;
      inner.appendChild(p);
    }
    d.appendChild(inner);
    view.appendChild(d);
  }

  if (step.type === 'choice')      isComplete = renderChoice(step, view);
  else if (step.type === 'place')  isComplete = renderPlace(step, view);
  else if (step.type === 'text')   isComplete = renderText(step, view);
  else if (step.type === 'review') isComplete = renderReview(step, view);
  else if (step.type === 'menu')   isComplete = renderMenu(step, view);
  else if (step.type === 'collated') isComplete = renderCollated(step, view);

  if (step.type === 'place' && step.follow_up) {
    const lbl = document.createElement('p');
    lbl.style.cssText = 'margin:26px 0 8px;font-size:15px';
    lbl.textContent = step.follow_up;
    view.appendChild(lbl);
    const ta = document.createElement('textarea');
    ta.value = state.texts[step.id] || '';
    ta.addEventListener('input', () => { state.texts[step.id] = ta.value; saveState(); });
    view.appendChild(ta);
  }

  renderNav(view, step);
  updateNav();
  view.focus();
  window.scrollTo(0, 0);
}

function renderChoice(step, host) {
  const box = document.createElement('div');
  box.className = 'opts';
  const multi = !!step.multiple;
  const cur = state.choices[step.id] || [];

  for (const opt of step.options) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = multi ? 'checkbox' : 'radio';
    input.name = step.id;
    input.value = opt;
    input.checked = cur.includes(opt);
    input.addEventListener('change', () => {
      const sel = [...box.querySelectorAll('input:checked')].map(i => i.value);
      state.choices[step.id] = sel;
      saveState(); updateNav();
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(opt));
    box.appendChild(label);
  }
  host.appendChild(box);
  return () => !step.required || (state.choices[step.id] || []).length > 0;
}

function renderText(step, host) {
  const ta = document.createElement('textarea');
  ta.value = state.texts[step.id] || '';
  ta.addEventListener('input', () => {
    state.texts[step.id] = ta.value; saveState(); updateNav();
  });
  host.appendChild(ta);
  return () => !step.required || (state.texts[step.id] || '').trim().length > 0;
}

function renderReview(step, host) {
  const p = document.createElement('p');
  p.className = 'prose';
  p.textContent = 'Optional: a name or alias and a rough area, so responses can be told apart and grouped. Neither is used to identify you.';
  host.appendChild(p);

  const mk = (key, ph) => {
    const i = document.createElement('input');
    i.type = 'text'; i.placeholder = ph;
    i.style.marginBottom = '10px';
    i.value = (state[key] || '');
    i.addEventListener('input', () => { state[key] = i.value; saveState(); });
    host.appendChild(i);
    host.appendChild(document.createElement('br'));
  };
  mk('labelName', 'Name or alias (optional)');
  mk('labelLocation', 'Suburb or region (optional)');

  return () => true;
}

// Per-topic progress, used by both the menu cards and the collated legend.
function sectionStats(id) {
  const steps = SURVEY.steps.filter(s => s.section === id && s.required);
  const done  = steps.filter(stepAnswered).length;
  return { steps, done, total: steps.length,
           pct: steps.length ? done / steps.length * 100 : 0,
           complete: steps.length > 0 && done === steps.length };
}

function renderMenu(step, host) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin:20px 0 0;max-width:560px';

  // Sections are grouped so the five Political Compass / Temperament
  // sub-topics read as two families rather than as five near-identical
  // rows with a repeated prefix.
  const groups = SURVEY.groups || [{ id: null, title: null }];
  for (const g of groups) {
    const secs = (SURVEY.sections || []).filter(s => (s.group || null) === g.id);
    if (!secs.length) continue;

    if (g.title) {
      const gd = sectionStats;
      const gDone  = secs.reduce((n, s) => n + gd(s.id).done,  0);
      const gTotal = secs.reduce((n, s) => n + gd(s.id).total, 0);
      const h = document.createElement('div');
      h.style.cssText = 'display:flex;align-items:baseline;gap:9px;margin:22px 0 9px';
      h.innerHTML =
        `<span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;` +
        `text-transform:uppercase;color:var(--ink-soft)">${g.title}</span>` +
        (g.blurb ? `<span style="font-size:12px;color:var(--ink-soft);flex:1">${g.blurb}</span>` : '<span style="flex:1"></span>') +
        `<span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)">${gDone}/${gTotal}</span>`;
      wrap.appendChild(h);
    }

    const list = document.createElement('div');
    list.style.cssText = 'display:flex;flex-direction:column;gap:8px';
    for (const sec of secs) {
      const range = SECTION_RANGE[sec.id];
      const st = sectionStats(sec.id);
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'btn ghost';
      card.style.cssText = 'display:block;width:100%;text-align:left;padding:13px 16px';
      card.innerHTML =
        `<span style="display:flex;align-items:center;gap:8px">` +
        `<span style="width:9px;height:9px;border-radius:50%;flex:none;background:${sec.color}"></span>` +
        `<strong>${st.complete ? '✓ ' : ''}${sec.title}</strong></span>` +
        `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-weight:400">${sec.blurb}</div>` +
        `<div style="display:flex;align-items:center;gap:8px;margin-top:9px">` +
        `<div style="flex:1;height:4px;background:var(--panel-2);border-radius:99px;overflow:hidden">` +
        `<i style="display:block;height:100%;width:${st.pct}%;background:${st.complete ? 'var(--gg)' : 'var(--focus)'}"></i></div>` +
        `<span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);white-space:nowrap">${st.done}/${st.total}</span>` +
        `</div>`;
      card.disabled = !range;
      card.addEventListener('click', () => { stepIndex = range.first; render(); });
      list.appendChild(card);
    }
    wrap.appendChild(list);
  }
  host.appendChild(wrap);

  // The collated map is the payoff for the work, so it leads -- and it is
  // the step Review continues from, rather than a dead end reachable only
  // from here.
  const anyPlaced = collectCollatedItems().length > 0;
  const go = (type, label, primary, enabled) => {
    const idx = SURVEY.steps.findIndex(s => s.type === type);
    if (idx === -1) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (primary ? '' : ' ghost');
    b.style.marginTop = '18px';
    b.style.marginRight = '10px';
    b.textContent = label;
    b.disabled = enabled === false;
    b.addEventListener('click', () => { stepIndex = idx; render(); });
    host.appendChild(b);
  };
  go('collated', 'View your Collated Hegemony', true, anyPlaced);
  go('review',   'Review & Submit', false);

  return () => true;
}

/* ------------------------------------------------------------------ *
 * Collated results: every placed scenario from every topic, overlaid on
 * one map, plus a centroid per topic and one overall centroid.
 * ------------------------------------------------------------------ */
function collectCollatedItems() {
  const items = [];
  for (const step of SURVEY.steps) {
    if (step.type !== 'place' || !step.section) continue;
    const placed = state.placements[step.id] || {};
    for (const tok of step.tokens) {
      const p = placed[tok.id];
      if (!p) continue;
      items.push({ v: p.v, psi: p.psi, section: step.section, label: tok.label });
    }
  }
  return items;
}

function centroidOf(items) {
  if (!items.length) return null;
  const v   = items.reduce((s, i) => s + i.v,   0) / items.length;
  const psi = items.reduce((s, i) => s + i.psi, 0) / items.length;
  return { v, psi };
}

function renderCollated(step, host) {
  const items = collectCollatedItems();

  // One pass builds everything both the legend and the overlay need, so a
  // topic's colour, count and centroid are computed once rather than
  // rediscovered by three separate loops over SURVEY.sections.
  const bySection = new Map();
  for (const it of items) {
    if (!bySection.has(it.section)) bySection.set(it.section, []);
    bySection.get(it.section).push(it);
  }
  const topics = (SURVEY.sections || []).map(sec => {
    const own = bySection.get(sec.id) || [];
    return { ...sec, items: own, stats: sectionStats(sec.id), centroid: centroidOf(own) };
  });
  const overall = centroidOf(items);

  const row = document.createElement('div');
  row.className = 'maprow';

  const mapbox = document.createElement('div');
  mapbox.className = 'mapbox';
  const { svg, layer } = buildMap({ id: '__collated__', tokens: [] });
  mapbox.appendChild(svg);

  const tray = document.createElement('div');
  tray.className = 'tray';
  tray.innerHTML = '<h3>Topics</h3>';

  row.appendChild(mapbox);
  row.appendChild(tray);
  host.appendChild(row);

  for (const t of topics) {
    const line = document.createElement('div');
    line.style.cssText = 'display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:8px' +
      (t.items.length ? '' : ';opacity:.4');
    line.innerHTML =
      `<span style="width:11px;height:11px;border-radius:50%;background:${t.color};flex:none"></span>` +
      `<span style="flex:1">${t.title}</span>` +
      `<span style="font-family:var(--mono);font-size:11px;color:var(--ink-soft)">${t.items.length}/${t.stats.total}</span>`;
    tray.appendChild(line);
  }

  const summary = document.createElement('div');
  summary.className = 'readout';
  if (overall) {
    const near = nearestAnchor(overall.v, overall.psi);
    const inv = near.draw === 'ring' ? byKey(near.inverts) : null;
    summary.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px">
      Overall centre (${items.length} placements) &middot; closest to <strong>${near.label}</strong>${
        inv ? ` <span style="color:${near.color}">(perceived — true reading ${inv.label})</span>` : ''}</div>
      <div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)">
        v ${overall.v.toFixed(2)} &nbsp; ψ ${overall.psi.toFixed(2)} &nbsp; · &nbsp; ${quadrant(overall.v, overall.psi)}
      </div>`;
  } else {
    summary.innerHTML = '<div style="font-size:12.5px;color:var(--ink-soft)">Nothing placed yet — do a topic first.</div>';
  }
  tray.appendChild(summary);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'Hover a dot for what it was. This view is read-only — go back to a topic to change a placement.';
  tray.appendChild(hint);

  // ---- overlay: scatter, then per-topic centroids, then the overall ----
  layer.textContent = '';
  for (const t of topics) {
    for (const it of t.items) {
      const [px, py] = toPx(it.v, it.psi);
      const g = svgEl('g', {});
      g.appendChild(svgEl('circle', { cx: px, cy: py, r: 4, fill: t.color,
        'fill-opacity': 0.6, stroke: '#ffffff', 'stroke-width': 1 }));
      const title = svgEl('title', {});
      title.textContent = `${it.label} — ${t.title}`;
      g.appendChild(title);
      layer.appendChild(g);
    }
  }

  for (const t of topics) {
    if (!t.centroid) continue;
    const [px, py] = toPx(t.centroid.v, t.centroid.psi);
    layer.appendChild(svgEl('circle', { cx: px, cy: py, r: 9, fill: t.color,
      'fill-opacity': 0.28, stroke: t.color, 'stroke-width': 2.2 }));
    // Thirteen centroid captions on one map is unreadable at any size, and
    // hopeless on a phone -- the legend already names every colour, so the
    // labels are desktop-only and the <title> carries the name everywhere.
    const tip = svgEl('title', {});
    tip.textContent = `${t.title} — centre of ${t.items.length}`;
    layer.lastChild.appendChild(tip);
    if (TYPE.showSub)
      mapTxt(layer, px, py - 13, t.title, { size: TYPE.sub + 1, fill: t.color, bold: true, halo: 2.4 });
  }

  if (overall) {
    const [px, py] = toPx(overall.v, overall.psi);
    layer.appendChild(svgEl('rect', { x: px - 7, y: py - 7, width: 14, height: 14,
      transform: `rotate(45 ${px} ${py})`, fill: '#16202b', 'fill-opacity': 0.85,
      stroke: '#ffffff', 'stroke-width': 2 }));
    mapTxt(layer, px, py - 16, 'Overall',
      { size: TYPE.anchor, fill: '#16202b', bold: true, halo: 2.6 });
  }

  return () => true;
}

/* ------------------------------------------------------------------ *
 * Navigation
 * ------------------------------------------------------------------ */
function renderNav(host, step) {
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.id = 'nav';

  const range = step.section ? SECTION_RANGE[step.section] : null;

  const back = document.createElement('button');
  back.className = 'btn ghost';
  back.type = 'button';
  back.textContent = 'Back';
  back.disabled = stepIndex === 0;
  back.addEventListener('click', () => {
    stepIndex = (range && stepIndex === range.first && MENU_INDEX >= 0) ? MENU_INDEX : stepIndex - 1;
    render();
  });
  nav.appendChild(back);

  const last = stepIndex === SURVEY.steps.length - 1;

  // Finishing a topic returns you to the hub -- but say where you're going,
  // because an unlabelled "Continue" that teleports you out of a section is
  // disorienting. Finishing the LAST topic goes to the collated map
  // instead: it is the payoff for the work and was otherwise reachable only
  // from a button on the menu, so most respondents would never have seen it.
  const atSectionEnd = range && stepIndex === range.last && MENU_INDEX >= 0;
  const lastSectionId = (SURVEY.sections || []).slice(-1)[0]?.id;
  const atFinalTopicEnd = atSectionEnd && step.section === lastSectionId;
  const collatedIndex = SURVEY.steps.findIndex(s => s.type === 'collated');

  if (step.type !== 'menu') {
    const next = document.createElement('button');
    next.className = 'btn';
    next.id = 'nextBtn';
    next.type = 'button';
    next.textContent = last ? 'Submit'
      : atFinalTopicEnd && collatedIndex !== -1 ? 'See your Collated Hegemony ▸'
      : atSectionEnd ? 'Done — back to topics ▸'
      : 'Continue';
    next.addEventListener('click', () => {
      if (last) { submit(); return; }
      stepIndex = atFinalTopicEnd && collatedIndex !== -1 ? collatedIndex
                : atSectionEnd ? MENU_INDEX
                : stepIndex + 1;
      render();
    });
    nav.appendChild(next);
  }

  const msg = document.createElement('span');
  msg.className = 'msg';
  msg.id = 'navMsg';
  nav.appendChild(msg);

  host.appendChild(nav);
}

function updateNav() {
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !isComplete();

  const bar = document.getElementById('progBar');
  const num = document.getElementById('progNum');
  const required = SURVEY.steps.filter(s => s.required);
  const done = required.filter(stepAnswered).length;
  if (bar) bar.style.width = (required.length ? (done / required.length * 100) : 0) + '%';
  if (num) num.textContent = `${done}/${required.length}`;

  // A second, per-topic bar -- once you're inside a section, the overall
  // bar barely moves per question, so show progress within *this* topic too.
  const step = SURVEY.steps[stepIndex];
  const row = document.getElementById('sectionProgRow');
  if (step && step.section) {
    const secSteps = SURVEY.steps.filter(s => s.section === step.section && s.required);
    const secDone = secSteps.filter(stepAnswered).length;
    const secTitle = (SURVEY.sections || []).find(s => s.id === step.section)?.title || step.section;
    document.getElementById('sectionLabel').textContent = secTitle;
    document.getElementById('sectionProgBar').style.width = (secSteps.length ? (secDone / secSteps.length * 100) : 0) + '%';
    document.getElementById('sectionProgNum').textContent = `${secDone}/${secSteps.length}`;
    row.style.display = '';
  } else {
    row.style.display = 'none';
  }
}

// Click anywhere on the top progress bar to jump straight to the step at
// that relative position, instead of only walking Back/Continue one at a time.
document.getElementById('progBar').closest('.prog').addEventListener('click', e => {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  const target = Math.round(frac * (SURVEY.steps.length - 1));
  stepIndex = Math.min(target, computeFrontier());
  render();
});

// Persistent one-click way back to the topic hub from anywhere inside a
// section -- Back/Continue alone only reach it from a section's first or
// last question, which buries it once you're a couple questions in.
document.getElementById('toTopicsBtn').addEventListener('click', () => {
  if (MENU_INDEX >= 0) { stepIndex = MENU_INDEX; render(); }
});

/* ------------------------------------------------------------------ *
 * Export + submit
 * ------------------------------------------------------------------ */
// Single source for "what did they place, and what does it mean". Both the
// JSON blob and the relational rows are derived from this, so the two can no
// longer drift -- they previously ran their own near-identical loops and had
// already diverged on field names (v/psi vs u/will).
function eachPlacement(fn) {
  for (const [stepId, toks] of Object.entries(state.placements)) {
    for (const [tokenId, p] of Object.entries(toks)) {
      const near = nearestAnchor(p.v, p.psi);
      fn({
        stepId, tokenId, p,
        d: distances(p.v, p.psi),
        nearest: near,
        perceived: near.draw === 'ring' ? byKey(near.inverts) : null,
        quadrant: quadrant(p.v, p.psi),
      });
    }
  }
}

function buildExport() {
  const placements = {};
  eachPlacement(({ stepId, tokenId, p, d, nearest, perceived, quadrant }) => {
    (placements[stepId] ||= {})[tokenId] = {
      ...d,
      v: p.v, psi: p.psi,
      nearest: nearest.label,
      // A placement on the inversion ring means something specific: the
      // respondent put it where it is *perceived* to sit. Record both, or
      // the analysis can only ever see the perceived reading.
      perceived_point: perceived ? nearest.label : null,
      true_reading: perceived ? perceived.label : nearest.label,
      quadrant,
      sequence: p.seq,
    };
  });
  return {
    survey_id: SURVEY.id,
    version: 2,
    completed_at: new Date().toISOString(),
    label: { name: state.labelName || null, location: state.labelLocation || null },
    choices: state.choices,
    texts: state.texts,
    placements,
  };
}

async function submit() {
  const msg = document.getElementById('navMsg');
  const btn = document.getElementById('nextBtn');
  const set = (t, err) => { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); };

  if (!supa) { set('Supabase is not configured — nothing was sent.', true); return; }
  btn.disabled = true;
  set('Submitting…');

  const { session, error: authErr } = await ensureSession();
  if (authErr) { set(authErr.message, true); btn.disabled = false; return; }

  const payload = buildExport();
  const responseId = state.responseId || crypto.randomUUID();

  // Conflict on (survey_id, respondent_id) -- the invariant the schema
  // actually enforces -- not on the primary key. Targeting `id` meant that
  // if state.responseId was ever lost while the Supabase session survived
  // (they live under different localStorage keys, so any partial clear or
  // state migration does it) a fresh uuid was minted, sailed past the `id`
  // conflict check, and hit the unique index instead: a raw Postgres
  // constraint error in the respondent's face. Conflicting on the real
  // invariant makes a re-submit an update no matter which id we arrive with.
  const { data: saved, error: e1 } = await supa.from('survey_responses').upsert({
    id: responseId,
    respondent_id: session.user.id,
    survey_id: SURVEY.id,
    raw: payload,
    updated_at: new Date().toISOString(),
    label_name: payload.label.name,
    label_location: payload.label.location,
  }, { onConflict: 'survey_id,respondent_id' }).select('id').single();
  if (e1) { set(e1.message, true); btn.disabled = false; return; }

  // Use the id the row actually has -- on an update that is the original
  // id, which may not be the one we just generated.
  state.responseId = saved.id;
  saveState();

  // Delete-then-insert, so a cleared placement actually disappears rather
  // than lingering from the previous run.
  const rows = [];
  eachPlacement(({ stepId, tokenId, p, d }) => {
    rows.push({ response_id: saved.id, step_id: stepId, token_id: tokenId,
                ...d, u: p.v, will: p.psi,
                map_variant: 'perceptual', sequence: p.seq });
  });
  const answers = [];
  for (const [stepId, choice] of Object.entries(state.choices))
    answers.push({ response_id: responseId, step_id: stepId, choice });
  for (const [stepId, text] of Object.entries(state.texts)) {
    if (!text || !text.trim()) continue;
    const row = answers.find(a => a.step_id === stepId);
    if (row) row.text_answer = text; else
      answers.push({ response_id: responseId, step_id: stepId, text_answer: text });
  }

  for (const [table, data] of [['survey_placements', rows], ['survey_answers', answers]]) {
    const { error: delErr } = await supa.from(table).delete().eq('response_id', responseId);
    if (delErr) { set(`${table} cleanup: ${delErr.message}`, true); btn.disabled = false; return; }
    if (!data.length) continue;
    const { error } = await supa.from(table).insert(data);
    if (error) { set(`${table}: ${error.message}`, true); btn.disabled = false; return; }
  }

  set(`Submitted. ${rows.length} placements recorded.`);
  btn.textContent = 'Resubmit';
  btn.disabled = false;
}

stepIndex = resumeIndex();
render();
</script>
</body>
</html>
